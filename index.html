    { code: 'MbElement lines =\n    data.createElementAsLastChild(MbElement.TYPE_NAME, "lines", null);\nlines.setNamespace(MbJSON.NAMESPACE);\nlines.setName(MbJSON.ARRAY);\n\nfor (int i = 0; i < 3; i++) {\n    MbElement item =\n        lines.createElementAsLastChild(MbElement.TYPE_NAME, MbJSON.ITEM, null);\n    item.createElementAsLastChild(MbElement.TYPE_NAME_VALUE, "sku", "AB-" + i);\n    item.createElementAsLastChild(MbElement.TYPE_NAME_VALUE, "qty", i + 1);\n}', lang: 'java' },
    { h: 'Building XML' },
    { code: 'MbElement outRoot = outMessage.getRootElement();\n\nMbElement xml = outRoot.createElementAsLastChild(MbXMLNSC.PARSER_NAME);\nMbElement order = xml.createElementAsLastChild(MbElement.TYPE_NAME, "order", null);\n\n// an attribute\norder.createElementAsFirstChild(\n    MbXMLNSC.ATTRIBUTE, "id", "A100");\n\n// children\norder.createElementAsLastChild(MbElement.TYPE_NAME_VALUE, "customer", "Max");\n\nMbElement line = order.createElementAsLastChild(MbElement.TYPE_NAME, "line", null);\nline.createElementAsLastChild(MbElement.TYPE_NAME_VALUE, "sku", "AB-1234");\nline.createElementAsLastChild(MbElement.TYPE_NAME_VALUE, "qty", 2);', lang: 'java' },
    { h: 'Copying a branch across' },
    { code: '// copy the whole input body into the output, unchanged\nMbElement inBody = inAssembly.getMessage().getRootElement().getLastChild();\noutMessage.getRootElement().copyElementTree(inBody);', lang: 'java' },
    { h: 'Changing a value in place' },
    { code: 'MbMessage outMessage = new MbMessage(inAssembly.getMessage());\nMbElement city = outMessage.getRootElement()\n                          .getFirstElementByPath("/JSON/Data/customer/city");\nif (city != null) {\n    city.setValue(((String) city.getValue()).toUpperCase());\n}', lang: 'java' }
  ]);

  lesson(JV, 'java-routing', 'Terminals & Routing', 'Terminals & Routing', [
    { h: 'The output terminals' },
    { p: 'A JavaCompute node has two output terminals by default: <b>out</b> and <b>alternate</b>. You choose which one the message leaves by.' },
    { code: 'MbOutputTerminal out = getOutputTerminal("out");\nMbOutputTerminal alt = getOutputTerminal("alternate");\n\nif (isValid) {\n    out.propagate(outAssembly);\n} else {\n    alt.propagate(inAssembly);\n}', lang: 'java' },
    { h: 'A router node' },
    { code: 'package com.mayaracademy.flows;\n\nimport com.ibm.broker.plugin.*;\n\npublic class RouteByStatus extends MbJavaComputeNode {\n\n    public void evaluate(MbMessageAssembly inAssembly) throws MbException {\n\n        MbElement root = inAssembly.getMessage().getRootElement();\n        MbElement statusEl =\n            root.getFirstElementByPath("/JSON/Data/status");\n\n        String status = (statusEl == null)\n            ? "UNKNOWN"\n            : statusEl.getValueAsString();\n\n        if ("PAID".equals(status)) {\n            getOutputTerminal("out").propagate(inAssembly);\n        } else {\n            getOutputTerminal("alternate").propagate(inAssembly);\n        }\n    }\n}', lang: 'java', caption: 'No new message needed when you only route' },
    { h: 'Propagating more than once' },
    { p: 'You may call <code>propagate</code> several times to split one message into many.' },
    { code: 'MbElement[] lines =\n    inAssembly.getMessage().getRootElement()\n              .getAllElementsByPath("/XMLNSC/order/line");\n\nMbOutputTerminal out = getOutputTerminal("out");\n\nfor (MbElement line : lines) {\n    MbMessage outMessage = new MbMessage();\n    try {\n        MbElement outRoot = outMessage.getRootElement();\n        MbElement xml = outRoot.createElementAsLastChild(MbXMLNSC.PARSER_NAME);\n        xml.copyElementTree(line);\n\n        MbMessageAssembly outAssembly =\n            new MbMessageAssembly(inAssembly, outMessage);\n        out.propagate(outAssembly);\n    } finally {\n        outMessage.clearMessage();\n    }\n}', lang: 'java', caption: 'One message in, one message out per line' },
    { h: 'Throwing an error on purpose' },
    { code: 'if (orderId == null || orderId.isEmpty()) {\n    throw new MbUserException(\n        this,                        // the node\n        "evaluate()",                // the method\n        "MayarMessages",             // the message catalogue\n        "3001",                      // the message number\n        "The order id is required",  // the text\n        new Object[] { });           // inserts\n}', lang: 'java' },
    { note: 'Rethrowing an <code>MbException</code> lets the broker handle the rollback. Swallowing it with an empty catch block is how messages disappear without trace.' }
  ]);

  lesson(JV, 'java-cache', 'Global Cache', 'Global Cache from Java', [
    { h: 'What the global cache is for' },
    { p: 'The <b>global cache</b> is memory shared across nodes, flows and even integration servers. Use it for lookup data and for state that must survive between messages.' },
    { code: 'import com.ibm.broker.plugin.*;\nimport com.ibm.broker.globalcache.*;\n\npublic class CacheLookup extends MbJavaComputeNode {\n\n    public void evaluate(MbMessageAssembly inAssembly) throws MbException {\n\n        MbGlobalMap map = MbGlobalMap.getGlobalMap("countryMap");\n\n        // write\n        map.put("UAE", "United Arab Emirates");\n\n        // write with a time to live, in seconds\n        map.put("session-123", "active", 300);\n\n        // read\n        String name = (String) map.get("UAE");\n\n        // check and remove\n        if (map.containsKey("session-123")) {\n            map.remove("session-123");\n        }\n\n        MbMessage outMessage = new MbMessage(inAssembly.getMessage());\n        try {\n            MbElement data =\n                outMessage.getRootElement()\n                          .getFirstElementByPath("/JSON/Data");\n            data.createElementAsLastChild(\n                MbElement.TYPE_NAME_VALUE, "country", name);\n\n            getOutputTerminal("out").propagate(\n                new MbMessageAssembly(inAssembly, outMessage));\n        } finally {\n            outMessage.clearMessage();\n        }\n    }\n}', lang: 'java' },
    { h: 'Loading a cache once' },
    { code: 'private static final String MAP_NAME = "countryMap";\n\nprivate void ensureLoaded() throws MbException {\n    MbGlobalMap map = MbGlobalMap.getGlobalMap(MAP_NAME);\n\n    if (!map.containsKey("__loaded")) {\n        synchronized (CacheLookup.class) {\n            if (!map.containsKey("__loaded")) {\n                map.put("UAE", "United Arab Emirates");\n                map.put("EGY", "Egypt");\n                map.put("USA", "United States");\n                map.put("__loaded", Boolean.TRUE);\n            }\n        }\n    }\n}', lang: 'java' },
    { table: { headers: ['Method', 'Does'], rows: [
      ['<code>getGlobalMap(name)</code>', 'Open a named map'],
      ['<code>put(key, value)</code>', 'Store a value'],
      ['<code>put(key, value, ttlSeconds)</code>', 'Store with an expiry'],
      ['<code>get(key)</code>', 'Read a value, null when absent'],
      ['<code>containsKey(key)</code>', 'Check without reading'],
      ['<code>remove(key)</code>', 'Delete a key'],
      ['<code>keySet()</code>', 'Every key in the map']
    ] } },
    { note: 'The cache is shared across the whole integration node. Prefix your keys with your application name so two teams never collide.' }
  ]);

  lesson(JV, 'java-full', 'Java Full Example', 'JavaCompute Full Example', [
    { p: 'A production shaped node: copy the headers, read a JSON payload, transform it, route on the result, and clean up properly.' },
    { code: 'package com.mayaracademy.flows;\n\nimport com.ibm.broker.plugin.*;\n\npublic class TransformMessage extends MbJavaComputeNode {\n\n    public void evaluate(MbMessageAssembly inAssembly) throws MbException {\n\n        // 1. terminals\n        MbOutputTerminal out = getOutputTerminal("out");\n        MbOutputTerminal alt = getOutputTerminal("alternate");\n\n        MbMessage inMessage  = inAssembly.getMessage();\n        MbMessage outMessage = new MbMessage();\n        MbMessageAssembly outAssembly =\n            new MbMessageAssembly(inAssembly, outMessage);\n\n        try {\n            // 2. copy the headers (Properties, MQMD, HTTP and so on)\n            copyMessageHeaders(inMessage, outMessage);\n\n            // 3. find the body and check the domain\n            MbElement inputRoot = inMessage.getRootElement();\n            MbElement jsonRoot  = inputRoot.getLastChild();\n\n            if (jsonRoot != null && "JSON".equals(jsonRoot.getName())) {\n\n                MbElement nameEl = jsonRoot.getFirstElementByPath(\n                    "Data/Customer/Name");\n\n                String customerName =\n                    (nameEl == null) ? "Unknown" : nameEl.getValueAsString();\n\n                // 4. build the output body\n                MbElement outputRoot = outMessage.getRootElement();\n                MbElement jsonData = outputRoot\n                    .createElementAsLastChild(MbJSON.PARSER_NAME)\n                    .createElementAsLastChild(MbElement.TYPE_NAME, "Data", null);\n\n                MbElement response = jsonData.createElementAsLastChild(\n                    MbElement.TYPE_NAME, "Response", null);\n\n                response.createElementAsLastChild(\n                    MbElement.TYPE_NAME_VALUE, "Status", "PROCESSED");\n                response.createElementAsLastChild(\n                    MbElement.TYPE_NAME_VALUE, "Greeting", "Hello " + customerName);\n                response.createElementAsLastChild(\n                    MbElement.TYPE_NAME_VALUE, "ProcessedAt",\n                    System.currentTimeMillis());\n\n                // 5. send it down the out terminal\n                out.propagate(outAssembly);\n\n            } else {\n                // not JSON: pass the original message through unchanged\n                alt.propagate(inAssembly);\n            }\n\n        } catch (MbException e) {\n            // let the broker handle the rollback\n            throw e;\n        } finally {\n            // 6. always free the message you created\n            outMessage.clearMessage();\n        }\n    }\n\n    /** Copy every header, which is every child of Root except the body. */\n    private void copyMessageHeaders(MbMessage inMessage, MbMessage outMessage)\n            throws MbException {\n\n        MbElement outRoot = outMessage.getRootElement();\n        MbElement header  = inMessage.getRootElement().getFirstChild();\n\n        while (header != null && header.getNextSibling() != null) {\n            outRoot.copyElementTree(header);\n            header = header.getNextSibling();\n        }\n    }\n}', lang: 'java', caption: 'TransformMessage.java' },
    { h: 'The checklist this code follows' },
    { ol: [
      'Get the terminals first, so routing is obvious at the top.',
      'Copy the headers before touching the body.',
      'Check the parser name before assuming the domain.',
      'Guard every <code>getFirstElementByPath</code> against null.',
      'Rethrow <code>MbException</code> so the transaction rolls back.',
      'Free the message you created in a <code>finally</code> block.'
    ] },
    { note: 'Copy this structure into every new node. The details change, the shape does not.' }
  ]);

  lesson(JV, 'java-admin', 'Java Admin API', 'Admin API & Classpath', [
    { h: 'Controlling the broker from Java' },
    { p: 'Beyond message transformation, the <b>IBM Integration API</b> lets a standalone Java program deploy BAR files, start and stop flows, and read the state of an integration node.' },
    { code: 'import com.ibm.broker.config.proxy.*;\n\npublic class DeployBar {\n\n    public static void main(String[] args) throws Exception {\n\n        // connect to the integration node\n        BrokerConnectionParameters bcp =\n            new IntegrationNodeConnectionParameters("localhost", 4414);\n\n        BrokerProxy broker = BrokerProxy.getInstance(bcp);\n        broker.waitUntilNodeIsAvailable(30000);\n\n        // find the integration server\n        ExecutionGroupProxy server =\n            broker.getExecutionGroupByName("default");\n\n        // deploy a BAR file\n        DeployResult result =\n            server.deploy("/tmp/OrderFlow.bar", true, 60000);\n\n        System.out.println("Deploy result: " + result.getCompletionCode());\n\n        // list the flows and their state\n        java.util.Enumeration<MessageFlowProxy> flows =\n            server.getMessageFlows(null);\n\n        while (flows.hasMoreElements()) {\n            MessageFlowProxy flow = flows.nextElement();\n            System.out.println(flow.getName() + " running=" + flow.isRunning());\n        }\n\n        broker.disconnect();\n    }\n}', lang: 'java' },
    { h: 'Setting the classpath' },
    { p: 'A standalone program needs the broker JARs on its classpath. They live under the install directory.' },
    { code: '# Linux\nexport MQSI_CLASSPATH=/opt/ibm/ace-12.0.x/server/classes\njavac -cp "$MQSI_CLASSPATH/*" DeployBar.java\njava  -cp ".:$MQSI_CLASSPATH/*" DeployBar\n\n# Windows\nset MQSI_CLASSPATH=C:\\Program Files\\IBM\\ACE\\12.0.x\\server\\classes\njavac -cp "%MQSI_CLASSPATH%\\*" DeployBar.java\njava  -cp ".;%MQSI_CLASSPATH%\\*" DeployBar', lang: 'esql', caption: 'Compiling and running' },
    { h: 'Third party JARs inside a flow' },
    { p: 'To use a library such as Apache Commons or BouncyCastle inside a JavaCompute node, put the JAR where the integration server can find it:' },
    { ul: [
      'Best: add it to a <b>shared library</b> in the same application, so it deploys with the BAR.',
      'Or: drop it in the integration server\u2019s <code>shared-classes</code> directory.',
      'Or: set the <code>userLib</code> path on the integration server.',
      'Restart the integration server after adding a JAR to a shared directory.'
    ] },
    { note: 'IBM\u2019s references are the <a href="https://www.ibm.com/docs/en/app-connect/12.0.x?topic=overview-integration-api" target="_blank" rel="noopener">Integration API overview</a>, the <a href="https://www.ibm.com/docs/SSMKHH_10.0.0/com.ibm.etools.mft.doc/bz90370_.htm" target="_blank" rel="noopener">Java user defined extensions Javadoc</a> and the <a href="https://www.ibm.com/docs/en/integration-bus/10.0.0?topic=api-configuring-environment-developing-running-custom-integration-applications" target="_blank" rel="noopener">classpath configuration guide</a>.' }
  ]);
})();

<script>

  var LANGS = {
    esql: { kw: ['CREATE','COMPUTE','MODULE','END','MODULE;','DECLARE','SET','IF','THEN','ELSE','ELSEIF','ENDIF','WHILE','DO','BEGIN','RETURN','CALL','CASE','WHEN','ENDCASE','FOR','LOOP','REPEAT','UNTIL','LEAVE','ITERATE','THROW','PROPAGATE','DELETE','INSERT','UPDATE','SELECT','FROM','WHERE','VALUES','INTO','REFERENCE','NAMESPACE','CONSTANT','SHARED','EXTERNAL','FUNCTION','PROCEDURE','LANGUAGE','RESULTSET','TRUE','FALSE','NULL','AND','OR','NOT','AS','TYPE','FIELD','NAME','VALUE','OUTPUT','INPUT','TO','IN','ATOMIC','FILTER','MOVE','ATTACH','DETACH','FIRSTCHILD','LASTCHILD','NEXTSIBLING','PREVIOUSSIBLING','PARENT','IDENTITY','EXISTS','CARDINALITY','THE','ITEM'],
      fn: ['CAST','COALESCE','SUBSTRING','TRIM','UPPER','LOWER','LENGTH','POSITION','REPLACE','CURRENT_TIMESTAMP','CURRENT_DATE','CURRENT_TIME','CONTAINS','STARTSWITH','ENDSWITH','LTRIM','RTRIM','OVERLAY','TRANSLATE','ROUND','FLOOR','CEIL','ABS','MOD','RAND','UUIDASCHAR','ASBITSTREAM','CREATEFIELD','FIELDNAME','FIELDVALUE','FIELDTYPE','SAMEFIELD','LASTMOVE','PASSTHRU','EVAL','LIST','ROW','SUM','MAX','MIN','COUNT','AVG'] },
    java: { kw: ['public','private','protected','class','interface','extends','implements','void','return','new','if','else','for','while','do','switch','case','break','continue','try','catch','finally','throw','throws','import','package','static','final','this','super','null','true','false','int','long','double','float','boolean','char','byte','short','String','abstract','synchronized','instanceof','enum','var'],
      fn: ['MbMessage','MbElement','MbMessageAssembly','MbOutputTerminal','MbJavaComputeNode','MbException','MbJSON','MbXMLNSC','evaluate','propagate','getMessage','getRootElement','getFirstChild','getLastChild','getNextSibling','createElementAsLastChild','getFirstElementByPath','getValueAsString','clearMessage','getOutputTerminal','copyMessageHeaders','System','out','println'] },

    wsdl: { kw: ['definitions','types','message','part','portType','operation','input','output','fault','binding','soap:binding','soap:operation','soap:body','service','port','soap:address','import','documentation','name','type','element','targetNamespace','xmlns','style','transport','soapAction','location','binding'],
      fn: [] }

  function hlLang(src, lang) {
    var spec = LANGS[lang];
    if (!spec) return hl(src);
    var out = '', last = 0, m;
    var R = /(--[^\n]*|\/\/[^\n]*|\/\*[\s\S]*?\*\/|<!--[\s\S]*?-->|#[^\n]*)|('(?:''|[^'])*'|"(?:\\.|[^"\\])*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_:.]*)/g;
    R.lastIndex = 0;

      out += esc(src.slice(last, m.index));
      last = m.index + m[0].length;
      if (m[1]) out += '<span class="tc">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="ts">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="tn">' + esc(m[3]) + '</span>';
      else {
        var w = m[4], up = w.toUpperCase();
        var isKw = spec.kw.some(function (k) { return k === w || k.toUpperCase() === up; });

  function hl(src) {

      out += esc(src.slice(last, m.index));
      last = m.index + m[0].length;
      if (m[1]) out += '<span class="tc">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="ts">' + esc(m[2]) + '</span>';

  /* ---------- run a script ---------- */
  function runScript(script, payload, mime) {

  /* ---------- deterministic shuffle so answers are not always first ---------- */
  function shuffled(list, seed) {
    var idx = list.map(function (_, i) { return i; });
    var s = seed * 9301 + 49297;
    for (var i = idx.length - 1; i > 0; i--) {
      s = (s * 9301 + 49297) % 233280;
      var j = Math.floor((s / 233280) * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    return idx;
  }

  function renderQuiz(qs) {
    var wrap = el('div');
    var state = new Array(qs.length).fill(null);
    qs.forEach(function (q, n) {
      var box = el('div', 'qbox');
      box.appendChild(el('div', 'qn', 'Question ' + (n + 1) + ' of ' + qs.length));
      box.appendChild(el('h3', null, q.q));
      var opts = el('div', 'opts');
      var order = shuffled(q.o, n + 3);
      var buttons = [];
      order.forEach(function (origIdx, pos) {
        var b = el('button', 'opt');
        b.innerHTML = '<span class="bul">' + 'ABCD'[pos] + '</span><span>' + q.o[origIdx] + '</span>';
        b.dataset.orig = origIdx;
        opts.appendChild(b); buttons.push(b);
      });
      box.appendChild(opts);
      buttons.forEach(function (b) {
        b.onclick = function () {
          if (state[n] !== null) return;
          state[n] = (+b.dataset.orig === q.a);
          buttons.forEach(function (o) {
            o.disabled = true;
            if (+o.dataset.orig === q.a) o.classList.add('right');
          });
          if (!state[n]) b.classList.add('wrong');
          tally();
        };
      });
      wrap.appendChild(box);
    });
    var foot = el('div', 'quizfoot');
    var scoreEl = el('span', 'score', '0 / ' + qs.length);
    var msg = el('span', 'hint', 'Answer every question to see how you did.');
    var again = el('button', 'btn sec', 'Start again');
    again.onclick = function () { location.reload(); };
    foot.appendChild(scoreEl); foot.appendChild(msg); foot.appendChild(again);
    wrap.appendChild(foot);
    function tally() {
      var answered = state.filter(function (s) { return s !== null; }).length;
      var right = state.filter(function (s) { return s === true; }).length;
      scoreEl.textContent = right + ' / ' + qs.length;
      if (answered < qs.length) { msg.textContent = answered + ' answered, ' + (qs.length - answered) + ' to go.'; return; }
      var pct = Math.round(right / qs.length * 100);
      msg.textContent = pct >= 90 ? 'Excellent. You know DataWeave well.'
        : pct >= 70 ? 'Good work. Read the lessons you missed and try again.'
        : pct >= 50 ? 'Not bad. Go through the tutorial once more.'
        : 'Start again from DataWeave Intro. You will get it.';
    }
    return wrap;
  }

  /* ---------- practice bank ---------- */
  var PKEY = 'mayar.dw.practice.v1';
  function loadSolved() { try { return JSON.parse(localStorage.getItem(PKEY) || '{}') || {}; } catch (e) { return {}; } }
  function saveSolved(d) { try { localStorage.setItem(PKEY, JSON.stringify(d)); } catch (e) {} }
  function normalise(s) { return String(s).replace(/\s+/g, ' ').trim(); }

  function renderPractice() {
    var P = window.PRACTICE || [];
    var solved = loadSolved();
    var wrap = el('div');
    var PAGE = 20;
    var state = { topic: 'All', level: 'All', q: '', page: 0, only: 'all' };

    var topics = ['All'];
    P.forEach(function (x) { if (topics.indexOf(x.topic) < 0) topics.push(x.topic); });

    var bar = el('div', 'pfilters');
    function sel(list, onchange) {
      var s = document.createElement('select');
      list.forEach(function (o) { var op = document.createElement('option'); op.value = o; op.textContent = o; s.appendChild(op); });
      s.onchange = onchange; bar.appendChild(s); return s;
    }
    var tSel = sel(topics, function () { state.topic = this.value; state.page = 0; draw(); });
    var lSel = sel(['All', 'Easy', 'Medium', 'Hard'], function () { state.level = this.value; state.page = 0; draw(); });
    var oSel = sel(['All questions', 'Not solved yet', 'Solved'], function () {
      state.only = this.value === 'All questions' ? 'all' : (this.value === 'Solved' ? 'done' : 'todo');
      state.page = 0; draw();
    });
    var box = document.createElement('input');
    box.type = 'search'; box.placeholder = 'Search questions...';
    box.oninput = function () { state.q = this.value.toLowerCase(); state.page = 0; draw(); };
    bar.appendChild(box);
    var count = el('span', 'pcount', '');
    bar.appendChild(count);
    wrap.appendChild(bar);

    var list = el('div');
    wrap.appendChild(list);
    var pager = el('div', 'ppager');
    wrap.appendChild(pager);

    function matching() {
      return P.filter(function (x) {
        if (state.topic !== 'All' && x.topic !== state.topic) return false;
        if (state.level !== 'All' && x.level !== state.level) return false;
        if (state.only === 'done' && !solved[x.n]) return false;
        if (state.only === 'todo' && solved[x.n]) return false;
        if (state.q) {
          var hay = (x.n + ' ' + x.title + ' ' + x.task + ' ' + x.topic).toLowerCase();
          if (hay.indexOf(state.q) < 0) return false;
        }
        return true;
      });
    }

    function card(q) {
      var c = el('div', 'pq' + (solved[q.n] ? ' solved' : ''));
      var head = el('div', 'pqhead');
      head.appendChild(el('span', 'pqnum', '#' + q.n));
      var main = el('div', 'pqmain');
      main.appendChild(el('b', null, esc(q.title)));
      main.appendChild(el('span', null, q.task));
      head.appendChild(main);
      head.appendChild(el('span', 'chip', esc(q.topic)));
      head.appendChild(el('span', 'chip ' + q.level.toLowerCase(), esc(q.level)));
      if (solved[q.n]) head.appendChild(el('span', 'chip tick', '\u2713 Solved'));
      c.appendChild(head);

      var io = el('div', 'pqio' + (q.payload ? ' two' : ''));
      if (q.payload) {
        var i1 = el('div');
        i1.appendChild(el('div', 'iohead', 'Input &nbsp;(' + esc(q.payloadMime || 'application/json') + ')'));
        i1.appendChild(el('pre', null, esc(q.payload)));
        io.appendChild(i1);
      }
      var i2 = el('div');
      i2.appendChild(el('div', 'iohead', 'Expected output'));
      i2.appendChild(el('pre', 'exp', esc(q.expected || '')));
      io.appendChild(i2);
      c.appendChild(io);

      var foot = el('div', 'pqfoot');
      var open = el('button', 'btn', 'Solve it \u00bb');
      foot.appendChild(open);
      c.appendChild(foot);

      var work = null;
      open.onclick = function () {
        if (work) { work.remove(); work = null; open.innerHTML = 'Solve it \u00bb'; return; }
        work = buildWork(q, c, head);
        c.appendChild(work);
        open.textContent = 'Close';
        work.querySelector('textarea').focus();
      };
      return c;
    }

    function buildWork(q, cardEl, headEl) {
      var w = el('div', 'pwork');
      var f = el('div', 'field', '<label>Write your DataWeave here</label>');
      var ta = el('textarea', 'dw');
      ta.spellcheck = false;
      ta.value = q.start || '%dw 2.0\noutput application/json\n---\npayload';
      f.appendChild(ta); w.appendChild(f);

      var bar2 = el('div', 'play-bar');
      var run = el('button', 'btn', 'Run \u25b6');
      var check = el('button', 'btn', 'Check my answer');
      var showSol = el('button', 'btn sec', 'Show the answer');
      bar2.appendChild(run); bar2.appendChild(check); bar2.appendChild(showSol);
      w.appendChild(bar2);

      var oh = el('div', 'res-head', 'Your output');
      oh.style.cssText = 'margin-top:12px;border:1px solid var(--line);border-radius:8px 8px 0 0';
      var out = el('pre', 'res', '');
      out.style.cssText = 'border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px';
      w.appendChild(oh); w.appendChild(out);
      var verdict = el('div', 'verdict');
      verdict.hidden = true; verdict.style.marginTop = '10px';
      w.appendChild(verdict);

      function go() { fillResult(out, null, ta.value, q.payload, q.payloadMime); }
      run.onclick = go;
      check.onclick = function () {
        var r = runScript(ta.value, q.payload, q.payloadMime);
        go();
        verdict.hidden = false;
        if (!r.ok) {
          verdict.className = 'verdict no';
          verdict.innerHTML = '<b>Your script did not run.</b> Fix the error above and try again.';
          return;
        }
        if (normalise(r.output) === normalise(q.expected)) {
          verdict.className = 'verdict ok';
          verdict.innerHTML = '<b>Correct.</b> Your output matches the expected output exactly.';
          if (!solved[q.n]) { solved[q.n] = 1; saveSolved(solved); cardEl.classList.add('solved'); headEl.appendChild(el('span', 'chip tick', '\u2713 Solved')); }
        } else {
          verdict.className = 'verdict no';
          verdict.innerHTML = '<b>Not the same yet.</b> Compare your output with the expected output above. Whitespace does not matter, but the values and the order do.';
        }
      };
      var shown = false, solNode = null;
      showSol.onclick = function () {
        shown = !shown;
        if (shown) {
          solNode = el('div', 'field');
          solNode.style.marginTop = '12px';
          solNode.innerHTML = '<label>One correct answer</label>';
          var pre = el('pre', 'code', hl(q.solution));
          pre.style.cssText = 'border:1px solid var(--line);border-radius:8px';
          solNode.appendChild(pre);
          var use = el('button', 'btn sec', 'Put it in the editor');
          use.style.marginTop = '9px';
          use.onclick = function () { ta.value = q.solution; go(); };
          solNode.appendChild(use);
          w.appendChild(solNode);
          showSol.textContent = 'Hide the answer';
        } else { if (solNode) solNode.remove(); showSol.textContent = 'Show the answer'; }
      };
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); go(); }
        if (e.key === 'Tab') { e.preventDefault(); var st = this.selectionStart; this.value = this.value.slice(0, st) + '  ' + this.value.slice(this.selectionEnd); this.selectionStart = this.selectionEnd = st + 2; }
      });
      go();
      return w;
    }

    function draw() {
      var rows = matching();
      var done = P.filter(function (x) { return solved[x.n]; }).length;
      count.innerHTML = '<b>' + rows.length + '</b> shown &middot; ' + done + ' of ' + P.length + ' solved';
      list.innerHTML = '';
      var start = state.page * PAGE;
      var slice = rows.slice(start, start + PAGE);
      if (!slice.length) { list.appendChild(el('div', 'nores', 'No question matches those filters.')); }
      slice.forEach(function (q) { list.appendChild(card(q)); });
      pager.innerHTML = '';
      var pages = Math.ceil(rows.length / PAGE) || 1;
      var prev = el('button', 'btn sec', '\u2039 Previous');
      prev.disabled = state.page === 0;
      prev.onclick = function () { state.page--; draw(); window.scrollTo(0, 0); };
      var next = el('button', 'btn sec', 'Next \u203a');
      next.disabled = state.page >= pages - 1;
      next.onclick = function () { state.page++; draw(); window.scrollTo(0, 0); };
      pager.appendChild(prev);
      pager.appendChild(el('span', 'hint', 'Page ' + (state.page + 1) + ' of ' + pages));
      pager.appendChild(next);
    }
    draw();
    return wrap;
  }

  function renderBlocks(blocks, seed) {
    var frag = document.createDocumentFragment();
    blocks.forEach(function (b) {
      if (b.h) { frag.appendChild(el('h2', null, esc(b.h))); return; }
      if (b.p) { frag.appendChild(el('p', null, b.p)); return; }
      if (b.hero) { frag.appendChild(el('div', 'hero', b.hero)); return; }
      if (b.html) { var d = el('div', null, b.html); frag.appendChild(d); return; }
      if (b.lead) { frag.appendChild(el('p', 'lead', b.lead)); return; }
      if (b.ul) { frag.appendChild(el('ul', null, b.ul.map(function (i) { return '<li>' + i + '</li>'; }).join(''))); return; }
      if (b.ol) { frag.appendChild(el('ol', null, b.ol.map(function (i) { return '<li>' + i + '</li>'; }).join(''))); return; }
      if (b.code) {
        if (b.caption) {
          var cw = el('div', 'ex');

          ch.appendChild(el('span', 'ex-title', esc(b.caption)));

          ch.appendChild(el('span', 'watermark', 'Mayar'));
          cw.appendChild(ch);
          var cp = el('pre', 'code', b.lang ? hlLang(b.code, b.lang) : hl(b.code));
          cp.style.borderBottom = '0';
          cw.appendChild(cp);
          frag.appendChild(cw);
          return;
        }
        frag.appendChild(el('pre', 'plain', b.lang ? hlLang(b.code, b.lang) : hl(b.code)));
        return;
      }
      if (b.vs) { frag.appendChild(renderVs(b.vs)); return; }
      if (b.contact) { frag.appendChild(renderContact()); return; }
      if (b.practice) { frag.appendChild(renderPractice()); return; }
      if (b.note) { frag.appendChild(el('div', 'note', '<b class="tag">Note</b>' + b.note)); return; }
      if (b.flow) {
        var f = el('div', 'flow');
        b.flow.forEach(function (s, i) {
          if (i) f.appendChild(el('i', null, '&#8594;'));
          f.appendChild(el('span', i === 2 ? 'acc' : '', esc(s)));
        });
        frag.appendChild(f); return;
      }
      if (b.table) {
        var w = el('div', 'tablewrap');
        var t = el('table');
        t.innerHTML = '<thead><tr>' + b.table.headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead>'
          + '<tbody>' + b.table.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody>';
        w.appendChild(t); frag.appendChild(w); return;
      }
      if (b.ex) { frag.appendChild(renderExample(b.ex)); return; }
      if (b.task) { frag.appendChild(renderTask(b.task)); return; }
      if (b.quiz) { frag.appendChild(renderQuiz(b.quiz)); return; }
    });
    return frag;
  }

  /* ---------- track bar ---------- */
  var TRACKS = [
    { label: 'DataWeave', hash: 'home', cats: ['DataWeave Tutorial', 'DataWeave Basics', 'Selectors & Operators', 'Flow Control', 'Functions', 'Transform Data', 'Data Formats', 'Advanced', 'Reference & Practice', 'Tips & Best Practice'] },
    { label: 'Official Track', hash: 't1-1', cats: ['MuleSoft Official Track'] },
    { label: 'Homework', hash: 'practice', cats: ['DataWeave Homework'] },
    { label: 'OpenAPI', hash: 'oas-intro', cats: ['OpenAPI Tutorial'] },
    { label: 'RAML', hash: 'raml-intro', cats: ['RAML Tutorial'] },
    { label: 'XSD', hash: 'xsd-intro', cats: ['XML Schema Tutorial'] },
    { label: 'WSDL', hash: 'wsdl-intro', cats: ['WSDL Tutorial'] },
    { label: 'ESQL', hash: 'esql-intro', cats: ['IBM ESQL Tutorial'] },
    { label: 'IIB Java', hash: 'java-intro', cats: ['IBM IIB Java Tutorial'] },
    { label: 'Contact', hash: 'contact', cats: ['About Mayar Academy'] }
  ];
  var trackbar = document.getElementById('trackbar');
  TRACKS.forEach(function (t) {
    var a = el('a', null, esc(t.label));
    a.href = '#' + t.hash;
    a.dataset.track = t.label;
    trackbar.appendChild(a);
  });
  function markTrack(cat) {
    var active = null;
    TRACKS.forEach(function (t) { if (t.cats.indexOf(cat) >= 0) active = t.label; });
    var found = null;
    trackbar.querySelectorAll('a').forEach(function (a) {
      var on = a.dataset.track === active;
      a.classList.toggle('on', on);
      if (on) found = a;
    });
    if (found) {
      var br = trackbar.getBoundingClientRect(), ar = found.getBoundingClientRect();
      if (ar.left < br.left + 4 || ar.right > br.right - 4) {
        trackbar.scrollLeft += (ar.left - br.left) - (br.width / 2) + (ar.width / 2);
      }
    }
  }

  /* ---------- sidebar ---------- */
  var sidebar = document.getElementById('sidebar');
  function buildSidebar() {
    sidebar.innerHTML = '';
    var top = el('div', 'drawertop', '<b>All lessons</b>');
    var close = el('button', 'closebtn', '&#10005;');
    close.setAttribute('aria-label', 'Close the lesson menu');
    close.onclick = closeMenu;
    top.appendChild(close);
    sidebar.appendChild(top);
    var prog = el('div', 'progwrap');
    var pct = Math.round(Object.keys(done).length / L.length * 100);
    prog.innerHTML = '<div class="progtop"><span>Your progress</span><b>' + pct + '%</b></div>'
      + '<div class="progbar"><i style="width:' + pct + '%"></i></div>';
    sidebar.appendChild(prog);
    var lastCat = null;
    L.forEach(function (l) {
      if (l.cat !== lastCat) { sidebar.appendChild(el('div', 'catlabel', esc(l.cat))); lastCat = l.cat; }
      var a = el('a', 'lnk' + (done[l.id] ? ' done' : ''));
      a.href = '#' + l.id;
      a.dataset.id = l.id;
      a.innerHTML = '<span class="tick">&#10003;</span><span>' + esc(l.nav || l.title) + '</span>';
      sidebar.appendChild(a);
    });
    markActive();
  }
  function markActive() {
    var cur = (location.hash || '#home').slice(1);
    sidebar.querySelectorAll('a.lnk').forEach(function (a) { a.classList.toggle('on', a.dataset.id === cur); });
  }

  /* ---------- search ---------- */
  document.getElementById('search').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    var links = sidebar.querySelectorAll('a.lnk'), cats = sidebar.querySelectorAll('.catlabel');
    if (!q) {
      links.forEach(function (a) { a.style.display = ''; });
      cats.forEach(function (c) { c.style.display = ''; });
      var nr = sidebar.querySelector('.nores'); if (nr) nr.remove();
      return;
    }
    var hits = 0;
    links.forEach(function (a) {
      var l = byId[a.dataset.id];
      var hay = (l.title + ' ' + (l.nav || '') + ' ' + l.cat).toLowerCase();
      var show = hay.indexOf(q) >= 0;
      a.style.display = show ? '' : 'none';
      if (show) hits++;
    });
    cats.forEach(function (c) { c.style.display = 'none'; });
    var nr = sidebar.querySelector('.nores');
    if (!hits) { if (!nr) { var d = el('div', 'nores', 'No lesson matches that.'); sidebar.appendChild(d); } }
    else if (nr) nr.remove();
  });

  /* ---------- render a lesson ---------- */
  var main = document.getElementById('main');
  var rail = document.getElementById('rail');

  function pager(l, bottom) {
    var p = el('div', 'pager' + (bottom ? ' bottom' : ''));
    var prev = L[l.i - 1], next = L[l.i + 1];
    var b1 = el('a', 'pbtn ghost', '&#10094; Previous');
    if (prev) b1.href = '#' + prev.id; else { b1.classList.add('off'); b1.style.opacity = '.35'; b1.style.pointerEvents = 'none'; }
    var mid = el('span', 'where', bottom ? (next ? 'Next up: ' + esc(next.title) : 'That is the end. Well done!') : (l.i + 1) + ' of ' + L.length);
    var b2 = el('a', 'pbtn', 'Next &#10095;');
    if (next) b2.href = '#' + next.id; else { b2.style.opacity = '.35'; b2.style.pointerEvents = 'none'; }
    p.appendChild(b1); p.appendChild(mid); p.appendChild(b2);
    return p;
  }

  function show(id) {
    var l = byId[id] || L[0];
    main.innerHTML = '';
    main.appendChild(pager(l, false));
    if (l.id !== 'home') {
      main.appendChild(el('div', 'eyebrow', esc(l.cat)));
      main.appendChild(el('h1', null, esc(l.title)));
    }
    var body = el('div');
    body.appendChild(renderBlocks(l.blocks, l.i));
    main.appendChild(body);
    if (l.exercise) main.appendChild(renderExercise(l.exercise, l.i));
    main.appendChild(pager(l, true));

    /* on this page */
    var hs = body.querySelectorAll('h2');
    if (hs.length > 1) {
      rail.innerHTML = '<h4>On this page</h4>';
      hs.forEach(function (h, n) {
        h.id = 'sec' + n;
        var a = el('a', null, esc(h.textContent));
        a.href = '#' + id;
        a.onclick = function (e) { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        rail.appendChild(a);
      });
      rail.style.visibility = 'visible';
    } else { rail.innerHTML = ''; }

    markTrack(l.cat);
    document.title = l.id === 'home' ? 'Mayar Academy' : l.title + ' - Mayar Academy';
    if (!done[l.id]) { done[l.id] = 1; saveDone(done); }
    buildSidebar();
    var sq = document.getElementById('search');
    if (sq && sq.value.trim()) sq.dispatchEvent(new Event('input'));
    var active = sidebar.querySelector('a.lnk.on');
    if (active && active.scrollIntoView) {
      var r = active.getBoundingClientRect();
      if (r.top < 100 || r.bottom > window.innerHeight - 20) active.scrollIntoView({ block: 'center' });
    }
    window.scrollTo(0, 0);
    closeMenu();
  }

  /* ---------- navigation ---------- */
  function go(delta) {
    var cur = byId[(location.hash || '#home').slice(1)] || L[0];
    var t = L[cur.i + delta];
    if (t) location.hash = '#' + t.id;
  }
  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
  window.addEventListener('hashchange', function () { show((location.hash || '#home').slice(1)); });

  /* ---------- mobile menu ---------- */
  var scrim = document.getElementById('scrim');
  function closeMenu() { sidebar.classList.remove('open'); scrim.classList.remove('on'); document.body.classList.remove('searching'); }
  document.getElementById('menubtn').onclick = function () {
    sidebar.classList.toggle('open'); scrim.classList.toggle('on');
  };
  scrim.onclick = closeMenu;

  /* ---------- mobile search toggle ---------- */
  var searchBtn = document.getElementById('searchbtn');
  var searchInput = document.getElementById('search');
  searchBtn.onclick = function () {
    var on = document.body.classList.toggle('searching');
    if (on) searchInput.focus();
    else { searchInput.value = ''; searchInput.dispatchEvent(new Event('input')); }
  };
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { document.body.classList.remove('searching'); this.blur(); }
  });

  /* ---------- start ---------- */
  buildSidebar();
  show((location.hash || '#home').slice(1));
})();
</script>

</body>
</html>
