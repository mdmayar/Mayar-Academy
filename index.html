/* Mayar Academy - Lessons part 11: OpenAPI Specification (OAS / Swagger) */
(function () {
  var L = (window.LESSONS = window.LESSONS || []);
  var C = 'OpenAPI Tutorial';
  function lesson(id, nav, title, blocks, exercise) {
    var o = { id: id, cat: C, title: title, nav: nav, blocks: blocks };
    if (exercise) o.exercise = exercise;
    L.push(o);
  }

  lesson('oas-intro', 'OpenAPI Intro', 'OpenAPI Intro', [
    { h: 'What is OpenAPI?' },
    { p: 'The <b>OpenAPI Specification</b>, often shortened to <b>OAS</b>, is a standard way to describe a REST API in one file. It is the most widely used API description format in the world.' },
    { p: 'It answers the same questions RAML does: what endpoints exist, what goes in, what comes back, how the API is secured. The difference is that OpenAPI is a vendor neutral standard managed by the <b>OpenAPI Initiative</b>, and almost every API tool on earth reads it.' },
    { h: 'Swagger or OpenAPI?' },
    { p: 'People use the two words as if they mean the same thing. They do not.' },
    { table: { headers: ['Name', 'What it really is'], rows: [
      ['<b>Swagger 2.0</b>', 'The old name of the specification, version 2.0. Files start with <code>swagger: "2.0"</code>.'],
      ['<b>OpenAPI 3.0 / 3.1</b>', 'The current specification. Files start with <code>openapi: 3.0.3</code> or <code>openapi: 3.1.0</code>.'],
      ['<b>Swagger UI</b>', 'A tool that renders the file as browsable documentation.'],
      ['<b>Swagger Editor</b>', 'A browser editor for writing the file.'],
      ['<b>Swagger Codegen</b>', 'A tool that generates client and server code from the file.']
    ] } },
    { p: 'So: <b>Swagger</b> today means the tools. <b>OpenAPI</b> means the specification. Write OpenAPI 3, and use the Swagger tools to view it.' },
    { h: 'YAML or JSON?' },
    { p: 'An OpenAPI file can be written in either. YAML is easier for humans and is what almost everyone uses. JSON is the same document with brackets.' },
    { code: 'openapi: 3.0.3\ninfo:\n  title: Mayar Bookstore API\n  version: "1.0.0"\npaths:\n  /books:\n    get:\n      summary: List every book\n      responses:\n        "200":\n          description: A list of books\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  type: object\n                  properties:\n                    id:    { type: integer }\n                    title: { type: string }', lang: 'oas', caption: 'A complete, valid OpenAPI 3 file in YAML' },
    { code: '{\n  "openapi": "3.0.3",\n  "info": { "title": "Mayar Bookstore API", "version": "1.0.0" },\n  "paths": {\n    "/books": {\n      "get": {\n        "summary": "List every book",\n        "responses": {\n          "200": { "description": "A list of books" }\n        }\n      }\n    }\n  }\n}', lang: 'oas', caption: 'The same file in JSON' },
    { h: 'Why write it?' },
    { ul: [
      'Swagger UI turns it into live documentation people can try in the browser.',
      'Code generators build clients in Java, Python, TypeScript and thirty other languages.',
      'Mock servers such as Prism serve fake responses before the API exists.',
      'API gateways import it to configure routing, validation and rate limits.',
      'MuleSoft Anypoint Platform imports OpenAPI directly into Exchange and Design Center.',
      'Contract tests check that the running API still matches the file.'
    ] },
    { note: 'OpenAPI 3.1 is fully compatible with JSON Schema. 3.0 uses a slightly modified subset. If you are starting fresh and your tools support it, use 3.1.' }
  ], {
    q: 'What is the difference between Swagger and OpenAPI today?',
    options: ['Swagger is the tooling, OpenAPI is the specification', 'They are two competing specifications', 'Swagger is JSON, OpenAPI is YAML', 'Swagger is newer than OpenAPI'],
    answer: 0,
    explain: 'Swagger 2.0 was the old spec name. The spec is now called OpenAPI; Swagger UI, Editor and Codegen are tools that read it.'
  });

  lesson('oas-structure', 'OpenAPI Structure', 'OpenAPI Structure', [
    { h: 'The top level keys' },
    { table: { headers: ['Key', 'Required', 'Holds'], rows: [
      ['<code>openapi</code>', 'Yes', 'The spec version, for example <code>3.0.3</code>'],
      ['<code>info</code>', 'Yes', 'Title, version, description, contact, licence'],
      ['<code>servers</code>', 'No', 'The base URLs the API is served from'],
      ['<code>paths</code>', 'Yes*', 'Every endpoint and its operations'],
      ['<code>components</code>', 'No', 'Reusable schemas, parameters, responses, security schemes'],
      ['<code>security</code>', 'No', 'The security applied to the whole API'],
      ['<code>tags</code>', 'No', 'Groups used to organise the documentation'],
      ['<code>externalDocs</code>', 'No', 'A link to more documentation']
    ] } },
    { p: '<small>* In OpenAPI 3.1 <code>paths</code> may be left out if the document only defines <code>webhooks</code> or <code>components</code>.</small>' },
    { h: 'info' },
    { code: 'openapi: 3.0.3\n\ninfo:\n  title: Mayar Bookstore API\n  version: "1.0.0"\n  description: |\n    A small bookstore API used to teach OpenAPI at Mayar Academy.\n    Every endpoint returns JSON.\n  termsOfService: https://mayaracademy.com/terms\n  contact:\n    name: Mayar Academy\n    url: https://mayaracademy.com\n  license:\n    name: Apache 2.0\n    url: https://www.apache.org/licenses/LICENSE-2.0.html', lang: 'oas' },
    { note: 'Always quote the version: <code>version: "1.0.0"</code>. Without quotes, YAML reads <code>1.0</code> as a number and drops the trailing zero.' },
    { h: 'servers' },
    { p: 'A list, so you can describe production, staging and local in one file. Variables in braces get their own definition.' },
    { code: 'servers:\n  - url: https://api.mayaracademy.com/v1\n    description: Production\n  - url: https://staging-api.mayaracademy.com/v1\n    description: Staging\n  - url: http://localhost:8081/v1\n    description: Local development\n\n  - url: https://{region}.mayaracademy.com/{version}\n    description: Regional\n    variables:\n      region:\n        default: eu\n        enum: [ eu, us, ap ]\n      version:\n        default: v1', lang: 'oas' },
    { h: 'tags' },
    { code: 'tags:\n  - name: books\n    description: Everything about books\n  - name: authors\n    description: Everything about authors\n\npaths:\n  /books:\n    get:\n      tags: [ books ]\n      summary: List every book', lang: 'oas' },
    { note: 'Swagger UI groups the whole page by tag. On an API with fifty endpoints, good tags are the difference between usable docs and a wall of text.' }
  ]);

  lesson('oas-paths', 'OpenAPI Paths', 'OpenAPI Paths & Operations', [
    { h: 'paths' },
    { p: 'Unlike RAML, OpenAPI paths are <b>not nested</b>. Each one is written out in full.' },
    { code: 'paths:\n  /books:\n    get: ...\n    post: ...\n\n  /books/{bookId}:\n    get: ...\n    put: ...\n    delete: ...\n\n  /books/{bookId}/reviews:\n    get: ...\n    post: ...', lang: 'oas' },
    { h: 'An operation' },
    { code: 'paths:\n  /books:\n    get:\n      tags: [ books ]\n      summary: List every book\n      description: |\n        Returns every book in the shop, newest first.\n        Use the page and size parameters to page through results.\n      operationId: listBooks\n      responses:\n        "200":\n          description: A list of books\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: "#/components/schemas/Book"', lang: 'oas' },
    { table: { headers: ['Field', 'What it is for'], rows: [
      ['<code>summary</code>', 'One short line. This is what shows in the endpoint list.'],
      ['<code>description</code>', 'The long explanation. Markdown is allowed.'],
      ['<code>operationId</code>', 'A unique name. Code generators turn it into a method name, so make it a verb.'],
      ['<code>tags</code>', 'Which group this operation belongs to.'],
      ['<code>deprecated</code>', 'Set <code>true</code> and the docs strike it through.'],
      ['<code>parameters</code>', 'Path, query, header and cookie parameters.'],
      ['<code>requestBody</code>', 'The body sent in.'],
      ['<code>responses</code>', 'Every status code that can come back.'],
      ['<code>security</code>', 'Security for this one operation.']
    ] } },
    { h: 'Shared parameters for a whole path' },
    { p: 'Parameters written at the path level apply to every operation under it. This is where a path parameter belongs.' },
    { code: 'paths:\n  /books/{bookId}:\n    parameters:\n      - name: bookId\n        in: path\n        required: true\n        description: The id of the book\n        schema:\n          type: integer\n          format: int64\n\n    get:\n      summary: Get one book\n      operationId: getBook\n      responses:\n        "200":\n          description: The book\n        "404":\n          description: No book with that id\n\n    delete:\n      summary: Delete one book\n      operationId: deleteBook\n      responses:\n        "204":\n          description: Deleted', lang: 'oas' },
    { note: 'Every <code>{placeholder}</code> in a path <b>must</b> have a matching parameter with <code>in: path</code> and <code>required: true</code>. A file that misses one will not validate.' }
  ], {
    q: 'How are nested resources written in OpenAPI?',
    options: ['Each full path is its own key', 'They are nested like folders', 'With a <code>children:</code> key', 'With a <code>parent:</code> reference'],
    answer: 0,
    explain: 'OpenAPI paths are flat. /books and /books/{id}/reviews are two separate top level keys.'
  });

  lesson('oas-params', 'OpenAPI Parameters', 'OpenAPI Parameters', [
    { h: 'The four places a parameter can live' },
    { table: { headers: ['<code>in</code>', 'Means', 'Example'], rows: [
      ['<code>path</code>', 'Part of the URL. Always required.', '<code>/books/{bookId}</code>'],
      ['<code>query</code>', 'After the question mark', '<code>?page=2&amp;size=20</code>'],
      ['<code>header</code>', 'An HTTP header', '<code>X-Request-Id: abc</code>'],
      ['<code>cookie</code>', 'A cookie value', '<code>Cookie: session=abc</code>']
    ] } },
    { code: 'paths:\n  /books:\n    get:\n      parameters:\n        - name: author\n          in: query\n          required: false\n          description: Filter by author name\n          schema:\n            type: string\n\n        - name: page\n          in: query\n          schema:\n            type: integer\n            minimum: 1\n            default: 1\n\n        - name: size\n          in: query\n          schema:\n            type: integer\n            minimum: 1\n            maximum: 100\n            default: 20\n\n        - name: status\n          in: query\n          schema:\n            type: string\n            enum: [ AVAILABLE, OUT_OF_STOCK ]\n\n        - name: X-Request-Id\n          in: header\n          required: false\n          schema:\n            type: string\n            format: uuid', lang: 'oas' },
    { h: 'Arrays in a query string' },
    { p: 'There is more than one way to put a list in a URL, so you say which one you mean.' },
    { code: '- name: tags\n  in: query\n  schema:\n    type: array\n    items:\n      type: string\n  style: form\n  explode: true      # ?tags=a&tags=b\n\n- name: ids\n  in: query\n  schema:\n    type: array\n    items:\n      type: integer\n  style: form\n  explode: false     # ?ids=1,2,3', lang: 'oas' },
    { h: 'Examples on a parameter' },
    { code: '- name: bookId\n  in: path\n  required: true\n  schema:\n    type: integer\n  example: 42\n\n- name: sort\n  in: query\n  schema:\n    type: string\n  examples:\n    byTitle:\n      summary: Sort by title\n      value: title\n    byPriceDesc:\n      summary: Most expensive first\n      value: "-price"', lang: 'oas' },
    { note: 'Use <code>example</code> for one value and <code>examples</code> for several named ones. Never both on the same object.' }
  ]);

  lesson('oas-bodies', 'OpenAPI Bodies', 'OpenAPI Request & Response Bodies', [
    { h: 'requestBody' },
    { p: 'In OpenAPI 3 the body is not a parameter. It has its own key, and it is keyed by media type.' },
    { code: 'paths:\n  /books:\n    post:\n      summary: Add a new book\n      operationId: createBook\n      requestBody:\n        required: true\n        description: The book to add\n        content:\n          application/json:\n            schema:\n              $ref: "#/components/schemas/NewBook"\n            example:\n              title: DataWeave 101\n              author: Mayar\n              price: 29.99\n      responses:\n        "201":\n          description: The book was created\n          headers:\n            Location:\n              description: Where to find the new book\n              schema:\n                type: string\n          content:\n            application/json:\n              schema:\n                $ref: "#/components/schemas/Book"', lang: 'oas' },
    { h: 'More than one media type' },
    { code: 'requestBody:\n  content:\n    application/json:\n      schema:\n        $ref: "#/components/schemas/Book"\n    application/xml:\n      schema:\n        $ref: "#/components/schemas/Book"\n    text/csv:\n      schema:\n        type: string\n    multipart/form-data:\n      schema:\n        type: object\n        properties:\n          cover:\n            type: string\n            format: binary\n          metadata:\n            $ref: "#/components/schemas/Book"', lang: 'oas' },
    { h: 'responses' },
    { p: 'Every status code you can return gets an entry. <code>description</code> is required on each one.' },
    { code: 'responses:\n  "200":\n    description: The book was found\n    content:\n      application/json:\n        schema:\n          $ref: "#/components/schemas/Book"\n  "400":\n    description: The request was not valid\n    content:\n      application/json:\n        schema:\n          $ref: "#/components/schemas/Error"\n  "404":\n    description: No book with that id\n  "500":\n    description: Something went wrong on our side\n  default:\n    description: Any other error\n    content:\n      application/json:\n        schema:\n          $ref: "#/components/schemas/Error"', lang: 'oas' },
    { note: 'Status codes must be quoted in YAML. <code>200:</code> without quotes is the number two hundred, and some parsers will reject it.' },
    { h: 'Several named examples' },
    { code: 'responses:\n  "200":\n    description: A list of books\n    content:\n      application/json:\n        schema:\n          type: array\n          items:\n            $ref: "#/components/schemas/Book"\n        examples:\n          twoBooks:\n            summary: A normal response\n            value:\n              - id: 1\n                title: DataWeave 101\n              - id: 2\n                title: Mule in Action\n          empty:\n            summary: Nothing found\n            value: []', lang: 'oas' }
  ]);

  lesson('oas-schemas', 'OpenAPI Schemas', 'OpenAPI Schemas', [
    { h: 'components/schemas' },
    { p: 'Define a shape once, then point at it from everywhere with <code>$ref</code>.' },
    { code: 'components:\n  schemas:\n    Book:\n      type: object\n      required: [ id, title, price ]\n      properties:\n        id:\n          type: integer\n          format: int64\n          example: 1\n        title:\n          type: string\n          minLength: 1\n          maxLength: 200\n          example: DataWeave 101\n        author:\n          type: string\n        price:\n          type: number\n          format: double\n          minimum: 0\n          example: 29.99\n        status:\n          type: string\n          enum: [ AVAILABLE, OUT_OF_STOCK ]\n          default: AVAILABLE\n        publishedOn:\n          type: string\n          format: date\n          example: "2026-08-29"\n        tags:\n          type: array\n          items:\n            type: string\n          uniqueItems: true', lang: 'oas' },
    { h: 'Types and formats' },
    { table: { headers: ['type', 'Useful formats'], rows: [
      ['<code>string</code>', '<code>date</code>, <code>date-time</code>, <code>password</code>, <code>byte</code>, <code>binary</code>, <code>email</code>, <code>uuid</code>, <code>uri</code>'],
      ['<code>number</code>', '<code>float</code>, <code>double</code>'],
      ['<code>integer</code>', '<code>int32</code>, <code>int64</code>'],
      ['<code>boolean</code>', '&ndash;'],
      ['<code>array</code>', 'needs <code>items</code>'],
      ['<code>object</code>', 'needs <code>properties</code>']
    ] } },
    { h: 'Validation keywords' },
    { code: 'properties:\n  email:\n    type: string\n    format: email\n    pattern: "^[^@]+@[^@]+\\\\.[a-z]{2,}$"\n  sku:\n    type: string\n    pattern: "^[A-Z]{2}-[0-9]{4}$"\n  quantity:\n    type: integer\n    minimum: 1\n    maximum: 999\n  discount:\n    type: number\n    minimum: 0\n    maximum: 1\n    exclusiveMaximum: true\n  tags:\n    type: array\n    minItems: 1\n    maxItems: 10\n  notes:\n    type: string\n    nullable: true', lang: 'oas' },
    { h: 'Combining schemas' },
    { table: { headers: ['Keyword', 'Means'], rows: [
      ['<code>allOf</code>', 'Must match every schema listed. This is how you do inheritance.'],
      ['<code>oneOf</code>', 'Must match exactly one of them.'],

s:\n            Location:\n              description: Where to find the new book\n              schema: { type: string }\n          content:\n            application/json:\n              schema:\n                $ref: "#/components/schemas/Book"\n        "400":\n          $ref: "#/components/responses/BadRequest"\n\n  /books/{bookId}:\n    parameters:\n      - name: bookId\n        in: path\n        required: true\n        description: The id of the book\n        schema: { type: integer, format: int64 }\n\n    get:\n      tags: [ books ]\n      summary: Get one book\n      operationId: getBook\n      responses:\n        "200":\n          description: The book\n          content:\n            application/json:\n              schema:\n                $ref: "#/components/schemas/Book"\n        "404":\n          $ref: "#/components/responses/NotFound"\n\n    put:\n      tags: [ books ]\n      summary: Replace one book\n      operationId: replaceBook\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              $ref: "#/components/schemas/Book"\n      responses:\n        "200":\n          description: The updated book\n          content:\n            application/json:\n              schema:\n                $ref: "#/components/schemas/Book"\n        "404":\n          $ref: "#/components/responses/NotFound"\n\n    delete:\n      tags: [ books ]\n      summary: Delete one book\n      operationId: deleteBook\n      responses:\n        "204":\n          description: The book was deleted\n        "404":\n          $ref: "#/components/responses/NotFound"\n\ncomponents:\n\n  securitySchemes:\n    bearerAuth:\n      type: http\n      scheme: bearer\n      bearerFormat: JWT\n\n  parameters:\n    PageParam:\n      name: page\n      in: query\n      schema: { type: integer, minimum: 1, default: 1 }\n    SizeParam:\n      name: size\n      in: query\n      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }\n\n  responses:\n    BadRequest:\n      description: The request was not valid\n      content:\n        application/json:\n          schema:\n            $ref: "#/components/schemas/Error"\n    Unauthorized:\n      description: The credentials were rejected\n    NotFound:\n      description: No book with that id\n      content:\n        application/json:\n          schema:\n            $ref: "#/components/schemas/Error"\n\n  schemas:\n\n    Book:\n      type: object\n      required: [ id, title, price ]\n      properties:\n        id:\n          type: integer\n          format: int64\n          example: 1\n        title:\n          type: string\n          minLength: 1\n          maxLength: 200\n          example: DataWeave 101\n        author:\n          type: string\n          example: Mayar\n        price:\n          type: number\n          format: double\n          minimum: 0\n          example: 29.99\n        status:\n          type: string\n          enum: [ AVAILABLE, OUT_OF_STOCK ]\n          default: AVAILABLE\n        publishedOn:\n          type: string\n          format: date\n\n    NewBook:\n      allOf:\n        - $ref: "#/components/schemas/Book"\n        - type: object\n          properties:\n            id:\n              readOnly: true\n\n    Error:\n      type: object\n      required: [ code, message ]\n      properties:\n        code:\n          type: integer\n          example: 404\n        message:\n          type: string\n          example: Book not found', lang: 'oas', caption: 'openapi.yaml' },

    { h: 'Which should you use?' },
    { ul: [
      'Working entirely inside Anypoint Platform, with APIkit scaffolding? <b>RAML</b> still fits well, and traits save real work.',

  lesson(RAML, 'raml-full', 'RAML Full Example', 'RAML Full Example', [
    { p: 'Everything from this track put together into one working API definition.' },
    { code: '#%RAML 1.0\ntitle: Mayar Bookstore API\nversion: v1\nbaseUri: https://api.mayaracademy.com/{version}\nmediaType: application/json\nprotocols: [ HTTPS ]\ndescription: |\n  A small bookstore API used to teach RAML at Mayar Academy.\n\nsecuritySchemes:\n  clientCredentials:\n    type: Pass Through\n    describedBy:\n      headers:\n        client_id: { type: string, required: true }\n        client_secret: { type: string, required: true }\n      responses:\n        401:\n          description: The credentials were rejected\n\nsecuredBy: [ clientCredentials ]\n\ntypes:\n  Book:\n    type: object\n    properties:\n      id:          { type: integer, required: true }\n      title:       { type: string, minLength: 1, maxLength: 200 }\n      author:      { type: string }\n      price:       { type: number, minimum: 0 }\n      status:      { type: string, enum: [ AVAILABLE, OUT_OF_STOCK ] }\n      publishedOn?: date-only\n    example:\n      id: 1\n      title: DataWeave 101\n      author: Mayar\n      price: 29.99\n      status: AVAILABLE\n\n  NewBook:\n    type: Book\n    properties:\n      id?: integer\n\n  Error:\n    properties:\n      code: integer\n      message: string\n\ntraits:\n  pageable:\n    queryParameters:\n      page: { type: integer, default: 1, minimum: 1 }\n      size: { type: integer, default: 20, maximum: 100 }\n  notFound:\n    responses:\n      404:\n        body:\n          application/json:\n            type: Error\n            example: { code: 404, message: "Book not found" }\n\n/books:\n  get:\n    description: Return every book\n    is: [ pageable ]\n    queryParameters:\n      author?: string\n    responses:\n      200:\n        body:\n          application/json:\n            type: Book[]\n  post:\n    description: Add a new book\n    body:\n      application/json:\n        type: NewBook\n    responses:\n      201:\n        headers:\n          Location: string\n        body:\n          application/json:\n            type: Book\n      400:\n        body:\n          application/json:\n            type: Error\n\n  /{bookId}:\n    uriParameters:\n      bookId:\n        type: integer\n        description: The id of the book\n    get:\n      is: [ notFound ]\n      responses:\n        200:\n          body:\n            application/json:\n              type: Book\n    put:\n      is: [ notFound ]\n      body:\n        application/json:\n          type: Book\n      responses:\n        200:\n          body:\n            application/json:\n              type: Book\n    delete:\n      is: [ notFound ]\n      responses:\n        204:\n          description: The book was deleted\n\n    /reviews:\n      get:\n        is: [ pageable ]\n        responses:\n          200:\n            body:\n              application/json:\n                example: |\n                  [ { "stars": 5, "comment": "Very clear" } ]', lang: 'raml', caption: 'api.raml' },
    { h: 'What MuleSoft does with this file' },
    { ol: [
      'Publish it to <b>Exchange</b> so other teams can find it.',
      'Turn on the <b>mock service</b> and call it before any code exists.',
      'In Studio, use <b>APIkit</b> to generate one flow per method.',
      'APIkit validates every incoming request against the types automatically.',
      'Write your DataWeave inside the generated flows.'
    ] },
    { note: 'Design the RAML with the people who will consume the API, not alone. That is the whole point of designing first.' }
  ]);

  lesson(XSD, 'xsd-intro', 'XSD Intro', 'XML Schema Intro', [
    { h: 'What is XML Schema?' },
    { p: '<b>XML Schema</b>, usually called <b>XSD</b>, describes what a valid XML document looks like. It says which elements may appear, in what order, how many times, and what kind of data each one holds.' },
    { p: 'It is itself written in XML, and it is a W3C standard. The file extension is <code>.xsd</code>.' },
    { h: 'Why it matters in integration' },
    { ul: [
      'SOAP web services describe their messages with XSD inside the WSDL.',
      'IBM App Connect and IIB build message models from XSD.',
      'MuleSoft validates XML against XSD before processing it.',
      'It is a contract: both sides agree on the shape before any code is written.'
    ] },
    { h: 'A tiny schema' },
    { code: '<?xml version="1.0" encoding="UTF-8"?>\n<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">\n\n  <xs:element name="book">\n    <xs:complexType>\n      <xs:sequence>\n        <xs:element name="title" type="xs:string"/>\n        <xs:element name="author" type="xs:string"/>\n        <xs:element name="price" type="xs:decimal"/>\n      </xs:sequence>\n    </xs:complexType>\n  </xs:element>\n\n</xs:schema>', lang: 'xsd', caption: 'book.xsd' },
    { h: 'The XML it allows' },
    { code: '<?xml version="1.0" encoding="UTF-8"?>\n<book>\n  <title>DataWeave 101</title>\n  <author>Mayar</author>\n  <price>29.99</price>\n</book>', lang: 'xsd', caption: 'book.xml' },
    { note: 'The namespace <code>http://www.w3.org/2001/XMLSchema</code> is what makes a file a schema. It is almost always bound to the prefix <code>xs</code> or <code>xsd</code>.' }
  ], {
    q: 'What does an XSD file describe?',
    options: ['The rules a valid XML document must follow', 'How to transform XML', 'How to send XML over HTTP', 'How to display XML in a browser'],
    answer: 0,
    explain: 'XSD is a contract that says which elements and values are allowed.'
  });

    { code: '<book id="1" lang="en">\n  <title>DataWeave 101</title>\n</book>', lang: 'xsd', caption: 'Valid XML for the schema above' }

  lesson(XSD, 'xsd-complex', 'XSD Complex Types', 'XSD Complex Types', [
    { h: 'An element that contains other elements' },
    { p: 'A <b>complexType</b> holds child elements, attributes, or both. Inside it you choose a compositor: <code>sequence</code>, <code>all</code> or <code>choice</code>.' },
    { table: { headers: ['Compositor', 'Meaning'], rows: [
      ['<code>xs:sequence</code>', 'The children must appear in this exact order'],
      ['<code>xs:all</code>', 'The children may appear in any order, each at most once'],
      ['<code>xs:choice</code>', 'Exactly one of the children may appear']
    ] } },
    { code: '<xs:element name="order">\n  <xs:complexType>\n    <xs:sequence>\n      <xs:element name="customer" type="xs:string"/>\n      <xs:element name="line" maxOccurs="unbounded">\n        <xs:complexType>\n          <xs:sequence>\n            <xs:element name="sku" type="xs:string"/>\n            <xs:element name="qty" type="xs:int"/>\n            <xs:element name="price" type="xs:decimal"/>\n          </xs:sequence>\n        </xs:complexType>\n      </xs:element>\n    </xs:sequence>\n    <xs:attribute name="id" type="xs:string" use="required"/>\n  </xs:complexType>\n</xs:element>', lang: 'xsd', caption: 'An order with repeating lines' },
    { h: 'How many times' },
    { table: { headers: ['Setting', 'Meaning'], rows: [
      ['<code>minOccurs="0"</code>', 'The element is optional'],
      ['<code>minOccurs="1"</code>', 'The element is required (this is the default)'],
      ['<code>maxOccurs="1"</code>', 'At most one (the default)'],
      ['<code>maxOccurs="unbounded"</code>', 'Any number of times'],
      ['<code>maxOccurs="10"</code>', 'At most ten times']
    ] } },
    { h: 'Named types you can reuse' },
    { code: '<xs:complexType name="AddressType">\n  <xs:sequence>\n    <xs:element name="street" type="xs:string"/>\n    <xs:element name="city" type="xs:string"/>\n    <xs:element name="zip" type="xs:string" minOccurs="0"/>\n  </xs:sequence>\n</xs:complexType>\n\n<xs:element name="customer">\n  <xs:complexType>\n    <xs:sequence>\n      <xs:element name="name" type="xs:string"/>\n      <xs:element name="billing" type="AddressType"/>\n      <xs:element name="shipping" type="AddressType" minOccurs="0"/>\n    </xs:sequence>\n  </xs:complexType>\n</xs:element>', lang: 'xsd', caption: 'Define once, use twice' },
    { h: 'choice' },
    { code: '<xs:element name="payment">\n  <xs:complexType>\n    <xs:choice>\n      <xs:element name="card" type="xs:string"/>\n      <xs:element name="bankTransfer" type="xs:string"/>\n      <xs:element name="cash" type="xs:boolean"/>\n    </xs:choice>\n  </xs:complexType>\n</xs:element>', lang: 'xsd' },
    { note: 'Give your complex types names whenever you use them more than once. Anonymous types buried three levels deep are hard to read and impossible to reuse.' }
  ], {

    options: ['<code>xs:sequence</code>', '<code>xs:all</code>', '<code>xs:choice</code>', '<code>xs:group</code>'],
    answer: 0,
    explain: 'xs:sequence requires the children to appear in exactly the order given.'
  });

  lesson(XSD, 'xsd-restrictions', 'XSD Restrictions', 'XSD Restrictions', [
    { h: 'Narrowing a type' },
    { p: 'A <b>restriction</b> takes a built in type and adds rules to it. This is how you say "a string, but only these five values" or "a number between 1 and 100".' },

    { code: '<xs:simpleType name="OrderStatus">\n  <xs:restriction base="xs:string">\n    <xs:enumeration value="NEW"/>\n    <xs:enumeration value="PAID"/>\n    <xs:enumeration value="SHIPPED"/>\n    <xs:enumeration value="CANCELLED"/>\n  </xs:restriction>\n</xs:simpleType>', lang: 'xsd' },
    { h: 'Number ranges' },
    { code: '<xs:simpleType name="Percentage">\n  <xs:restriction base="xs:int">\n    <xs:minInclusive value="0"/>\n    <xs:maxInclusive value="100"/>\n  </xs:restriction>\n</xs:simpleType>\n\n<xs:simpleType name="PositivePrice">\n  <xs:restriction base="xs:decimal">\n    <xs:minExclusive value="0"/>\n    <xs:fractionDigits value="2"/>\n  </xs:restriction>\n</xs:simpleType>', lang: 'xsd' },
    { h: 'Text length and patterns' },
    { code: '<xs:simpleType name="Sku">\n  <xs:restriction base="xs:string">\n    <xs:pattern value="[A-Z]{2}-[0-9]{4}"/>\n  </xs:restriction>\n</xs:simpleType>\n\n<xs:simpleType name="ShortName">\n  <xs:restriction base="xs:string">\n    <xs:minLength value="1"/>\n    <xs:maxLength value="50"/>\n  </xs:restriction>\n</xs:simpleType>\n\n<xs:simpleType name="Email">\n  <xs:restriction base="xs:string">\n    <xs:pattern value="[^@]+@[^@]+\\.[a-z]{2,}"/>\n  </xs:restriction>\n</xs:simpleType>', lang: 'xsd' },
    { table: { headers: ['Facet', 'What it limits'], rows: [
      ['<code>enumeration</code>', 'The list of allowed values'],
      ['<code>pattern</code>', 'A regular expression the value must match'],
      ['<code>minLength</code> / <code>maxLength</code>', 'How many characters'],
      ['<code>length</code>', 'An exact number of characters'],
      ['<code>minInclusive</code> / <code>maxInclusive</code>', 'A number range, ends included'],
      ['<code>minExclusive</code> / <code>maxExclusive</code>', 'A number range, ends excluded'],
      ['<code>totalDigits</code>', 'How many digits in total'],
      ['<code>fractionDigits</code>', 'How many digits after the point'],
      ['<code>whiteSpace</code>', 'preserve, replace or collapse']
    ] } },
    { h: 'A list of values in one element' },
    { code: '<xs:simpleType name="TagList">\n  <xs:list itemType="xs:string"/>\n</xs:simpleType>\n\n<!-- allows:  <tags>mule dataweave api</tags> -->', lang: 'xsd' },

    { code: '<xs:complexType name="PersonType">\n  <xs:sequence>\n    <xs:element name="firstName" type="xs:string"/>\n    <xs:element name="lastName" type="xs:string"/>\n  </xs:sequence>\n</xs:complexType>\n\n<xs:complexType name="CustomerType">\n  <xs:complexContent>\n    <xs:extension base="PersonType">\n      <xs:sequence>\n        <xs:element name="customerId" type="xs:string"/>\n      </xs:sequence>\n    </xs:extension>\n  </xs:complexContent>\n</xs:complexType>', lang: 'xsd' }
  ]);

  lesson(XSD, 'xsd-namespaces', 'XSD Namespaces', 'XSD Namespaces & Import', [
    { h: 'Target namespace' },
    { p: 'A schema usually declares a <b>target namespace</b>. Every element it defines then belongs to that namespace, and the XML document must say so too.' },

    { code: '<?xml version="1.0" encoding="UTF-8"?>\n<bk:book xmlns:bk="http://mayaracademy.com/bookstore">\n  <bk:title>DataWeave 101</bk:title>\n  <bk:price>29.99</bk:price>\n</bk:book>', lang: 'xsd', caption: 'The matching XML' },
    { h: 'elementFormDefault' },
    { table: { headers: ['Value', 'Meaning'], rows: [

    ] } },
    { h: 'import and include' },
    { table: { headers: ['Element', 'When to use it'], rows: [
      ['<code>xs:include</code>', 'The other schema has the <b>same</b> target namespace'],
      ['<code>xs:import</code>', 'The other schema has a <b>different</b> target namespace'],
      ['<code>xs:redefine</code>', 'Same namespace, but you want to change some definitions']
    ] } },
    { code: '<xs:schema\n    xmlns:xs="http://www.w3.org/2001/XMLSchema"\n    xmlns:com="http://mayaracademy.com/common"\n    targetNamespace="http://mayaracademy.com/bookstore">\n\n  <xs:import namespace="http://mayaracademy.com/common"\n             schemaLocation="common.xsd"/>\n\n  <xs:include schemaLocation="bookstore-types.xsd"/>\n\n  <xs:element name="order">\n    <xs:complexType>\n      <xs:sequence>\n        <xs:element name="address" type="com:AddressType"/>\n      </xs:sequence>\n    </xs:complexType>\n  </xs:element>\n\n</xs:schema>', lang: 'xsd' },
    { note: 'Mixing up <code>import</code> and <code>include</code> is the classic XSD error. The rule is simple: different namespace means import, same namespace means include.' }
  ]);

  lesson(XSD, 'xsd-full', 'XSD Full Example', 'XSD Full Example', [
    { p: 'A complete, realistic schema using everything from this track.' },
    { code: '<?xml version="1.0" encoding="UTF-8"?>\n<xs:schema\n    xmlns:xs="http://www.w3.org/2001/XMLSchema"\n    xmlns:ord="http://mayaracademy.com/orders"\n    targetNamespace="http://mayaracademy.com/orders"\n    elementFormDefault="qualified">\n\n  <xs:annotation>\n    <xs:documentation>\n      Order message for the Mayar Academy XSD lessons.\n    </xs:documentation>\n  </xs:annotation>\n\n  <!-- ===== simple types ===== -->\n\n  <xs:simpleType name="OrderStatus">\n    <xs:restriction base="xs:string">\n      <xs:enumeration value="NEW"/>\n      <xs:enumeration value="PAID"/>\n      <xs:enumeration value="SHIPPED"/>\n      <xs:enumeration value="CANCELLED"/>\n    </xs:restriction>\n  </xs:simpleType>\n\n  <xs:simpleType name="Sku">\n    <xs:restriction base="xs:string">\n      <xs:pattern value="[A-Z]{2}-[0-9]{4}"/>\n    </xs:restriction>\n  </xs:simpleType>\n\n  <xs:simpleType name="Money">\n    <xs:restriction base="xs:decimal">\n      <xs:minInclusive value="0"/>\n      <xs:fractionDigits value="2"/>\n    </xs:restriction>\n  </xs:simpleType>\n\n  <!-- ===== complex types ===== -->\n\n  <xs:complexType name="AddressType">\n    <xs:sequence>\n      <xs:element name="street"  type="xs:string"/>\n      <xs:element name="city"    type="xs:string"/>\n      <xs:element name="zip"     type="xs:string" minOccurs="0"/>\n      <xs:element name="country" type="xs:string" default="UAE"/>\n    </xs:sequence>\n  </xs:complexType>\n\n  <xs:complexType name="LineType">\n    <xs:sequence>\n      <xs:element name="sku"   type="ord:Sku"/>\n      <xs:element name="qty"   type="xs:positiveInteger"/>\n      <xs:element name="price" type="ord:Money"/>\n    </xs:sequence>\n    <xs:attribute name="lineNo" type="xs:int" use="required"/>\n  </xs:complexType>\n\n  <xs:complexType name="CustomerType">\n    <xs:sequence>\n      <xs:element name="firstName" type="xs:string"/>\n      <xs:element name="lastName"  type="xs:string"/>\n      <xs:element name="billing"   type="ord:AddressType"/>\n      <xs:element name="shipping"  type="ord:AddressType" minOccurs="0"/>\n    </xs:sequence>\n  </xs:complexType>\n\n  <!-- ===== the root element ===== -->\n\n  <xs:element name="order">\n    <xs:complexType>\n      <xs:sequence>\n        <xs:element name="customer" type="ord:CustomerType"/>\n        <xs:element name="line"     type="ord:LineType" maxOccurs="unbounded"/>\n        <xs:element name="total"    type="ord:Money"/>\n      </xs:sequence>\n      <xs:attribute name="id"     type="xs:string"        use="required"/>\n      <xs:attribute name="status" type="ord:OrderStatus"  use="required"/>\n      <xs:attribute name="placed" type="xs:dateTime"      use="optional"/>\n    </xs:complexType>\n  </xs:element>\n\n</xs:schema>', lang: 'xsd', caption: 'orders.xsd' },
    { h: 'A document that passes validation' },
    { code: '<?xml version="1.0" encoding="UTF-8"?>\n<ord:order xmlns:ord="http://mayaracademy.com/orders"\n           id="A100" status="NEW" placed="2026-08-29T14:30:00">\n  <ord:customer>\n    <ord:firstName>Max</ord:firstName>\n    <ord:lastName>Mule</ord:lastName>\n    <ord:billing>\n      <ord:street>1234 Mule Street</ord:street>\n      <ord:city>Dubai</ord:city>\n      <ord:country>UAE</ord:country>\n    </ord:billing>\n  </ord:customer>\n  <ord:line lineNo="1">\n    <ord:sku>AB-1234</ord:sku>\n    <ord:qty>2</ord:qty>\n    <ord:price>20.00</ord:price>\n  </ord:line>\n  <ord:line lineNo="2">\n    <ord:sku>CD-5678</ord:sku>\n    <ord:qty>1</ord:qty>\n    <ord:price>45.00</ord:price>\n  </ord:line>\n  <ord:total>85.00</ord:total>\n</ord:order>', lang: 'xsd', caption: 'order.xml' },
    { note: 'In MuleSoft you validate this with the <b>Validate schema</b> component. In IBM App Connect you build a message model from the same file.' }
  ]);

  /* ==================== WSDL ==================== */

  lesson(WSDL, 'wsdl-intro', 'WSDL Intro', 'WSDL Intro', [
    { h: 'What is WSDL?' },
    { p: '<b>WSDL</b> stands for <b>Web Services Description Language</b>. It is to a SOAP service what RAML is to a REST API: a file that describes exactly what the service offers.' },
    { p: 'It is XML, and it answers four questions: <b>what</b> operations exist, <b>what</b> data goes in and out, <b>how</b> to call them, and <b>where</b> the service lives.' },
    { h: 'The five parts' },
    { table: { headers: ['Element', 'Answers'], rows: [
      ['<code>types</code>', 'What does the data look like? (XSD lives here)'],
      ['<code>message</code>', 'What travels in one direction?'],
      ['<code>portType</code>', 'What operations exist? (called <code>interface</code> in WSDL 2.0)'],
      ['<code>binding</code>', 'How is it sent on the wire? (SOAP over HTTP, usually)'],
      ['<code>service</code>', 'Where is the endpoint?']
    ] } },
    { flow: ['types', 'message', 'portType', 'binding', 'service'] },
    { h: 'The skeleton' },
    { code: '<?xml version="1.0" encoding="UTF-8"?>\n<definitions\n    name="BookService"\n    targetNamespace="http://mayaracademy.com/books"\n    xmlns="http://schemas.xmlsoap.org/wsdl/"\n    xmlns:tns="http://mayaracademy.com/books"\n    xmlns:xsd="http://www.w3.org/2001/XMLSchema"\n    xmlns:soap="http://schemas.xmlsoap.org/wsdl/soap/">\n\n  <types>      <!-- XSD goes here          --> </types>\n  <message>    <!-- one per direction      --> </message>\n  <portType>   <!-- the operations         --> </portType>\n  <binding>    <!-- the protocol details   --> </binding>\n  <service>    <!-- the address            --> </service>\n\n</definitions>', lang: 'wsdl' },
    { h: 'WSDL 1.1 and 2.0' },
    { table: { headers: ['WSDL 1.1', 'WSDL 2.0'], rows: [
      ['<code>portType</code>', '<code>interface</code>'],
      ['<code>message</code>', 'gone – elements are referenced directly'],
      ['<code>port</code>', '<code>endpoint</code>'],
      ['Used by almost every real service', 'Rare in practice']
    ] } },
    { note: 'In practice you will meet WSDL 1.1 almost every time. That is what this track teaches.' }
  ], {
    q: 'Which WSDL element says <b>where</b> the service can be called?',
    options: ['<code>service</code>', '<code>binding</code>', '<code>portType</code>', '<code>types</code>'],
    answer: 0,
    explain: 'The service element holds the port and its soap:address location.'
  });

  lesson(WSDL, 'wsdl-types', 'WSDL Types', 'WSDL Types & Messages', [
    { h: 'types holds a schema' },
    { p: 'The <code>types</code> section is an ordinary XSD. Everything you learned in the XML Schema track applies here.' },
    { code: '<types>\n  <xsd:schema targetNamespace="http://mayaracademy.com/books"\n              xmlns:xsd="http://www.w3.org/2001/XMLSchema">\n\n    <xsd:element name="getBookRequest">\n      <xsd:complexType>\n        <xsd:sequence>\n          <xsd:element name="bookId" type="xsd:int"/>\n        </xsd:sequence>\n      </xsd:complexType>\n    </xsd:element>\n\n    <xsd:element name="getBookResponse">\n      <xsd:complexType>\n        <xsd:sequence>\n          <xsd:element name="id"     type="xsd:int"/>\n          <xsd:element name="title"  type="xsd:string"/>\n          <xsd:element name="author" type="xsd:string"/>\n          <xsd:element name="price"  type="xsd:decimal"/>\n        </xsd:sequence>\n      </xsd:complexType>\n    </xsd:element>\n\n    <xsd:element name="bookFault">\n      <xsd:complexType>\n        <xsd:sequence>\n          <xsd:element name="code"    type="xsd:int"/>\n          <xsd:element name="message" type="xsd:string"/>\n        </xsd:sequence>\n      </xsd:complexType>\n    </xsd:element>\n\n  </xsd:schema>\n</types>', lang: 'wsdl' },
    { h: 'message wraps an element' },
    { p: 'A <code>message</code> describes what travels in one direction. Each <code>part</code> points at an element or a type from the schema.' },
    { code: '<message name="getBookRequestMsg">\n  <part name="parameters" element="tns:getBookRequest"/>\n</message>\n\n<message name="getBookResponseMsg">\n  <part name="parameters" element="tns:getBookResponse"/>\n</message>\n\n<message name="bookFaultMsg">\n  <part name="fault" element="tns:bookFault"/>\n</message>', lang: 'wsdl' },
    { h: 'element or type?' },
    { table: { headers: ['Attribute', 'Use it when'], rows: [
      ['<code>element="tns:x"</code>', 'Document style – the normal choice today'],
      ['<code>type="xsd:string"</code>', 'RPC style – older services only']
    ] } },
    { note: 'A message with more than one part is legal but unusual. One part called <code>parameters</code> pointing at one element is the pattern you will see almost everywhere.' }
  ]);

  lesson(WSDL, 'wsdl-porttype', 'WSDL PortType', 'WSDL PortType & Operations', [
    { h: 'The list of operations' },
    { p: 'A <code>portType</code> is the interface. Each <code>operation</code> inside it names its input message, its output message and any faults.' },
    { code: '<portType name="BookPortType">\n\n  <operation name="getBook">\n    <input  message="tns:getBookRequestMsg"/>\n    <output message="tns:getBookResponseMsg"/>\n    <fault  name="bookFault" message="tns:bookFaultMsg"/>\n  </operation>\n\n  <operation name="listBooks">\n    <input  message="tns:listBooksRequestMsg"/>\n    <output message="tns:listBooksResponseMsg"/>\n  </operation>\n\n  <operation name="notifyStockChange">\n    <input message="tns:stockChangeMsg"/>\n  </operation>\n\n</portType>', lang: 'wsdl' },
    { h: 'The four message patterns' },
    { table: { headers: ['Pattern', 'Elements present', 'Meaning'], rows: [
      ['Request response', 'input then output', 'The normal call and reply'],
      ['One way', 'input only', 'Fire and forget'],
      ['Solicit response', 'output then input', 'The service calls you first'],
      ['Notification', 'output only', 'The service pushes to you']
    ] } },
    { note: 'Request response and one way cover almost everything you will build.' }
  ]);

  lesson(WSDL, 'wsdl-binding', 'WSDL Binding', 'WSDL Binding & Service', [
    { h: 'binding says how to send it' },
    { code: '<binding name="BookBinding" type="tns:BookPortType">\n\n  <soap:binding style="document"\n                transport="http://schemas.xmlsoap.org/soap/http"/>\n\n  <operation name="getBook">\n    <soap:operation soapAction="http://mayaracademy.com/books/getBook"/>\n    <input>\n      <soap:body use="literal"/>\n    </input>\n    <output>\n      <soap:body use="literal"/>\n    </output>\n    <fault name="bookFault">\n      <soap:fault name="bookFault" use="literal"/>\n    </fault>\n  </operation>\n\n</binding>', lang: 'wsdl' },
    { h: 'style and use' },
    { table: { headers: ['Setting', 'Values', 'Meaning'], rows: [
      ['<code>style</code>', '<code>document</code> / <code>rpc</code>', 'document sends your XML element as the body. Use it.'],
      ['<code>use</code>', '<code>literal</code> / <code>encoded</code>', 'literal means the body matches the schema exactly. Use it.']
    ] } },
    { p: 'The combination you want is <b>document/literal wrapped</b>. It is the only style guaranteed to work between different vendors.' },
    { h: 'service says where' },
    { code: '<service name="BookService">\n  <documentation>The Mayar Academy book service</documentation>\n  <port name="BookPort" binding="tns:BookBinding">\n    <soap:address location="https://api.mayaracademy.com/soap/books"/>\n  </port>\n</service>', lang: 'wsdl' },
    { h: 'What a call actually looks like' },
    { code: 'POST /soap/books HTTP/1.1\nHost: api.mayaracademy.com\nContent-Type: text/xml; charset=utf-8\nSOAPAction: "http://mayaracademy.com/books/getBook"\n\n<?xml version="1.0" encoding="UTF-8"?>\n<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">\n  <soap:Header/>\n  <soap:Body>\n    <getBookRequest xmlns="http://mayaracademy.com/books">\n      <bookId>1</bookId>\n    </getBookRequest>\n  </soap:Body>\n</soap:Envelope>', lang: 'wsdl', caption: 'The SOAP request on the wire' },
    { code: '<?xml version="1.0" encoding="UTF-8"?>\n<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">\n  <soap:Body>\n    <getBookResponse xmlns="http://mayaracademy.com/books">\n      <id>1</id>\n      <title>DataWeave 101</title>\n      <author>Mayar</author>\n      <price>29.99</price>\n    </getBookResponse>\n  </soap:Body>\n</soap:Envelope>', lang: 'wsdl', caption: 'The SOAP response' },
    { h: 'A SOAP fault' },
    { code: '<?xml version="1.0" encoding="UTF-8"?>\n<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">\n  <soap:Body>\n    <soap:Fault>\n      <faultcode>soap:Client</faultcode>\n      <faultstring>Book not found</faultstring>\n      <detail>\n        <bookFault xmlns="http://mayaracademy.com/books">\n          <code>404</code>\n          <message>No book with id 99</message>\n        </bookFault>\n      </detail>\n    </soap:Fault>\n  </soap:Body>\n</soap:Envelope>', lang: 'wsdl' }
  ], {
    q: 'Which style and use combination should you choose for a new SOAP service?',
    options: ['document / literal', 'rpc / encoded', 'document / encoded', 'rpc / literal'],
    answer: 0,
    explain: 'document/literal wrapped is the interoperable choice. rpc/encoded is legacy and often breaks between vendors.'
  });

  lesson(WSDL, 'wsdl-full', 'WSDL Full Example', 'WSDL Full Example', [
    { p: 'One complete WSDL 1.1 file with all five sections in the correct order.' },
    { code: '<?xml version="1.0" encoding="UTF-8"?>\n<definitions\n    name="BookService"\n    targetNamespace="http://mayaracademy.com/books"\n    xmlns="http://schemas.xmlsoap.org/wsdl/"\n    xmlns:tns="http://mayaracademy.com/books"\n    xmlns:xsd="http://www.w3.org/2001/XMLSchema"\n    xmlns:soap="http://schemas.xmlsoap.org/wsdl/soap/">\n\n  <!-- ============ 1. TYPES ============ -->\n  <types>\n    <xsd:schema targetNamespace="http://mayaracademy.com/books"\n                elementFormDefault="qualified">\n\n      <xsd:element name="getBookRequest">\n        <xsd:complexType>\n          <xsd:sequence>\n            <xsd:element name="bookId" type="xsd:int"/>\n          </xsd:sequence>\n        </xsd:complexType>\n      </xsd:element>\n\n      <xsd:element name="getBookResponse">\n        <xsd:complexType>\n          <xsd:sequence>\n            <xsd:element name="id"     type="xsd:int"/>\n            <xsd:element name="title"  type="xsd:string"/>\n            <xsd:element name="author" type="xsd:string"/>\n            <xsd:element name="price"  type="xsd:decimal"/>\n          </xsd:sequence>\n        </xsd:complexType>\n      </xsd:element>\n\n      <xsd:element name="bookFault">\n        <xsd:complexType>\n          <xsd:sequence>\n            <xsd:element name="code"    type="xsd:int"/>\n            <xsd:element name="message" type="xsd:string"/>\n          </xsd:sequence>\n        </xsd:complexType>\n      </xsd:element>\n\n    </xsd:schema>\n  </types>\n\n  <!-- ============ 2. MESSAGES ============ -->\n  <message name="getBookRequestMsg">\n    <part name="parameters" element="tns:getBookRequest"/>\n  </message>\n  <message name="getBookResponseMsg">\n    <part name="parameters" element="tns:getBookResponse"/>\n  </message>\n  <message name="bookFaultMsg">\n    <part name="fault" element="tns:bookFault"/>\n  </message>\n\n  <!-- ============ 3. PORT TYPE ============ -->\n  <portType name="BookPortType">\n    <operation name="getBook">\n      <input  message="tns:getBookRequestMsg"/>\n      <output message="tns:getBookResponseMsg"/>\n      <fault  name="bookFault" message="tns:bookFaultMsg"/>\n    </operation>\n  </portType>\n\n  <!-- ============ 4. BINDING ============ -->\n  <binding name="BookBinding" type="tns:BookPortType">\n    <soap:binding style="document"\n                  transport="http://schemas.xmlsoap.org/soap/http"/>\n    <operation name="getBook">\n      <soap:operation soapAction="http://mayaracademy.com/books/getBook"/>\n      <input><soap:body use="literal"/></input>\n      <output><soap:body use="literal"/></output>\n      <fault name="bookFault">\n        <soap:fault name="bookFault" use="literal"/>\n      </fault>\n    </operation>\n  </binding>\n\n  <!-- ============ 5. SERVICE ============ -->\n  <service name="BookService">\n    <port name="BookPort" binding="tns:BookBinding">\n      <soap:address location="https://api.mayaracademy.com/soap/books"/>\n    </port>\n  </service>\n\n</definitions>', lang: 'wsdl', caption: 'BookService.wsdl' },
    { h: 'Using it in MuleSoft' },
    { ol: [
      'Drop the WSDL into <code>src/main/resources</code>.',
      'Add a <b>Web Service Consumer</b> and point it at the WSDL.',
      'Pick the operation. Mule reads the schema and knows the shapes.',
      'Use DataWeave to build the request body, and DataWeave again to read the response.'
    ] },
    { code: '%dw 2.0\noutput application/xml\nns bk http://mayaracademy.com/books\n---\n{\n  bk#getBookRequest: {\n    bk#bookId: payload.id\n  }\n}', caption: 'DataWeave building the SOAP request body' },
    { h: 'Using it in IBM App Connect' },
    { ol: [
      'Import the WSDL to create a message model.',
      'Use a <b>SOAPInput</b> node to expose it, or a <b>SOAPRequest</b> node to call it.',
      'The node validates against the WSDL for you.'
    ] },
    { note: 'Always keep the WSDL and its XSDs together, with the same relative paths. A WSDL that imports a schema by an absolute file path will break on every other machine.' }
  ]);
})();

/* Mayar Academy - Lessons part 8: IBM IIB / ACE ESQL and JavaCompute */
(function () {
  var L = (window.LESSONS = window.LESSONS || []);
  function lesson(cat, id, nav, title, blocks, exercise) {
    var o = { id: id, cat: cat, title: title, nav: nav, blocks: blocks };
    if (exercise) o.exercise = exercise;
    L.push(o);
  }
  var E = 'IBM ESQL Tutorial', JV = 'IBM IIB Java Tutorial';

  /* ==================== ESQL ==================== */

  lesson(E, 'esql-intro', 'ESQL Intro', 'ESQL Intro', [
    { h: 'What is ESQL?' },
    { p: '<b>ESQL</b> stands for <b>Extended Structured Query Language</b>. It is the programming language used inside <b>IBM Integration Bus</b> and <b>IBM App Connect Enterprise</b> to work with messages as they pass through a message flow.' },
    { p: 'It looks like SQL because it grew out of SQL, but it does much more: it reads and writes the message tree, does maths and text handling, talks to databases, and controls the route a message takes.' },
    { h: 'Where ESQL runs' },
    { p: 'ESQL lives inside certain nodes in a message flow. The most important ones are:' },
    { table: { headers: ['Node', 'What you use it for'], rows: [
      ['<b>Compute</b>', 'Build a new output message from the input. The main workhorse.'],
      ['<b>Filter</b>', 'Return TRUE or FALSE to route the message down one terminal or another.'],
      ['<b>Database</b>', 'Run SQL against a database without changing the message.'],
      ['<b>DatabaseInput</b>', 'Start a flow from a database event.']
    ] } },
    { flow: ['Input node', 'Compute node (ESQL)', 'Output node'] },
    { h: 'A first module' },
    { code: 'CREATE COMPUTE MODULE HelloWorld_Compute\n\n  CREATE FUNCTION Main() RETURNS BOOLEAN\n  BEGIN\n    -- copy the headers from the input message\n    CALL CopyMessageHeaders();\n\n    -- build a small JSON output\n    SET OutputRoot.JSON.Data.greeting = \'Hello from Mayar Academy\';\n    SET OutputRoot.JSON.Data.timestamp = CURRENT_TIMESTAMP;\n\n    RETURN TRUE;\n  END;\n\n  CREATE PROCEDURE CopyMessageHeaders() BEGIN\n    DECLARE I INTEGER 1;\n    DECLARE J INTEGER CARDINALITY(InputRoot.*[]);\n    WHILE I < J DO\n      SET OutputRoot.*[I] = InputRoot.*[I];\n      SET I = I + 1;\n    END WHILE;\n  END;\n\nEND MODULE;', lang: 'esql', caption: 'A complete Compute module' },
    { h: 'Things to notice' },
    { ul: [
      'A module starts with <code>CREATE COMPUTE MODULE</code> and ends with <code>END MODULE;</code>.',
      'The entry point is always <code>Main()</code> and it returns a <code>BOOLEAN</code>.',
      '<code>RETURN TRUE</code> sends the message out of the <b>out</b> terminal. <code>RETURN FALSE</code> sends nothing.',
      'A comment starts with two dashes <code>--</code>.',
      'Every statement ends with a semicolon.',
      'Text literals use <b>single</b> quotes, never double quotes.'
    ] },
    { note: 'The official starting points are the <a href="https://www.ibm.com/docs/en/app-connect/12.0.x?topic=esql-overview" target="_blank" rel="noopener">ESQL overview</a>, <a href="https://www.ibm.com/docs/en/integration-bus/10.0.0?topic=files-creating-esql-node" target="_blank" rel="noopener">creating ESQL for a node</a> and the <a href="https://www.ibm.com/docs/en/integration-bus/9.0.0?topic=esql-writing" target="_blank" rel="noopener">writing ESQL</a> pages in IBM Documentation.' }
  ], {
    q: 'What does <code>RETURN TRUE</code> do at the end of <code>Main()</code>?',
    options: ['Propagates the message to the out terminal', 'Commits the transaction', 'Stops the flow', 'Rolls the message back'],
    answer: 0,
    explain: 'Returning TRUE tells the node to send the output message down the out terminal. FALSE sends nothing.'
  });

  lesson(E, 'esql-setup', 'ESQL for a Node', 'Creating ESQL for a Node', [
    { h: 'How the file and the node connect' },
    { p: 'ESQL is not written inside the flow diagram. It lives in a separate <code>.esql</code> file, and the node points at a module inside that file.' },
    { ol: [
      'Add a <b>Compute</b> node to your message flow.',
      'Double click it, or right click and choose <b>Open ESQL</b>.',
      'The Toolkit creates or opens a file named after the flow, for example <code>OrderFlow.esql</code>.',
      'It generates an empty module and fills in the node\u2019s <b>ESQL Module</b> property for you.',
      'Write your code inside <code>Main()</code>.'
    ] },
    { h: 'The naming rule' },
    { p: 'The module name in the file must match the <b>ESQL Module</b> property on the node, exactly. This is the single most common setup mistake.' },
    { code: '-- file: OrderFlow.esql\nBROKER SCHEMA com.mayaracademy.orders\n\nCREATE COMPUTE MODULE OrderFlow_BuildResponse\n  CREATE FUNCTION Main() RETURNS BOOLEAN\n  BEGIN\n    RETURN TRUE;\n  END;\nEND MODULE;', lang: 'esql' },
    { p: 'On the node, set <b>ESQL Module</b> to <code>OrderFlow_BuildResponse</code>.' },
    { h: 'Broker schema' },
    { p: 'A <code>BROKER SCHEMA</code> line at the top is like a Java package. It keeps module names unique across a big application. It must match the folder path of the file.' },
    { code: 'BROKER SCHEMA com.mayaracademy.orders', lang: 'esql' },
    { h: 'The Compute node mode' },
    { p: 'The <b>Compute mode</b> property decides which trees your code may write to.' },
    { table: { headers: ['Compute mode', 'You can write to'], rows: [
      ['<code>Message</code>', 'OutputRoot only (the default)'],
      ['<code>LocalEnvironment</code>', 'OutputLocalEnvironment only'],
      ['<code>Exception</code>', 'OutputExceptionList only'],
      ['<code>Message and LocalEnvironment</code>', 'Both trees'],
      ['<code>All</code>', 'Everything']
    ] } },
    { note: 'If your <code>SET OutputLocalEnvironment...</code> line seems to do nothing, the Compute mode is almost always the reason.' }
  ]);

  lesson(E, 'esql-module', 'ESQL Module Structure', 'ESQL Module Structure', [
    { h: 'The shape of a file' },

  lesson(E, 'esql-reference', 'ESQL References', 'ESQL References & Fast Loops', [
    { h: 'The problem with long paths' },
    { p: 'Every time you write a long path, the broker walks the tree from the top to find it. Inside a loop over a thousand lines, that walk happens thousands of times. This is the single biggest cause of slow ESQL.' },
    { vs: {
      title: 'Looping over lines',
      badLabel: 'Slow \u2013 the tree is walked every time',
      bad: 'DECLARE i INTEGER 1;\nDECLARE n INTEGER CARDINALITY(InputRoot.XMLNSC.order.line[]);\n\nWHILE i <= n DO\n  SET OutputRoot.XMLNSC.result.line[i].sku =\n      InputRoot.XMLNSC.order.line[i].sku;\n  SET OutputRoot.XMLNSC.result.line[i].qty =\n      InputRoot.XMLNSC.order.line[i].qty;\n  SET i = i + 1;\nEND WHILE;',
      badWhy: 'Four full tree walks per line. On 5000 lines the CPU cost is enormous.',
      goodLabel: 'Fast \u2013 a pointer that moves',
      good: 'DECLARE inRef  REFERENCE TO InputRoot.XMLNSC.order.line[1];\nDECLARE outRef REFERENCE TO OutputRoot.XMLNSC.result;\n\nWHILE LASTMOVE(inRef) DO\n  CREATE LASTCHILD OF outRef AS outLine\n    TYPE NAME NAME \'line\';\n  SET outLine.sku = inRef.sku;\n  SET outLine.qty = inRef.qty;\n  MOVE inRef NEXTSIBLING NAME \'line\';\nEND WHILE;',
      goodWhy: 'The pointer steps to the next sibling. No walking from the root at all.'
    } },
    { h: 'How a REFERENCE works' },
    { code: '-- point it at a place in the tree\nDECLARE ref REFERENCE TO InputRoot.XMLNSC.order.line[1];\n\n-- LASTMOVE tells you whether the last move landed somewhere real\nWHILE LASTMOVE(ref) DO\n  -- ... use ref.sku, ref.qty ...\n  MOVE ref NEXTSIBLING NAME \'line\';\nEND WHILE;', lang: 'esql' },
    { table: { headers: ['MOVE target', 'Goes to'], rows: [
      ['<code>MOVE ref FIRSTCHILD</code>', 'The first child'],
      ['<code>MOVE ref LASTCHILD</code>', 'The last child'],
      ['<code>MOVE ref NEXTSIBLING</code>', 'The next element at the same level'],
      ['<code>MOVE ref NEXTSIBLING NAME \'x\'</code>', 'The next sibling named x'],
      ['<code>MOVE ref PREVIOUSSIBLING</code>', 'The previous sibling'],
      ['<code>MOVE ref PARENT</code>', 'Up one level'],
      ['<code>MOVE ref TO path</code>', 'Anywhere you name']
    ] } },
    { h: 'The FOR shortcut' },
    { p: 'When you only need to read, <code>FOR ... AS</code> creates the reference for you.' },
    { code: 'DECLARE total DECIMAL 0;\n\nFOR line AS InputRoot.XMLNSC.order.line[] DO\n  SET total = total + (CAST(line.qty AS INTEGER) *\n                       CAST(line.price AS DECIMAL));\nEND FOR;\n\nSET OutputRoot.XMLNSC.result.total = total;', lang: 'esql' },
    { h: 'Building output with a reference' },
    { code: 'CREATE FIELD OutputRoot.XMLNSC.result;\nDECLARE out REFERENCE TO OutputRoot.XMLNSC.result;\n\nFOR line AS InputRoot.XMLNSC.order.line[] DO\n  CREATE LASTCHILD OF out AS newLine TYPE NAME NAME \'item\';\n  SET newLine.sku   = line.sku;\n  SET newLine.total = CAST(line.qty AS INTEGER) *\n                      CAST(line.price AS DECIMAL);\nEND FOR;', lang: 'esql' },
    { note: 'IBM\u2019s own guidance on this is in the <a href="https://www.ibm.com/docs/en/integration-bus/10.0.0?topic=performance-esql-code-tips" target="_blank" rel="noopener">ESQL code optimisation tips</a> and the <a href="https://www.ibm.com/docs/en/integration-bus/10.0.0?topic=flows-esql-reference-data-type" target="_blank" rel="noopener">REFERENCE data type</a> page. If you learn one thing from this track, learn references.' }
  ], {
    q: 'Why is <code>REFERENCE</code> faster than a long path inside a loop?',
    options: ['The pointer moves without walking from the root each time', 'It caches the value in memory', 'It runs the loop in parallel', 'It skips parsing the message'],
    answer: 0,
    explain: 'A long path is resolved from the top of the tree on every use. A reference already sits at the right place and just steps sideways.'
  });

  lesson(E, 'esql-database', 'ESQL Databases', 'ESQL Database Access', [
    { h: 'Reading with SELECT' },
    { p: 'Put the data source name in braces, then the schema and table.' },
    { code: 'DECLARE dsn CHARACTER \'MAYARDB\';\n\n-- one value\nSET OutputRoot.JSON.Data.customerName =\n  THE(SELECT ITEM C.NAME\n      FROM Database.{dsn}.MAYAR.CUSTOMER AS C\n      WHERE C.ID = InputRoot.JSON.Data.customerId);\n\n-- one row into a ROW variable\nDECLARE row ROW;\nSET row.result[] =\n  SELECT C.ID, C.NAME, C.CITY\n  FROM Database.{dsn}.MAYAR.CUSTOMER AS C\n  WHERE C.ID = InputRoot.JSON.Data.customerId;\n\nIF CARDINALITY(row.result[]) > 0 THEN\n  SET OutputRoot.JSON.Data.name = row.result[1].NAME;\n  SET OutputRoot.JSON.Data.city = row.result[1].CITY;\nEND IF;', lang: 'esql' },
    { h: 'Many rows into the output tree' },

  lesson(E, 'esql-errors', 'ESQL Error Handling', 'ESQL Error Handling', [
    { h: 'Throwing your own error' },
    { code: 'IF InputRoot.JSON.Data.customerId IS NULL THEN\n  THROW USER EXCEPTION\n    CATALOG \'MayarMessages\'\n    MESSAGE 3001\n    VALUES(\'customerId is required\');\nEND IF;', lang: 'esql' },
    { h: 'Catching an error' },
    { p: 'Wrap the risky part in its own <code>BEGIN ... END</code> with a handler.' },
    { code: 'BEGIN\n  DECLARE amount DECIMAL;\n\n  BEGIN\n    DECLARE badCast CONDITION;\n    SET amount = CAST(InputRoot.JSON.Data.amount AS DECIMAL);\n  END;\n\n  SET OutputRoot.JSON.Data.amount = COALESCE(amount, 0);\nEND;', lang: 'esql' },
    { h: 'Reading the ExceptionList' },
    { p: 'In an error handler flow, the reason sits at the deepest level of <code>InputExceptionList</code>. This helper walks down to it.' },
    { code: 'CREATE PROCEDURE GetLastError(OUT errNumber INTEGER,\n                             OUT errText CHARACTER)\nBEGIN\n  DECLARE ref REFERENCE TO InputExceptionList.*[1];\n\n  -- walk to the deepest child\n  WHILE LASTMOVE(ref) DO\n    IF ref.Number IS NOT NULL THEN\n      SET errNumber = ref.Number;\n      SET errText   = ref.Text;\n    END IF;\n    MOVE ref LASTCHILD;\n  END WHILE;\nEND;\n\n-- using it\nDECLARE n INTEGER;\nDECLARE t CHARACTER;\nCALL GetLastError(n, t);\nSET OutputRoot.JSON.Data.error.code    = n;\nSET OutputRoot.JSON.Data.error.message = t;', lang: 'esql' },
    { h: 'Defensive habits' },
    { ul: [
      'Test with <code>EXISTS</code> or <code>IS NOT NULL</code> before reading anything optional.',
      'Wrap every value that might be missing in <code>COALESCE</code>.',
      'Check <code>SQLCODE</code> after every database statement.',
      'Never let a <code>CAST</code> run on unvalidated input without a handler.',
      'Put the real detail in the exception message. "Error" helps nobody at 3am.'
    ] },
    { code: '-- a safe read pattern\nDECLARE qtyText CHARACTER InputRoot.XMLNSC.order.qty;\nDECLARE qty INTEGER 0;\n\nIF qtyText IS NOT NULL AND qtyText <> \'\' THEN\n  SET qty = CAST(qtyText AS INTEGER);\nEND IF;\n\nSET OutputRoot.JSON.Data.qty = qty;', lang: 'esql' }
  ]);

  lesson(E, 'esql-performance', 'ESQL Performance', 'ESQL Performance Tips', [
    { h: 'The rules that matter' },
    { table: { headers: ['Do', 'Instead of'], rows: [
      ['Use <code>REFERENCE</code> and <code>MOVE</code> in loops', 'Long paths with <code>[i]</code> inside a WHILE'],
      ['<code>SET OutputRoot = InputRoot;</code> when you copy everything', 'Copying field by field'],
      ['Cache lookups in a <code>SHARED</code> variable', 'Hitting the database for every message'],
      ['Read <code>CARDINALITY</code> once into a variable', 'Calling it in the loop condition'],
      ['Use <code>XMLNSC</code>', '<code>XMLNS</code> or the old <code>XML</code> parser'],
      ['Let the parser work only on what you touch', 'Forcing a full parse you do not need'],
      ['Declare variables at the smallest scope', 'Everything at module level'],
      ['Build the tree once', 'Creating and deleting fields repeatedly']
    ] } },
    { h: 'CARDINALITY inside the condition' },
    { vs: {
      title: 'A small change with a big effect',
      badLabel: 'Recalculated on every turn of the loop',
      bad: 'DECLARE i INTEGER 1;\n\nWHILE i <= CARDINALITY(InputRoot.XMLNSC.order.line[]) DO\n  -- ...\n  SET i = i + 1;\nEND WHILE;',
      badWhy: 'CARDINALITY walks the whole list again on every single turn.',
      goodLabel: 'Counted once',
      good: 'DECLARE i INTEGER 1;\nDECLARE n INTEGER CARDINALITY(InputRoot.XMLNSC.order.line[]);\n\nWHILE i <= n DO\n  -- ...\n  SET i = i + 1;\nEND WHILE;',
      goodWhy: 'One walk instead of one per line.'
    } },
    { h: 'Caching a lookup table' },
    { code: 'DECLARE Cache SHARED ROW;\n\nCREATE PROCEDURE EnsureCache()\nBEGIN\n  IF NOT EXISTS(Cache.Country[]) THEN\n    BEGIN ATOMIC\n      IF NOT EXISTS(Cache.Country[]) THEN\n        SET Cache.Country[] =\n          SELECT C.CODE, C.NAME\n          FROM Database.{\'MAYARDB\'}.MAYAR.COUNTRY AS C;\n      END IF;\n    END;\n  END IF;\nEND;', lang: 'esql', caption: 'One database call for the life of the flow' },
    { h: 'Parsing' },
    { ul: [
      'XMLNSC only builds the part of the tree you actually read. Reading fields you do not need costs real time.',
      'When you only need to route on one field, a <b>Filter</b> node with one path is far cheaper than a Compute node that copies everything.',
      'If the message just passes through untouched, use the <b>BLOB</b> parser and never parse it at all.'
    ] },
    { h: 'Measuring, not guessing' },
    { ul: [
      'Turn on <b>flow statistics</b> to see the CPU time per node.',
      'Use <b>user trace</b> on a single message to see which statements run.',
      'Compare before and after. A change that feels faster often is not.'
    ] },
    { note: 'Almost every slow ESQL module in the world is slow for the same two reasons: long paths inside loops, and a database call per message that should have been cached.' }
  ]);

  lesson(E, 'esql-full', 'ESQL Full Example', 'ESQL Full Example', [
    { p: 'One realistic module: read an XML order, validate it, look up the customer, calculate totals with a reference loop, and build a JSON response.' },
    { code: 'BROKER SCHEMA com.mayaracademy.orders\n\nDECLARE DSN EXTERNAL CHARACTER \'MAYARDB\';\nDECLARE VAT_RATE CONSTANT DECIMAL 0.05;\nDECLARE Cache SHARED ROW;\n\nCREATE COMPUTE MODULE OrderFlow_Transform\n\n  CREATE FUNCTION Main() RETURNS BOOLEAN\n  BEGIN\n    -- ---------- 1. validate ----------\n    IF NOT EXISTS(InputRoot.XMLNSC.order[]) THEN\n      THROW USER EXCEPTION\n        CATALOG \'MayarMessages\' MESSAGE 3001\n        VALUES(\'No order element in the message\');\n    END IF;\n\n    DECLARE orderId CHARACTER\n      InputRoot.XMLNSC.order.(XMLNSC.Attribute)id;\n\n    IF orderId IS NULL OR orderId = \'\' THEN\n      THROW USER EXCEPTION\n        CATALOG \'MayarMessages\' MESSAGE 3002\n        VALUES(\'The order id attribute is required\');\n    END IF;\n\n    -- ---------- 2. headers ----------\n    CALL CopyMessageHeaders();\n    SET OutputRoot.Properties.MessageFormat = \'json\';\n\n    -- ---------- 3. customer lookup ----------\n    CALL EnsureCustomerCache();\n\n    DECLARE custId CHARACTER InputRoot.XMLNSC.order.customerId;\n    DECLARE custName CHARACTER\n      COALESCE(FIELDVALUE(Cache.Customer.{custId}), \'Unknown customer\');\n\n    -- ---------- 4. totals with a reference loop ----------\n    DECLARE net DECIMAL 0;\n    DECLARE lineCount INTEGER 0;\n\n    CREATE FIELD OutputRoot.JSON.Data.lines IDENTITY(JSON.Array)lines;\n    DECLARE outLines REFERENCE TO OutputRoot.JSON.Data.lines;\n\n    DECLARE src REFERENCE TO InputRoot.XMLNSC.order.line[1];\n\n    WHILE LASTMOVE(src) DO\n      DECLARE qty INTEGER CAST(COALESCE(src.qty, \'0\') AS INTEGER);\n      DECLARE price DECIMAL CAST(COALESCE(src.price, \'0\') AS DECIMAL);\n      DECLARE lineTotal DECIMAL qty * price;\n\n      CREATE LASTCHILD OF outLines AS outLine TYPE NAME;\n      SET outLine.sku       = src.sku;\n      SET outLine.qty       = qty;\n      SET outLine.price     = price;\n      SET outLine.lineTotal = lineTotal;\n\n      SET net = net + lineTotal;\n      SET lineCount = lineCount + 1;\n\n      MOVE src NEXTSIBLING NAME \'line\';\n    END WHILE;\n\n    -- ---------- 5. build the response ----------\n    DECLARE vat DECIMAL ROUND(net * VAT_RATE, 2);\n\n    SET OutputRoot.JSON.Data.orderId      = orderId;\n    SET OutputRoot.JSON.Data.customer     = custName;\n    SET OutputRoot.JSON.Data.lineCount    = lineCount;\n    SET OutputRoot.JSON.Data.net          = net;\n    SET OutputRoot.JSON.Data.vat          = vat;\n    SET OutputRoot.JSON.Data.total        = net + vat;\n    SET OutputRoot.JSON.Data.processedAt  =\n      CAST(CURRENT_TIMESTAMP AS CHARACTER FORMAT \'yyyy-MM-dd HH:mm:ss\');\n\n    -- ---------- 6. audit ----------\n    INSERT INTO Database.{DSN}.MAYAR.AUDIT (ID, ORDER_ID, CREATED)\n      VALUES (UUIDASCHAR, orderId, CURRENT_TIMESTAMP);\n\n    IF SQLCODE <> 0 THEN\n      SET OutputLocalEnvironment.Variables.auditFailed = TRUE;\n    END IF;\n\n    RETURN TRUE;\n  END;\n\n  ----------------------------------------------------------------\n  CREATE PROCEDURE EnsureCustomerCache()\n  BEGIN\n    IF NOT EXISTS(Cache.Customer[]) THEN\n      BEGIN ATOMIC\n        IF NOT EXISTS(Cache.Customer[]) THEN\n          DECLARE rows ROW;\n          SET rows.r[] =\n            SELECT C.ID, C.NAME\n            FROM Database.{DSN}.MAYAR.CUSTOMER AS C;\n\n          DECLARE k INTEGER 1;\n          WHILE k <= CARDINALITY(rows.r[]) DO\n            SET Cache.Customer.{rows.r[k].ID} = rows.r[k].NAME;\n            SET k = k + 1;\n          END WHILE;\n        END IF;\n      END;\n    END IF;\n  END;\n\n  ----------------------------------------------------------------\n  CREATE PROCEDURE CopyMessageHeaders()\n  BEGIN\n    DECLARE I INTEGER 1;\n    DECLARE J INTEGER CARDINALITY(InputRoot.*[]);\n    WHILE I < J DO\n      SET OutputRoot.*[I] = InputRoot.*[I];\n      SET I = I + 1;\n    END WHILE;\n  END;\n\nEND MODULE;', lang: 'esql', caption: 'OrderFlow.esql' },
    { h: 'The input it expects' },
    { code: '<order id="A100">\n  <customerId>C77</customerId>\n  <line><sku>AB-1234</sku><qty>2</qty><price>20.00</price></line>\n  <line><sku>CD-5678</sku><qty>1</qty><price>45.00</price></line>\n</order>', lang: 'xsd' },
    { h: 'The JSON it produces' },
    { code: '{\n  "orderId": "A100",\n  "customer": "Max Mule",\n  "lineCount": 2,\n  "net": 85.00,\n  "vat": 4.25,\n  "total": 89.25,\n  "lines": [\n    { "sku": "AB-1234", "qty": 2, "price": 20.00, "lineTotal": 40.00 },\n    { "sku": "CD-5678", "qty": 1, "price": 45.00, "lineTotal": 45.00 }\n  ],\n  "processedAt": "2026-08-29 14:30:00"\n}' },
    { note: 'Notice the shape: validate first, copy headers, cache the lookup, loop with a reference, then build the output. That order is worth copying into every module you write.' }
  ]);

      ['<code>MbException</code>', 'The broker exception type'],

  lesson(JV, 'java-create', 'Creating the Class', 'Creating the Java Class', [
    { h: 'Letting the Toolkit generate it' },
    { ol: [
      'Drag a <b>JavaCompute</b> node onto the flow.',
      'Double click it. The Toolkit asks for a Java project and a class name.',
      'Pick <b>Create a new JavaCompute node class</b>.',
      'Choose a template: pass through, filter, or empty.',
      'The Toolkit creates the class, adds the broker JARs to the build path, and fills in the node\u2019s <b>Java Class</b> property.'
    ] },
    { h: 'The generated template' },
    { code: 'package com.mayaracademy.flows;\n\nimport com.ibm.broker.plugin.*;\n\npublic class TransformMessage extends MbJavaComputeNode {\n\n    public void evaluate(MbMessageAssembly inAssembly) throws MbException {\n        MbOutputTerminal out = getOutputTerminal("out");\n        MbOutputTerminal alt = getOutputTerminal("alternate");\n\n        MbMessage inMessage = inAssembly.getMessage();\n\n        // create a new empty message\n        MbMessage outMessage = new MbMessage();\n        MbMessageAssembly outAssembly =\n            new MbMessageAssembly(inAssembly, outMessage);\n\n        try {\n            // ---- your code here ----\n            copyMessageHeaders(inMessage, outMessage);\n\n            out.propagate(outAssembly);\n        } finally {\n            outMessage.clearMessage();\n        }\n    }\n}', lang: 'java' },
    { h: 'Two ways to make the output message' },
    { table: { headers: ['Constructor', 'Gives you'], rows: [
      ['<code>new MbMessage()</code>', 'An empty message. You build everything yourself.'],
      ['<code>new MbMessage(inMessage)</code>', 'A full copy of the input. Change only what you need.']
    ] } },
    { h: 'Copying only the headers' },
    { p: 'The standard helper. It copies every child of Root except the last one, which is the body.' },
    { code: 'private void copyMessageHeaders(MbMessage inMessage, MbMessage outMessage)\n        throws MbException {\n\n    MbElement outRoot = outMessage.getRootElement();\n    MbElement header  = inMessage.getRootElement().getFirstChild();\n\n    while (header != null && header.getNextSibling() != null) {\n        outRoot.copyElementTree(header);\n        header = header.getNextSibling();\n    }\n}', lang: 'java' },
    { note: 'Always call <code>clearMessage()</code> in a <code>finally</code> block on any message you created yourself. Forgetting it is the classic JavaCompute memory leak.' }
  ]);

  lesson(JV, 'java-assembly', 'The Message Assembly', 'The Message Assembly', [
    { h: 'What arrives in evaluate()' },
    { p: 'An <code>MbMessageAssembly</code> carries four trees. You reach each one with its own getter.' },
    { code: 'public void evaluate(MbMessageAssembly inAssembly) throws MbException {\n\n    MbMessage message          = inAssembly.getMessage();\n    MbMessage localEnvironment = inAssembly.getLocalEnvironment();\n    MbMessage exceptionList    = inAssembly.getExceptionList();\n    MbMessage globalEnvironment = inAssembly.getGlobalEnvironment();\n}', lang: 'java' },

    { code: '// keep the same environment trees, swap in a new message\nMbMessage outMessage = new MbMessage();\nMbMessageAssembly outAssembly = new MbMessageAssembly(inAssembly, outMessage);\n\n// or replace the local environment too\nMbMessage outLocalEnv = new MbMessage(inAssembly.getLocalEnvironment());\nMbMessageAssembly outAssembly2 =\n    new MbMessageAssembly(inAssembly, outLocalEnv,\n                          inAssembly.getExceptionList(), outMessage);', lang: 'java' },

  lesson(JV, 'java-read', 'Reading the Tree', 'Reading the Message Tree', [
    { h: 'Getting to the body' },
    { p: 'The body is always the <b>last child</b> of Root. Its name tells you which parser produced it.' },
    { code: 'MbElement root = inAssembly.getMessage().getRootElement();\nMbElement body = root.getLastChild();\n\nString parser = body.getName();   // "JSON", "XMLNSC", "DFDL", "BLOB" ...', lang: 'java' },
    { h: 'By path: the easy way' },
    { code: '// JSON:  { "Data": { "customer": { "name": "Max" } } }\nMbElement nameEl = root.getFirstElementByPath("/JSON/Data/customer/name");\nString name = (nameEl == null) ? null : nameEl.getValueAsString();\n\n// XML\nMbElement titleEl = root.getFirstElementByPath("/XMLNSC/order/customer");\nString customer = (titleEl == null) ? null : titleEl.getValueAsString();', lang: 'java' },
    { p: 'Always check for <code>null</code>. <code>getFirstElementByPath</code> returns null when the path is not there, and calling a method on it throws a NullPointerException that is hard to trace.' },
    { h: 'By navigation: the fast way' },
    { code: 'MbElement order = root.getLastChild()      // JSON\n                     .getFirstChild()     // Data\n                     .getFirstChild();    // order\n\nString id = order.getFirstElementByPath("id").getValueAsString();', lang: 'java' },
    { table: { headers: ['Method', 'Moves to'], rows: [
      ['<code>getFirstChild()</code>', 'The first child'],
      ['<code>getLastChild()</code>', 'The last child'],
      ['<code>getNextSibling()</code>', 'The next element at the same level'],
      ['<code>getPreviousSibling()</code>', 'The previous sibling'],
      ['<code>getParent()</code>', 'Up one level'],
      ['<code>getFirstElementByPath(p)</code>', 'Anywhere by path'],

    { h: 'Or with getAllElementsByPath' },

    { code: 'MbElement outRoot = outMessage.getRootElement();\n\nMbElement json = outRoot.createElementAsLastChild(MbJSON.PARSER_NAME);\nMbElement data = json.createElementAsLastChild(MbElement.TYPE_NAME, "Data", null);\n\ndata.createElementAsLastChild(MbElement.TYPE_NAME_VALUE, "status", "PROCESSED");\ndata.createElementAsLastChild(MbElement.TYPE_NAME_VALUE, "count", 3);\n\nMbElement customer =\n    data.createElementAsLastChild(MbElement.TYPE_NAME, "customer", null);\ncustomer.createElementAsLastChild(MbElement.TYPE_NAME_VALUE, "name", "Max");\ncustomer.createElementAsLastChild(MbElement.TYPE_NAME_VALUE, "city", "Dubai");', lang: 'java', caption: 'Produces { "status": "PROCESSED", "count": 3, "customer": { ... } }' },
