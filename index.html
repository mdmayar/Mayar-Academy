  L.push({
    id: 'xml', cat: 'Data Formats', title: 'DataWeave XML', nav: 'DataWeave XML',
    blocks: [
      { h: 'Reading XML' },
      { p: 'XML elements become object keys. The root element is a key too.' },
      {
        ex: {
          caption: 'Example',
          payloadMime: 'application/xml',
          payload: '<order id="A100">\n  <customer>Mayar</customer>\n  <item>Book</item>\n  <item>Pen</item>\n</order>',
          script: '%dw 2.0\noutput application/json\n---\n{\n  orderId: payload.order.@id,\n  customer: payload.order.customer,\n  items: payload.order.*item\n}'
        }
      },
      { h: 'Repeated elements' },
      { p: 'XML often has the same tag many times. Use <code>.*tag</code> to get them all.' },
      {
        ex: {
          caption: 'Example',
          payloadMime: 'application/xml',
          payload: '<books>\n  <book><title>A</title><price>10</price></book>\n  <book><title>B</title><price>20</price></book>\n</books>',
          script: '%dw 2.0\noutput application/json\n---\npayload.books.*book map (b) -> {\n  title: b.title,\n  price: b.price as Number\n}'
        }
      },
      { h: 'Writing XML' },
      { p: 'Your body must be one object with one key. That key becomes the root tag.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/xml\n---\n{\n  catalogue: {\n    book: { title: "DataWeave 101", price: 20 },\n    book: { title: "Mule in Action", price: 35 }\n  }\n}'
        }
      },
      { h: 'Writing attributes' },
      { p: 'Put the attributes in <code>@( )</code> after the key.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/xml\n---\n{\n  order @(id: "A100", status: "new"): {\n    customer: "Mayar"\n  }\n}'
        }
      },
      { h: 'Turn an array into repeated tags' },
      {
        ex: {
          caption: 'Example',
          payload: '[{ "name": "Ali" }, { "name": "Sara" }]',
          script: '%dw 2.0\noutput application/xml\n---\n{\n  users: {\n    (payload map (p) -> { user: p.name })\n  }\n}'
        }
      },
      { note: 'XML values are always <b>text</b>. Use <code>as Number</code> when you need to do maths with them.' }
    ],
    exercise: {

    }

          script: '%dw 2.0\noutput application/json\ntype Currency = String { format: "###.00" }\ntype Money = Number\n---\n{\n  price: 45.5 as Currency,\n  qty: 3 as Money\n}'
        }
      },
      { h: 'Types on function parameters' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nfun addTax(amount: Number, rate: Number): Number = amount + (amount * rate)\n---\naddTax(100, 0.15)'
        }
      },
      { h: 'Check a type at run time' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "a": "text", "b": 5, "c": [1,2], "d": null }',
          script: '%dw 2.0\noutput application/json\n---\npayload mapObject ((v, k) -> {\n  (k): typeOf(v)\n})'
        }
      },
      { h: 'Type hierarchy' },
      {
        ul: [
          '<code>Any</code> is the top. Every value is an <code>Any</code>.',
          '<code>Nothing</code> is the bottom. No value is a <code>Nothing</code>.',
          '<code>Null</code>, <code>String</code>, <code>Number</code>, <code>Boolean</code>, <code>Date</code> types are simple.',
          '<code>Array</code> and <code>Object</code> hold other values.'
        ]
      },
      { note: 'Types in DataWeave are optional. Add them when you want the compiler to catch your mistakes early.' }
    ]
  });

  L.push({
    id: 'pattern', cat: 'Advanced', title: 'Pattern Matching', nav: 'Pattern Matching',
    blocks: [
      { h: 'Take an array apart' },
      { p: 'You can split an array into the <b>head</b> (first item) and the <b>tail</b> (the rest).' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n[1, 2, 3, 4] match {\n  case [head ~ tail] -> { first: head, rest: tail }\n  case [] -> { empty: true }\n}'
        }
      },
      { h: 'Build your own joinBy' },
      { p: 'This is how recursion and pattern matching work together.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nfun myJoin(elements, separator) =\n  elements match {\n    case [head ~ tail] -> if (isEmpty(tail)) head\n                          else head ++ separator ++ myJoin(tail, separator)\n    case [] -> ""\n  }\n---\nmyJoin(["a", "b", "c"], "-")'
        }
      },
      { h: 'Take an object apart' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n{ hello: "world", test: true } match {\n  case { k: v ~ tail } -> { firstKey: k, firstValue: v, rest: tail }\n  case {} -> { empty: true }\n}'
        }
      },
      { h: 'Sum a list without reduce' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nfun total(list) = list match {\n  case [] -> 0\n  case [h ~ t] -> h + total(t)\n}\n---\ntotal([10, 20, 30, 40])'
        }
      },
      { note: 'The <code>~</code> sign splits head from tail. It is only used inside a <code>match</code> case.' }
    ]
  });

  L.push({
    id: 'errors', cat: 'Advanced', title: 'DataWeave Error Handling', nav: 'Error Handling',
    blocks: [
      { h: 'Errors happen' },
      { p: 'Common causes: bad casting, a null value, or dividing by zero.' },
      { h: 'try' },
      { p: '<code>try</code> runs code safely. It gives back an object with <code>success</code> and either <code>result</code> or <code>error</code>.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\nimport try from dw::Runtime\noutput application/json\n---\n{\n  good: try(() -> 10 / 2),\n  bad: try(() -> 10 / 0)\n}'
        }
      },
      { h: 'Use the result safely' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\nimport try from dw::Runtime\noutput application/json\nvar attempt = try(() -> "abc" as Number)\n---\nif (attempt.success) attempt.result else 0'
        }
      },
      { h: 'fail' },
      { p: 'Stop the script on purpose with your own message.' },
      { code: '%dw 2.0\nimport fail from dw::Runtime\noutput application/json\n---\nif (payload.id == null)\n  fail("id is required")\nelse\n  payload' },
      { h: 'Prevent errors instead' },
      { p: 'The best answer is often to stop the error from happening at all.' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "a": 10, "b": 0 }',
          script: '%dw 2.0\noutput application/json\n---\n{\n  safeDivide: if (payload.b == 0) null else payload.a / payload.b,\n  safeName: payload.name default "unknown",\n  safeList: (payload.items default []) map ($)\n}'
        }
      },
      { note: 'In Mule you also have <b>Error Handlers</b> in the flow. DataWeave errors bubble up to them.' }
    ]
  });

  L.push({
    id: 'logging', cat: 'Advanced', title: 'DataWeave Logging', nav: 'DataWeave Logging',
    blocks: [
      { h: 'See what is inside' },
      { p: 'The <code>log</code> function prints a value to the Mule log and gives back the same value. Your script keeps working.' },
      { code: '%dw 2.0\noutput application/json\n---\npayload map (p) -> {\n  name: log("current name", p.name)\n}' },

            ['<code>logDebug(msg, value)</code>', 'DEBUG'],
            ['<code>logWarn(msg, value)</code>', 'WARN'],
            ['<code>logError(msg, value)</code>', 'ERROR']
          ]
        }
      },

        }
      },
      { note: 'Take your <code>log</code> lines out before you go to production. They slow the script down.' }
    ]
  });

  L.push({
    id: 'mule', cat: 'Advanced', title: 'DataWeave in Mule', nav: 'DataWeave in Mule',
    blocks: [
      { h: 'Where DataWeave lives in Mule 4' },
      {
        ul: [
          'In the <b>Transform Message</b> component &ndash; a full script.',
          'In any field with <code>#[ ]</code> &ndash; a one line expression.',
          'In a <b>.dwl</b> file inside <code>src/main/resources</code>.'
        ]
      },
      { h: 'The Mule message' },
      {
        table: {
          headers: ['Name', 'What it holds'],
          rows: [
            ['<code>payload</code>', 'The main data'],
            ['<code>attributes</code>', 'Extra info: HTTP headers, query params, file name'],
            ['<code>vars</code>', 'Variables you set earlier in the flow'],
            ['<code>error</code>', 'Error details, only inside an error handler']
          ]
        }
      },
      { h: 'Inline expressions' },
      { code: '<set-variable variableName="now" value="#[now()]" />\n<set-payload value="#[payload.user.name]" />\n<choice>\n  <when expression="#[payload.age >= 18]"> ... </when>\n</choice>' },
      { h: 'Reading HTTP attributes' },
      { code: '%dw 2.0\noutput application/json\n---\n{\n  method: attributes.method,\n  path: attributes.requestPath,\n  queryId: attributes.queryParams.id,\n  auth: attributes.headers.authorization\n}' },
      { h: 'A full Transform Message' },
      { code: '%dw 2.0\noutput application/json\n---\n{\n  requestId: vars.correlationId,\n  receivedAt: now(),\n  customer: {\n    id: payload.customerId,\n    name: payload.firstName ++ " " ++ payload.lastName\n  },\n  lines: payload.items map (i) -> {\n    sku: i.sku,\n    qty: i.quantity,\n    total: i.quantity * i.price\n  }\n}' },
      { note: 'Inside <code>#[ ]</code> you cannot write a header. You only write one expression.' }
    ]
  });

  L.push({
    id: 'best', cat: 'Advanced', title: 'DataWeave Best Practices', nav: 'Best Practices',
    blocks: [
      { h: 'Write code people can read' },
      {
        ul: [
          'Give variables and functions real names, not <code>a</code> and <code>b</code>.',
          'Use the long form <code>(item) -&gt; ...</code> when the logic is more than one line.',
          'Use <code>do</code> to name the steps of a long calculation.',
          'Put reusable logic in <code>fun</code>, not copied five times.'
        ]
      },
      { h: 'Be safe with data' },
      {
        ul: [
          'Use <code>default</code> for any field that may be missing.',
          'Use <code>?</code> to check a key before you use it.',
          'Cast CSV and XML values with <code>as Number</code> before maths.',
          'Never divide before you check for zero.'
        ]
      },
      { h: 'Good and bad' },
      {
        ex: {
          caption: 'Example - hard to read',
          payload: PEOPLE,
          script: '%dw 2.0\noutput application/json\n---\npayload filter ($.name != null and $.salary > 4000) map { n: $.name, s: $.salary * 12 }'
        }
      },
      {
        ex: {
          caption: 'Example - easy to read',
          payload: PEOPLE,
          script: '%dw 2.0\noutput application/json\nvar MONTHS_PER_YEAR = 12\nfun isWellPaid(person) = person.salary > 4000\n---\npayload\n  filter ((person) -> isWellPaid(person))\n  map ((person) -> {\n    name: person.name,\n    yearlySalary: person.salary * MONTHS_PER_YEAR\n  })'
        }
      },
      { h: 'Speed' },
      {
        ul: [
          'Do <code>filter</code> before <code>map</code>. Then you map fewer items.',
          'Do not call the same expensive function twice. Put it in a variable.',
          'Take <code>log</code> out of production code.'
        ]
      },
      { note: 'A script you can read six months later is worth more than a clever one line script.' }
    ]
  });
})();

      { code: '"text"   \'text\'          // String\n42   3.14   -7            // Number\ntrue   false              // Boolean\nnull                      // Null\n[1, 2, 3]                 // Array\n{ a: 1, b: 2 }            // Object\n|2026-08-29|              // Date\n|14:30:00|                // LocalTime\n|2026-08-29T14:30:00Z|    // DateTime\n|P1Y2M3D|                 // Period\n/[a-z]+/                  // Regex\n(x) -> x + 1              // Function' },
      { h: 'Selectors' },
      { code: 'payload.name          // one value\npayload[0]            // by index\npayload[-1]           // last\npayload[0 to 2]       // a range\npayload.*item         // all with that key\npayload..name         // at any depth\npayload.@id           // XML attribute\npayload.&name         // key and value\npayload.name?         // does the key exist\npayload[(varName)]    // dynamic key' },
      { h: 'Operators' },
      { code: '+  -  *  /  mod       // maths\n==  !=  ~=            // equal, not equal, similar\n>  <  >=  <=          // compare\nand  or  not          // logic\n++                    // join text, arrays, objects\n--                    // remove\n>>  <<                // add to front, add to back\nas                    // change type\nis                    // check type\ndefault               // backup when null' },
      { h: 'Flow control' },
      { code: 'if (x > 5) "big" else "small"\n\nx match {\n  case "a" -> 1\n  case n if n > 10 -> 2\n  case is String -> 3\n  else -> 0\n}\n\ndo {\n  var t = 1\n  ---\n  t + 1\n}' },
      { h: 'The big five' },
      { code: 'arr map ((item, index) -> newItem)\narr filter ((item) -> keepIt)\narr reduce ((item, acc) -> newAcc)\narr groupBy ((item) -> bucketKey)\nobj pluck ((value, key) -> newItem)' },
      { h: 'Short forms' },
      { code: '$     // the value\n$$    // the index (map) or the key (mapObject, pluck)\n$$$   // the index (mapObject, pluck)\n\n[1,2,3] map ($ * 2)\nobj mapObject { ($$): $ }' },
      { h: 'Common one liners' },

        ex: {

          script: '%dw 2.0\noutput application/json\n---\n{\n  names: payload.name,\n  itOnly: payload filter ($.dept == "IT"),\n  totalPay: sum(payload.salary),\n  byDept: payload groupBy ($.dept),\n  sorted: payload orderBy ($.salary),\n  renamed: payload map { who: $.name, pay: $.salary },\n  depts: (payload distinctBy ($.dept)).dept,\n  topEarner: (payload maxBy ($.salary)).name\n}'
        }
      },
      { h: 'Safety' },
      { code: 'payload.name default "unknown"     // backup value\npayload.name?                     // true or false\n(payload.items default []) map $  // safe map\nif (b == 0) null else a / b       // safe divide\nvalue as Number                   // cast before maths' }
    ]
  });

/* Mayar Academy - Lessons part 5: the official MuleSoft tutorial track (1.1 - 8.4) */
(function () {
  var L = (window.LESSONS = window.LESSONS || []);
  var CAT = 'MuleSoft Official Track';

  function lesson(id, nav, title, blocks, exercise) {

  }

  /* ============ 1 - INTRODUCTION ============ */

  lesson('t1-1', '1.1 What is DataWeave?', '1.1 What is DataWeave?', [
    { p: 'This part of Mayar Academy follows the <b>official MuleSoft DataWeave tutorial</b>, section by section, in very simple English. Every example runs here in your browser.' },
    { h: 'The short answer' },
    { p: 'DataWeave is a programming language made for <b>transforming data</b>. It is MuleSoft\u2019s main language for data transformation. It is also the expression language you use to configure components and connectors inside Mule.' },
    { p: 'DataWeave also works outside Mule. There is a command line tool, and it now runs inside Salesforce Apex too. In this track we treat DataWeave as a language on its own.' },
    { h: 'What it is good at' },
    { p: 'It does the job every integration developer needs every day: <b>read</b> data in one format, <b>transform</b> it, and <b>write</b> it out in a different format.' },
    { ul: [
      'Take a simple CSV file and turn it into an array of complex JSON objects.',
      'Take XML and write it out as a flat file.',
      'Take JSON from one API and reshape it for another API.'
    ] },
    { p: 'You write the <b>transformation logic</b>. DataWeave takes care of reading, parsing and writing each format quickly.' },
    { h: 'Reader, script, writer' },
    { p: 'When DataWeave gets data, it passes it through three stages:' },
    { ol: [
      'The <b>reader</b> parses the input data into a canonical model. "Canonical model" just means one common shape that DataWeave understands, no matter which format came in.',
      'That model goes into your <b>DataWeave script</b>, which builds a new model.',
      'The <b>writer</b> serializes that new model into the output format you asked for.'
    ] },
    { flow: ['Input data', 'Reader', 'DataWeave script', 'Writer', 'Output data'] },
    { note: 'Inputs and outputs matter a lot in DataWeave. In every lesson here you can click the <b>Input</b> tab to see the data going in, and the <b>Result</b> panel shows the data coming out.' },
    { h: 'See all three stages at once' },
    { p: 'This example reads JSON and writes XML. Only the <code>output</code> line decides the format.' },
    { ex: { caption: 'Example', payload: '{ "message": "Hello from the reader" }', script: '%dw 2.0\noutput application/xml\n---\n{ greeting: payload.message }' } }
  ], {
    q: 'What is the job of the <b>reader</b>?',
    options: ['Parse the input into one common model', 'Write the output file', 'Run your transformation logic', 'Choose the MIME type'],
    answer: 0,
    explain: 'The reader parses the input format into a canonical model that the script can work with.'
  });

  lesson('t1-2', '1.2 MIME Types', '1.2 MIME Types', [
    { h: 'Naming the format' },
    { p: 'DataWeave needs to know which format your data is in, and which format you want back. It uses <b>MIME types</b> for this.' },
    { table: { headers: ['MIME type', 'Format'], rows: [
      ['<code>application/json</code>', 'JSON'],
      ['<code>application/xml</code>', 'XML'],
      ['<code>application/csv</code>', 'CSV'],
      ['<code>application/java</code>', 'Java objects'],
      ['<code>application/yaml</code>', 'YAML'],
      ['<code>text/plain</code>', 'Plain text'],
      ['<code>application/dw</code>', 'DataWeave\u2019s own notation, useful for debugging']
    ] } },
    { h: 'input and output' },
    { p: 'The <code>input</code> directive names an input and its type. The <code>output</code> directive sets the type of the result.' },
    { p: 'This script takes a JSON array and writes it as CSV with no header row:' },
    { ex: { caption: 'Example', payload: '[\n  { "id": 1, "name": "Max" },\n  { "id": 2, "name": "Einstein" }\n]', script: '%dw 2.0\ninput payload application/json\noutput application/csv header=false\n---\npayload' } },
    { h: 'Same body, three different formats' },
    { p: 'Only the <code>output</code> line changes here.' },
    { ex: { caption: 'JSON', script: '%dw 2.0\noutput application/json\n---\n{ pet: { name: "Max", type: "mule" } }' } },
    { ex: { caption: 'XML', script: '%dw 2.0\noutput application/xml\n---\n{ pet: { name: "Max", type: "mule" } }' } },
    { ex: { caption: 'DataWeave notation', script: '%dw 2.0\noutput application/dw\n---\n{ pet: { name: "Max", type: "mule" } }' } },
    { note: 'Inside Mule the reader usually knows the input type already, so the <code>input</code> line is often left out. The <code>output</code> line is almost always written.' }
  ], {
    q: 'Which MIME type would you use to debug the exact internal shape and types of your data?',
    options: ['<code>application/dw</code>', '<code>application/json</code>', '<code>text/plain</code>', '<code>application/java</code>'],
    answer: 0,
    explain: 'application/dw prints DataWeave notation, which shows types such as |2026-08-29| for dates.'
  });

  lesson('t1-3', '1.3 Script Anatomy', '1.3 Script Anatomy', [
    { h: 'The five parts' },
    { p: 'Every DataWeave script is built from the same pieces:' },
    { ol: [
      'The <b>version directive</b>: <code>%dw 2.0</code>. (Mule 3 used <code>%dw 1.0</code>.)',
      'The <b>input directive</b>: names a variable and its MIME type. Optional.',
      'The <b>output directive</b>: the MIME type and any writer properties.',
      'The <b>separator</b>: three dashes <code>---</code>.',
      'The <b>body</b>: the logic that generates the result.'
    ] },
    { code: '%dw 2.0                       // 1. version\ninput payload application/json  // 2. input\noutput application/json         // 3. output\n---                             // 4. separator\npayload                         // 5. body' },
    { h: 'Header and body' },
    { p: 'Everything above <code>---</code> is the <b>header</b>. Everything below is the <b>body</b>. The header sets things up. The body produces exactly one value.' },
    { ex: { caption: 'Example', payload: '{ "user": { "first": "Max", "last": "Mule" } }', script: '%dw 2.0\noutput application/json\nvar company = "MuleSoft"\nfun fullName(u) = u.first ++ " " ++ u.last\n---\n{\n  name: fullName(payload.user),\n  worksAt: company\n}' } },
    { h: 'Writer properties' },
    { p: 'You can add settings after the output MIME type.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json indent=false\n---\n{ a: 1, b: [1, 2, 3] }' } },
    { note: 'If your script has no header at all, DataWeave still runs it, but it has to guess the output type. Always write <code>%dw 2.0</code> and <code>output</code>.' }
  ]);

  /* ============ 2 - CREATING DATA ============ */

  lesson('t2-1', '2.1 Strings', '2.1 Strings', [
    { h: 'Creating a String' },
    { p: 'A String is text. You can wrap it in double quotes or single quotes. Both work the same way.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  doubleQuotes: "Hello Max",\n  singleQuotes: \'Hello Max\'\n}' } },
    { h: 'Joining Strings' },
    { p: 'Use <code>++</code> to put two Strings together.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n"Data" ++ "Weave" ++ " is fun"' } },
    { h: 'Putting values inside a String' },
    { p: 'Write <code>$( )</code> around any expression and its value appears inside the text. This is called <b>string interpolation</b>.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nvar name = "Max"\nvar legs = 4\n---\n"$(name) the mule has $(legs) legs. Half of that is $(legs / 2)."' } },
    { h: 'Escaping' },
    { p: 'Some characters need a backslash in front of them.' },
    { table: { headers: ['You write', 'You get'], rows: [
      ['<code>\\"</code>', 'a double quote'],
      ['<code>\\n</code>', 'a new line'],
      ['<code>\\t</code>', 'a tab'],
      ['<code>\\\\</code>', 'a backslash'],
      ['<code>\\$</code>', 'a real dollar sign']
    ] } },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  quoted: "She said \\"hello\\"",\n  money: "Price: \\$100"\n}' } },
    { h: 'A String is a list of characters' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nvar word = "DataWeave"\n---\n{\n  first: word[0],\n  last: word[-1],\n  slice: word[0 to 3],\n  size: sizeOf(word)\n}' } }
  ], {
    q: 'What does <code>"a" ++ "b"</code> give you?',
    options: ['"ab"', '"a b"', 'an error', '["a", "b"]'],
    answer: 0,

  });

  lesson('t2-2', '2.2 Numbers', '2.2 Numbers', [
    { h: 'One Number type' },
    { p: 'DataWeave has a single <code>Number</code> type. It holds whole numbers and decimals. There is no separate int, long, float or double.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  whole: 42,\n  decimal: 3.14159,\n  negative: -273,\n  big: 9007199254740993,\n  scientific: 1.5e3\n}' } },
    { h: 'Arithmetic' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  add: 7 + 3,\n  subtract: 7 - 3,\n  multiply: 7 * 3,\n  divide: 7 / 2,\n  remainder: 7 mod 3\n}' } },
    { h: 'Useful number functions' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  abs: abs(-9),\n  ceil: ceil(2.1),\n  floor: floor(2.9),\n  round: round(2.5),\n  sqrt: sqrt(81),\n  pow: pow(3, 4),\n  isEven: isEven(10),\n  isInteger: isInteger(10.0)\n}' } },

    { p: 'Data from CSV and XML always arrives as text. Cast it before doing maths.' },
    { ex: { caption: 'Example', payload: '{ "price": "19.99", "qty": "3" }', script: '%dw 2.0\noutput application/json\n---\n{\n  wrong: payload.price ++ payload.qty,\n  right: (payload.price as Number) * (payload.qty as Number)\n}' } },
    { note: 'Dividing by zero throws an error. Check the divisor first when the number comes from outside.' }

      solution: '%dw 2.0\noutput application/json\nvar result = { status: "ok" }\n---\nresult.status match {\n  case "ok" -> { message: "Request successfully processed." }\n  else -> { message: "Please try again later." }\n}'
    } },
    { h: 'Then do it the other way' },
    { p: 'If you solved it with <code>if else</code>, solve it again with pattern matching. If you solved it with pattern matching, solve it again with <code>if else</code>. Both answers are correct.' },
    { ex: { caption: 'The if else version', script: '%dw 2.0\noutput application/json\nvar result = { status: "failed" }\n---\nif (result.status == "ok")\n  { message: "Request successfully processed." }\nelse\n  { message: "Please try again later." }' } }
  ]);

  /* ============ 6 - FUNCTIONS ============ */

  lesson('t6-1', '6.1 Named functions', '6.1 Named Functions', [
    { h: 'Declaring with fun' },
    { p: 'A named function is declared in the header with <code>fun</code>. Give it a name, parameters in brackets, an equals sign, and one expression.' },
    { code: 'fun name(param1, param2) = expression' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nfun double(n) = n * 2\nfun add(a, b) = a + b\nfun greet(who) = "Hello, " ++ who ++ "!"\n---\n{\n  d: double(21),\n  s: add(40, 2),\n  g: greet("Max")\n}' } },
    { h: 'Types on parameters' },
    { p: 'Adding types is optional. It helps the compiler catch mistakes early.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nfun area(width: Number, height: Number): Number = width * height\n---\narea(4, 5)' } },
    { h: 'Default values' },
    { p: 'A parameter with a default must come last.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nfun withTax(amount, rate = 0.08) = amount + (amount * rate)\n---\n{\n  usingDefault: withTax(100),\n  usingCustom: withTax(100, 0.2)\n}' } },
    { h: 'Functions calling functions' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nfun celsius(f) = (f - 32) / 1.8\nfun label(f) = "$(f)F is about $(round(celsius(f)))C"\n---\n[32, 72, 212] map label($)' } },
    { note: 'DataWeave functions are <b>pure</b>. The same input always gives the same output, and nothing outside the function changes.' }
  ]);

  lesson('t6-2', '6.2 Lambdas', '6.2 Lambdas', [
    { h: 'A function with no name' },
    { p: 'A lambda is an anonymous function. You write the parameters, then an arrow, then the body.' },
    { code: '(parameter) -> expression' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n[1, 2, 3, 4] map ((n) -> n * n)' } },
    { h: 'More than one parameter' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n["a", "b", "c"] map ((letter, index) -> "$(index): $(letter)")' } },
    { h: 'Lambdas are values' },
    { p: 'You can store a lambda in a variable and call it later.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nvar square = (n) -> n * n\nvar shout = (s) -> upper(s) ++ "!"\n---\n{\n  squared: square(12),\n  shouted: shout("hello"),\n  mapped: [1, 2, 3] map square($)\n}' } },
    { h: 'fun is sugar for a lambda' },
    { p: 'These two lines mean exactly the same thing:' },
    { code: 'var double = (n) -> n * 2\nfun double(n) = n * 2' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nvar doubleA = (n) -> n * 2\nfun doubleB(n) = n * 2\n---\n{ a: doubleA(5), b: doubleB(5), same: doubleA(5) == doubleB(5) }' } }
  ]);

  lesson('t6-3', '6.3 Function as value', '6.3 Function as Value', [
    { h: 'Functions are first class' },
    { p: 'In DataWeave a function is a value, just like a number or a String. You can store it, pass it into another function, and return it from a function.' },
    { h: 'Passing a function in' },
    { p: 'A function that takes another function is called a <b>higher order function</b>. <code>map</code> and <code>filter</code> are the ones you use most.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nvar applyTwice = (f, x) -> f(f(x))\nvar addTen = (n) -> n + 10\n---\n{\n  twice: applyTwice(addTen, 1),\n  inline: applyTwice((n) -> n * 3, 2)\n}' } },
    { h: 'Choosing a function at run time' },
    { ex: { caption: 'Example', payload: '{ "mode": "loud", "text": "mayar academy" }', script: '%dw 2.0\noutput application/json\nvar loud = (s) -> upper(s)\nvar quiet = (s) -> lower(s)\nvar chosen = if (payload.mode == "loud") loud else quiet\n---\nchosen(payload.text)' } },
    { h: 'Returning a function' },
    { p: 'A function can build and hand back another function. This is how you make a family of related functions.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nfun multiplier(factor) = (n) -> n * factor\nvar triple = multiplier(3)\nvar tenTimes = multiplier(10)\n---\n{\n  triple: [1, 2, 3] map triple($),\n  tenTimes: [1, 2, 3] map tenTimes($)\n}' } },
    { h: 'Composing functions' },
    { ex: { caption: 'Example', script: '%dw 2.0\nimport * from dw::core::Strings\noutput application/json\nfun compose(f, g) = (x) -> f(g(x))\nvar trimThenUpper = compose((s) -> upper(s), (s) -> trim(s))\n---\ntrimThenUpper("   mayar   ")' } }
  ], {
    q: 'What is a <b>higher order function</b>?',
    options: ['A function that takes or returns another function', 'A function declared at the top of the header', 'A function with more than three parameters', 'A recursive function'],
    answer: 0,
    explain: 'map, filter and reduce are all higher order functions: they take a function as an argument.'
  });

  lesson('t6-4', '6.4 Infix notation', '6.4 Infix Notation', [
    { h: 'Two ways to call' },
    { p: 'A function with exactly <b>two</b> parameters can be called in the normal way, or written between its two arguments. That second style is called <b>infix notation</b>.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  prefix: map([1, 2, 3], (n) -> n * 2),\n  infix: [1, 2, 3] map ((n) -> n * 2)\n}' } },
    { h: 'Your own functions work too' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\nfun plus(a, b) = a + b\nfun times(a, b) = a * b\n---\n{\n  prefix: plus(2, 3),\n  infix: 2 plus 3,\n  chained: 2 plus 3 times 4\n}' } },
    { p: 'Infix calls read from left to right. <code>2 plus 3 times 4</code> is <code>(2 plus 3) times 4</code>, which is 20.' },
    { h: 'Why it matters' },
    { p: 'Infix notation is what makes long DataWeave pipelines readable.' },
    { ex: { caption: 'Example', payload: '[\n  { "name": "Max", "dept": "IT", "pay": 5000 },\n  { "name": "Astro", "dept": "HR", "pay": 4000 },\n  { "name": "Einstein", "dept": "IT", "pay": 6000 }\n]', script: '%dw 2.0\noutput application/json\n---\npayload\n  filter ((p) -> p.pay > 4000)\n  map ((p) -> p.name)\n  orderBy ($)' } },
    { note: 'Wrap the right side in round brackets when it contains an operator. <code>filter ($.pay &gt; 4000)</code> is safe; without the brackets the comparison can bind the wrong way.' }
  ]);

  lesson('t6-5', '6.5 $, $$, $$$ syntax', '6.5 $, $$, $$$ Syntax', [
    { h: 'The short form' },
    { p: 'When a lambda is short, you can drop the parameter names completely and use the anonymous parameters instead.' },
    { table: { headers: ['Symbol', 'In map / filter', 'In mapObject / pluck / filterObject'], rows: [
      ['<code>$</code>', 'the value', 'the value'],
      ['<code>$$</code>', 'the index', 'the key'],
      ['<code>$$$</code>', '\u2013', 'the index']
    ] } },
    { h: 'On an Array' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  named: [10, 20, 30] map ((value, index) -> "$(index)=$(value)"),\n  short: [10, 20, 30] map ("$($$)=$($)")\n}' } },
    { h: 'On an Object' },
    { ex: { caption: 'Example', payload: '{ "a": 1, "b": 2, "c": 3 }', script: '%dw 2.0\noutput application/json\n---\n{\n  values: payload mapObject { ($$): $ * 10 },\n  keys: payload pluck ($$),\n  positions: payload pluck ($$$)\n}' } },
    { h: 'In reduce, $$ is the accumulator' },
    { p: '<code>reduce</code> is the one place where <code>$$</code> means something different: it is the running answer, not the index.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  named: [1, 2, 3, 4] reduce ((item, total) -> total + item),\n  short: [1, 2, 3, 4] reduce ($$ + $)\n}' } },
    { note: 'Use the short form for one simple line. When the logic gets longer, name your parameters \u2014 the person reading your code next will thank you.' }
  ], {
    q: 'Inside <code>mapObject</code>, what does <code>$$</code> mean?',
    options: ['The key', 'The value', 'The index', 'The whole object'],
    answer: 0,
    explain: 'In mapObject and pluck the order is value, key, index \u2014 so $$ is the key.'
  });

  /* ============ 7 - WORKING WITH ARRAYS ============ */

  var STAFF = '[\n  { "name": "Max", "dept": "IT", "pay": 5000 },\n  { "name": "Astro", "dept": "HR", "pay": 4000 },\n  { "name": "Einstein", "dept": "IT", "pay": 6000 },\n  { "name": "Coda", "dept": "Sales", "pay": 4500 }\n]';

  lesson('t7-1', '7.1 filter', '7.1 filter', [
    { h: 'Keeping what you want' },
    { p: '<code>filter</code> walks an Array and keeps only the items where your expression returns <code>true</code>. The result is a smaller Array.' },
    { code: 'array filter (item, index) -> Boolean' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n[1, 2, 3, 4, 5, 6, 7, 8] filter ($ mod 2 == 0)' } },
    { h: 'Filtering records' },
    { ex: { caption: 'Example', payload: STAFF, script: '%dw 2.0\noutput application/json\n---\npayload filter ((p) -> p.dept == "IT")' } },
    { h: 'Several conditions' },
    { ex: { caption: 'Example', payload: STAFF, script: '%dw 2.0\noutput application/json\n---\npayload filter ((p) -> p.dept == "IT" and p.pay > 5000)' } },
    { h: 'Using the index' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n["a", "b", "c", "d", "e"] filter ((v, i) -> isEven(i))' } },
    { note: 'When nothing matches you get an empty Array <code>[]</code>, never <code>null</code>. So you can safely keep chaining after a filter.' }
  ]);

  lesson('t7-2', '7.2 map', '7.2 map', [
    { h: 'Changing every item' },
    { p: '<code>map</code> walks an Array and builds a <b>new</b> Array of the same size. Each item is replaced by whatever your expression returns.' },
    { code: 'array map (item, index) -> newItem' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n[1, 2, 3, 4] map ($ * 10)' } },
    { h: 'Reshaping records' },
    { p: 'This is what map is really for. You take the shape one system gives you and turn it into the shape another system wants.' },
    { ex: { caption: 'Example', payload: STAFF, script: '%dw 2.0\noutput application/json\n---\npayload map (p) -> {\n  employeeName: upper(p.name),\n  department: p.dept,\n  monthlyPay: p.pay,\n  yearlyPay: p.pay * 12\n}' } },
    { h: 'Keeping the original and adding to it' },
    { ex: { caption: 'Example', payload: STAFF, script: '%dw 2.0\noutput application/json\n---\npayload map ($ ++ { isWellPaid: $.pay >= 5000 })' } },
    { h: 'map inside map' },
    { ex: { caption: 'Example', payload: '[\n  { "order": 1, "items": [{ "sku": "A", "qty": 2 }, { "sku": "B", "qty": 1 }] },\n  { "order": 2, "items": [{ "sku": "C", "qty": 5 }] }\n]', script: '%dw 2.0\noutput application/json\n---\npayload map (o) -> {\n  id: o.order,\n  lines: o.items map (l) -> { code: l.sku, count: l.qty }\n}' } },
    { note: '<code>map</code> always returns an Array. If you want an Object back, use <code>mapObject</code>.' }
  ]);

  lesson('t7-3', '7.3 distinct by', '7.3 distinctBy', [
    { h: 'Removing duplicates' },
    { p: '<code>distinctBy</code> keeps the first item of each group and drops the rest. You decide what makes two items "the same".' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n[1, 2, 2, 3, 3, 3, 4, 1] distinctBy ($)' } },
    { h: 'Unique by a field' },
    { ex: { caption: 'Example', payload: '[\n  { "id": 1, "city": "Dubai" },\n  { "id": 2, "city": "Cairo" },\n  { "id": 3, "city": "Dubai" },\n  { "id": 4, "city": "Doha" }\n]', script: '%dw 2.0\noutput application/json\n---\npayload distinctBy ((r) -> r.city)' } },
    { h: 'Getting the list of unique values' },
    { ex: { caption: 'Example', payload: STAFF, script: '%dw 2.0\noutput application/json\n---\n{\n  departments: (payload distinctBy ((p) -> p.dept)).dept,\n  howMany: sizeOf(payload distinctBy ((p) -> p.dept))\n}' } },
    { h: 'Distinct on a combination' },
    { p: 'Build one key out of several fields to define your own idea of "the same".' },
    { ex: { caption: 'Example', payload: '[\n  { "first": "Max", "last": "Mule" },\n  { "first": "Max", "last": "Smith" },\n  { "first": "Max", "last": "Mule" }\n]', script: '%dw 2.0\noutput application/json\n---\npayload distinctBy ((p) -> p.first ++ "|" ++ p.last)' } },
    { note: 'It always keeps the <b>first</b> one it meets. Sort the Array first if you care which duplicate survives.' }
  ]);

  lesson('t7-4', '7.4 group by', '7.4 groupBy', [
    { h: 'Making buckets' },
    { p: '<code>groupBy</code> takes an Array and returns an <b>Object</b>. Each key is a bucket name, and each value is the Array of items in that bucket.' },
    { ex: { caption: 'Example', payload: STAFF, script: '%dw 2.0\noutput application/json\n---\npayload groupBy ((p) -> p.dept)' } },
    { h: 'The key is always text' },
    { p: 'Whatever your expression returns is turned into a String, because Object keys are text.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n[1, 2, 3, 4, 5, 6] groupBy ((n) -> if (isEven(n)) "even" else "odd")' } },
    { h: 'Group, then summarise' },
    { p: 'This is the pattern you will use most in real work: group, then <code>mapObject</code> over the buckets.' },
    { ex: { caption: 'Example', payload: STAFF, script: '%dw 2.0\noutput application/json\n---\n(payload groupBy ((p) -> p.dept)) mapObject ((people, dept) -> {\n  (dept): {\n    headcount: sizeOf(people),\n    totalPay: sum(people.pay),\n    names: people.name\n  }\n})' } },
    { h: 'The classic interview question' },
    { p: 'Turn an Object of person to role into an Object of role to people.' },
    { ex: { caption: 'Example', payload: '{\n  "A": "Admin",\n  "B": "User",\n  "C": "Admin",\n  "D": "Guest"\n}', script: '%dw 2.0\noutput application/json\n---\n(payload pluck ((role, person) -> { person: person as String, role: role }))\n  groupBy ((r) -> r.role)\n  mapObject ((rows, role) -> { (role): rows.person })' } },
    { note: '<code>groupBy</code> is the opposite of <code>pluck</code>. Group turns a list into an Object; pluck turns an Object back into a list.' }
  ], {
    q: 'What type does <code>groupBy</code> return?',
    options: ['An Object of Arrays', 'An Array of Arrays', 'An Array of Objects', 'A String'],
    answer: 0,
    explain: 'Each key is a group name and each value is the Array of items in that group.'
  });

  lesson('t7-5', '7.5 reduce', '7.5 reduce', [
    { h: 'Many values into one' },
    { p: '<code>reduce</code> walks the Array carrying an <b>accumulator</b> \u2014 the answer so far. At the end, the accumulator is the result.' },
    { code: 'array reduce (item, accumulator) -> newAccumulator' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n[1, 2, 3, 4, 5] reduce ((item, total) -> total + item)' } },
    { p: 'Without a starting value the accumulator begins as the first item, and the walk starts at the second.' },
    { h: 'Giving it a starting value' },
    { p: 'Write <code>= startValue</code> after the accumulator name. Now the walk starts at the first item.' },
    { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  fromZero: [1, 2, 3] reduce ((n, acc = 0) -> acc + n),\n  fromHundred: [1, 2, 3] reduce ((n, acc = 100) -> acc + n),\n  joined: ["a", "b", "c"] reduce ((s, acc = "") -> acc ++ s)\n}' } },
    { h: 'Building an Object' },
    { p: 'The accumulator does not have to be a number. Start with an empty Object and add to it.' },
    { ex: { caption: 'Example', payload: '[\n  { "k": "colour", "v": "red" },\n  { "k": "size", "v": "large" },\n  { "k": "qty", "v": 3 }\n]', script: '%dw 2.0\noutput application/json\n---\npayload reduce ((item, acc = {}) -> acc ++ { (item.k): item.v })' } },
    { h: 'Finding the maximum by hand' },
    { ex: { caption: 'Example', payload: STAFF, script: '%dw 2.0\noutput application/json\n---\npayload reduce ((p, best) -> if (p.pay > best.pay) p else best)' } },
    { note: 'For a plain total, <code>sum()</code> is shorter and clearer. Reach for <code>reduce</code> when the logic is more than adding.' }
  ], {
    q: 'In <code>reduce ((item, acc = 0) -&gt; acc + item)</code>, what is <code>acc</code> at the very start?',
    options: ['0', 'The first item', 'null', 'The whole Array'],
    answer: 0,
    explain: 'The = 0 sets the starting accumulator, so the walk begins at the first item with acc = 0.'
  });

  lesson('t7-6', '7.6 Challenge', '7.6 Challenge \u2013 Arrays', [
    { p: 'This is the official challenge from section 7.6. Use the functions you just learned plus the concatenation operator <code>++</code>.' },
    { h: 'What to build' },
    { p: 'Work with the payload so that the missing <code>day</code> field is added to each event, and only the events organised by <b>Ross</b> are kept.' },
    { h: 'Wanted output' },
    { code: '[\n  {\n    "datetime": "2020-01-02T18:00:00",\n    "event": "Study for cert exam",\n    "organizer": "Ross",\n    "day": "thu"\n  },\n  {\n    "datetime": "2020-01-08T08:00:00",\n    "event": "Develop mule application",\n    "organizer": "Ross",\n    "day": "wed"\n  }\n]' },
    { h: 'The hint from the tutorial' },
    { p: 'A datetime String can be converted to a <code>LocalDateTime</code>. Then date decomposition gives you a day of the week from 1 to 7, which you can map onto the name you want.' },
    { ex: { caption: 'The hint in code', script: '%dw 2.0\noutput application/json\nvar dayNames = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]\nvar sample = "2020-01-02T18:00:00" as LocalDateTime\n---\n{\n  theDate: sample,\n  dayNumber: sample.dayOfWeek,\n  dayName: dayNames[sample.dayOfWeek - 1]\n}' } },
    { task: {
      n: 76,
      title: 'Challenge 7.6',
      text: 'Keep only Ross\u2019s events and add a <code>day</code> field with the short day name.',
      payload: '[\n  { "datetime": "2020-01-01T08:00:00", "event": "Breakfast @ Cafe", "organizer": "Phoebe" },\n  { "datetime": "2020-01-02T18:00:00", "event": "Study for cert exam", "organizer": "Ross" },\n  { "datetime": "2020-01-04T16:00:00", "event": "Drinks w/ friends", "organizer": "Monica" },\n  { "datetime": "2020-01-08T08:00:00", "event": "Develop mule application", "organizer": "Ross" },\n  { "datetime": "2020-01-05T08:00:00", "event": "Football game", "organizer": "Joey" }\n]',
      start: '%dw 2.0\noutput application/json\nvar dayNames = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]\n---\npayload',
      solution: '%dw 2.0\noutput application/json\nvar dayNames = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]\n---\npayload\n  filter ((e) -> e.organizer == "Ross")\n  map ((e) -> e ++ {\n    day: dayNames[(e.datetime as LocalDateTime).dayOfWeek - 1]\n  })'
    } },
    { note: 'Do the <code>filter</code> before the <code>map</code>. Then you only convert the dates you actually keep.' }
  ]);

  /* ============ 8 - WORKING WITH OBJECTS ============ */

  lesson('t8-1', '8.1 filterObject', '8.1 filterObject', [
    { h: 'Keeping some pairs' },
    { p: '<code>filterObject</code> is <code>filter</code> for Objects. It keeps the key and value pairs where your expression is true, and returns an Object.' },
    { code: 'object filterObject (value, key, index) -> Boolean' },
    { ex: { caption: 'Example', payload: '{ "a": 1, "b": 2, "c": 3, "d": 4 }', script: '%dw 2.0\noutput application/json\n---\npayload filterObject ((value) -> value > 2)' } },
    { h: 'Filtering on the key' },
    { ex: { caption: 'Example', payload: '{ "name": "Max", "password": "secret", "email": "max@mule.com", "passwordHint": "pets" }', script: '%dw 2.0\noutput application/json\n---\npayload filterObject ((value, key) -> not ((key as String) startsWith "password"))' } },
    { h: 'Dropping nulls and blanks' },
    { p: 'This is the everyday use. APIs love sending you empty fields.' },
    { ex: { caption: 'Example', payload: '{ "a": 1, "b": null, "c": "", "d": "keep me", "e": null }', script: '%dw 2.0\noutput application/json\n---\npayload filterObject ((v) -> not isEmpty(v))' } },
    { h: 'The short form' },
    { ex: { caption: 'Example', payload: '{ "x": 10, "y": 0, "z": 30 }', script: '%dw 2.0\noutput application/json\n---\npayload filterObject ($ > 0)' } },
    { note: 'The key arrives as the <b>Key</b> type, not a String. Write <code>key as String</code> before using String functions on it.' }
  ]);

  lesson('t8-2', '8.2 mapObject', '8.2 mapObject', [
    { h: 'Changing an Object' },
    { p: '<code>mapObject</code> walks an Object and builds a new Object. Your expression must return an Object \u2014 usually one pair.' },
    { code: 'object mapObject (value, key, index) -> { newKey: newValue }' },
    { h: 'Changing the values' },
    { ex: { caption: 'Example', payload: '{ "a": 1, "b": 2, "c": 3 }', script: '%dw 2.0\noutput application/json\n---\npayload mapObject ((value, key) -> { (key): value * 100 })' } },
    { h: 'Changing the keys' },
    { ex: { caption: 'Example', payload: '{ "first_name": "Max", "last_name": "Mule", "home_city": "SF" }', script: '%dw 2.0\nimport * from dw::core::Strings\noutput application/json\n---\npayload mapObject ((value, key) -> { (camelize(key as String)): value })' } },
    { h: 'Changing both' },
    { ex: { caption: 'Example', payload: '{ "a": "one", "b": "two" }', script: '%dw 2.0\noutput application/json\n---\npayload mapObject ((v, k) -> { (upper(k as String)): upper(v) })' } },
    { h: 'Swapping keys and values' },
    { ex: { caption: 'Example', payload: '{ "one": 1, "two": 2, "three": 3 }', script: '%dw 2.0\noutput application/json\n---\npayload mapObject ((v, k) -> { (v as String): k as String })' } },
    { h: 'The short form' },
    { ex: { caption: 'Example', payload: '{ "x": 10, "y": 20 }', script: '%dw 2.0\noutput application/json\n---\npayload mapObject { ($$): $ + 5 }' } },
    { note: 'If two different keys map onto the same new key, both pairs stay in the Object. DataWeave allows repeated keys.' }
  ]);

  lesson('t8-3', '8.3 pluck', '8.3 pluck', [
    { h: 'Object into Array' },
    { p: '<code>pluck</code> is the opposite of <code>groupBy</code>. It walks an Object and returns an <b>Array</b>. You get the value, the key and the index.' },
    { code: 'object pluck (value, key, index) -> newItem' },
    { ex: { caption: 'Example', payload: '{ "a": 1, "b": 2, "c": 3 }', script: '%dw 2.0\noutput application/json\n---\npayload pluck ((value, key) -> { field: key as String, amount: value })' } },
    { h: 'Just the keys, or just the values' },
    { ex: { caption: 'Example', payload: '{ "a": 1, "b": 2, "c": 3 }', script: '%dw 2.0\noutput application/json\n---\n{\n  keys: payload pluck ($$),\n  values: payload pluck ($),\n  positions: payload pluck ($$$)\n}' } },
    { h: 'Flattening a grouped Object' },
    { p: 'After a <code>groupBy</code>, <code>pluck</code> turns the buckets back into a tidy list.' },
    { ex: { caption: 'Example', payload: '{\n  "IT": [{ "name": "Max" }, { "name": "Einstein" }],\n  "HR": [{ "name": "Astro" }]\n}', script: '%dw 2.0\noutput application/json\n---\npayload pluck ((people, dept) -> {\n  department: dept as String,\n  headcount: sizeOf(people),\n  staff: people.name\n})' } },
    { h: 'Turning an Object into CSV rows' },
    { ex: { caption: 'Example', payload: '{ "jan": 100, "feb": 150, "mar": 120 }', script: '%dw 2.0\noutput application/csv\n---\npayload pluck ((total, month) -> { month: month as String, total: total })' } },
    { note: '<code>pluck</code> uses the same order as <code>mapObject</code>: value, key, index. So <code>$</code> is the value and <code>$$</code> is the key.' }
  ], {
    q: 'What does <code>pluck</code> return?',
    options: ['An Array', 'An Object', 'A String', 'A Boolean'],
    answer: 0,
    explain: 'pluck turns an Object into an Array \u2014 one item per key and value pair.'
  });

  lesson('t8-4', '8.4 update', '8.4 update', [
    { h: 'Changing one thing, keeping the rest' },
    { p: 'The <code>update</code> operator changes a value somewhere inside your data and leaves everything else exactly as it was.' },
    { code: 'value update {\n  case fieldName at .path.to.field -> newValue\n}' },
    { ex: { caption: 'Example', payload: '{ "id": 1, "name": "max", "active": false }', script: '%dw 2.0\noutput application/json\n---\npayload update {\n  case name at .name -> upper(name)\n}' } },
    { h: 'Deep inside a structure' },
    { p: 'Without <code>update</code> you would have to rebuild every level by hand.' },
    { ex: { caption: 'Example', payload: '{\n  "order": {\n    "id": 7,\n    "customer": { "name": "max", "city": "san francisco" }\n  }\n}', script: '%dw 2.0\nimport * from dw::core::Strings\noutput application/json\n---\npayload update {\n  case c at .order.customer.city -> capitalize(c)\n}' } },
    { h: 'Several fields at once' },
    { ex: { caption: 'Example', payload: '{ "price": 100, "qty": 2, "status": "new" }', script: '%dw 2.0\noutput application/json\n---\npayload update {\n  case p at .price -> p * 1.1\n  case s at .status -> upper(s)\n}' } },
    { h: 'Only when a rule is true' },
    { ex: { caption: 'Example', payload: '{ "name": "Max", "score": 45 }', script: '%dw 2.0\noutput application/json\n---\npayload update {\n  case s at .score if (s < 50) -> 50\n}' } },
    { h: 'Adding a field that is not there' },
    { ex: { caption: 'Example', payload: '{ "id": 1 }', script: '%dw 2.0\noutput application/json\n---\npayload update {\n  case at .verified -> true\n}' } },
    { h: 'Inside an Array item' },
    { ex: { caption: 'Example', payload: '[{ "n": "a", "v": 1 }, { "n": "b", "v": 2 }]', script: '%dw 2.0\noutput application/json\n---\npayload update {\n  case v at [0].v -> v * 100\n}' } },
    { note: 'Before <code>update</code> existed, people wrote <code>(payload -- ["x"]) ++ { x: newValue }</code>. That still works, but <code>update</code> is far easier to read \u2014 and it reaches deep fields without rebuilding the whole object.' }
  ], {
    q: 'What does <code>update</code> do to the fields you did not mention?',
    options: ['It keeps them unchanged', 'It removes them', 'It sets them to null', 'It moves them to the end'],
    answer: 0,
    explain: 'update only touches the paths in its cases. Everything else is copied through as it was.'
  });
})();

/* Mayar Academy - Lessons part 6: Tips, advanced, good vs bad, mistakes, contact */
(function () {
  var L = (window.LESSONS = window.LESSONS || []);
  var CAT = 'Tips & Best Practice';

  L.push({
    id: 'tips', cat: CAT, title: 'DataWeave Tips and Tricks', nav: 'Tips and Tricks',
    blocks: [
      { p: 'Small things that make your scripts shorter, safer and easier to read. Every one of them runs here.' },

      { h: '1. Reverse an Array with a range' },
      { p: 'There is no <code>reverse order</code> option on <code>orderBy</code>. Sort up, then flip.' },
      { ex: { caption: 'Tip', script: '%dw 2.0\noutput application/json\nvar nums = [3, 1, 4, 1, 5]\n---\n{\n  up: nums orderBy ($),\n  down: (nums orderBy ($))[-1 to 0]\n}' } },

      { h: '2. Sort numbers downward with a minus sign' },
      { ex: { caption: 'Tip', payload: '[{ "n": "a", "v": 3 }, { "n": "b", "v": 9 }, { "n": "c", "v": 5 }]', script: '%dw 2.0\noutput application/json\n---\npayload orderBy (-$.v)' } },

      { h: '3. Sort by two fields with one key' },
      { p: 'Glue the fields together. Pad numbers so they line up.' },
      { ex: { caption: 'Tip', payload: '[\n  { "dept": "IT", "name": "Zoe" },\n  { "dept": "HR", "name": "Ann" },\n  { "dept": "IT", "name": "Adam" }\n]', script: '%dw 2.0\noutput application/json\n---\npayload orderBy ($.dept ++ "|" ++ $.name)' } },

      { h: '4. Rename every key in one line' },
      { ex: { caption: 'Tip', payload: '{ "first_name": "Max", "last_name": "Mule" }', script: '%dw 2.0\nimport * from dw::core::Strings\noutput application/json\n---\npayload mapObject { (camelize($$ as String)): $ }' } },

      { h: '5. Drop empty fields before you send data out' },
      { ex: { caption: 'Tip', payload: '{ "a": 1, "b": null, "c": "", "d": [], "e": "keep" }', script: '%dw 2.0\noutput application/json\n---\npayload filterObject ((v) -> not isEmpty(v))' } },

      { h: '6. Build a lookup table once, use it many times' },
      { p: 'Turning a list into an Object first is far faster than searching the list again and again.' },
      { ex: { caption: 'Tip', payload: '{\n  "codes": [{ "id": "A", "label": "Alpha" }, { "id": "B", "label": "Bravo" }],\n  "rows": [{ "code": "B" }, { "code": "A" }, { "code": "B" }]\n}', script: '%dw 2.0\noutput application/json\nvar lookup = payload.codes reduce ((c, acc = {}) -> acc ++ { (c.id): c.label })\n---\npayload.rows map ((r) -> { code: r.code, label: lookup[r.code] })' } },

      { h: '7. Count things without writing a loop' },
      { ex: { caption: 'Tip', payload: '["red", "blue", "red", "green", "red", "blue"]', script: '%dw 2.0\noutput application/json\n---\n(payload groupBy ($)) mapObject ((items, colour) -> { (colour): sizeOf(items) })' } },

      { h: '8. Give every item a running number' },
      { ex: { caption: 'Tip', payload: '["apple", "pear", "plum"]', script: '%dw 2.0\noutput application/json\n---\npayload map ((fruit, i) -> { line: i + 1, name: fruit })' } },

      { h: '9. Safe navigation all the way down' },
      { p: 'A missing key gives <code>null</code>, and <code>null</code> keeps giving <code>null</code>. Add <code>default</code> at the end.' },
      { ex: { caption: 'Tip', payload: '{ "a": {} }', script: '%dw 2.0\noutput application/json\n---\n{\n  deep: payload.a.b.c.d default "not found",\n  safeList: (payload.a.items default []) map ($)\n}' } },

      { h: '10. Turn one Object into rows for CSV' },
      { ex: { caption: 'Tip', payload: '{ "jan": 100, "feb": 150, "mar": 90 }', script: '%dw 2.0\noutput application/csv\n---\npayload pluck ((total, month) -> { month: month as String, total: total })' } },

      { h: '11. Split a full name without a regex' },
      { ex: { caption: 'Tip', script: '%dw 2.0\nimport * from dw::core::Strings\noutput application/json\nvar full = "Max The Mule"\n---\n{\n  first: substringBefore(full, " "),\n  rest: substringAfter(full, " "),\n  words: full splitBy " ",\n  initials: (full splitBy " ") map ($[0]) joinBy "."\n}' } },

      { h: '12. Pad a number to a fixed width' },
      { ex: { caption: 'Tip', script: '%dw 2.0\nimport * from dw::core::Strings\noutput application/json\n---\n[1, 42, 7] map ((n) -> "INV-" ++ leftPad(n as String, 5, "0"))' } },

      { h: '13. Flatten a nested list in one step' },
      { ex: { caption: 'Tip', payload: '[\n  { "order": 1, "items": ["A", "B"] },\n  { "order": 2, "items": ["C"] }\n]', script: '%dw 2.0\noutput application/json\n---\npayload flatMap ((o) -> o.items map ((i) -> { order: o.order, item: i }))' } },

      { h: '14. Read JSON that arrived as text' },
      { ex: { caption: 'Tip', payload: '{ "id": 5, "detail": "{\\"colour\\":\\"red\\",\\"size\\":\\"L\\"}" }', script: '%dw 2.0\noutput application/json\n---\npayload ++ { detail: read(payload.detail, "application/json") }' } },

      { h: '15. Make a total row at the bottom' },
      { ex: { caption: 'Tip', payload: '[{ "item": "Book", "cost": 20 }, { "item": "Pen", "cost": 3 }]', script: '%dw 2.0\noutput application/json\n---\npayload ++ [{ item: "TOTAL", cost: sum(payload.cost) }]' } },

      { h: '16. Use do to name the steps of a long calculation' },
      { ex: { caption: 'Tip', payload: '{ "price": 200, "qty": 3, "discountPct": 10 }', script: '%dw 2.0\noutput application/json\n---\ndo {\n  var gross = payload.price * payload.qty\n  var discount = gross * (payload.discountPct / 100)\n  var net = gross - discount\n  var vat = net * 0.05\n  ---\n  { gross: gross, discount: discount, net: net, vat: vat, total: net + vat }\n}' } },

      { h: '17. Percentages that read nicely' },
      { ex: { caption: 'Tip', script: '%dw 2.0\noutput application/json\nvar done = 37\nvar total = 60\n---\n{\n  raw: done / total,\n  rounded: round((done / total) * 100) ++ "%",\n  formatted: ((done / total) * 100) as String {format: "#.0"} ++ "%"\n}' } },

      { h: '18. Check a whole list in one expression' },
      { ex: { caption: 'Tip', script: '%dw 2.0\nimport * from dw::core::Arrays\noutput application/json\nvar ages = [22, 31, 17, 45]\n---\n{\n  allAdults: ages every ($ >= 18),\n  anyMinor: ages some ($ < 18),\n  howManyMinors: ages countBy ($ < 18)\n}' } },

      { h: '19. Turn a list of pairs into an Object' },
      { ex: { caption: 'Tip', payload: '[["a", 1], ["b", 2], ["c", 3]]', script: '%dw 2.0\noutput application/json\n---\npayload reduce ((pair, acc = {}) -> acc ++ { (pair[0]): pair[1] })' } },

      { h: '20. Compare two lists' },
      { ex: { caption: 'Tip', script: '%dw 2.0\noutput application/json\nvar before = ["a", "b", "c"]\nvar after = ["b", "c", "d"]\n---\n{\n  removed: before -- after,\n  added: after -- before,\n  kept: before filter (after contains $)\n}' } },

      { h: '21. Give a default to every field at once' },
      { ex: { caption: 'Tip', payload: '{ "name": "Max", "city": null, "age": null }', script: '%dw 2.0\noutput application/json\nvar defaults = { name: "unknown", city: "unknown", age: 0 }\n---\ndefaults ++ (payload filterObject ((v) -> v != null))' } },

      { h: '22. Debug with output application/dw' },
      { p: 'It shows the real types, so you can see that <code>"7"</code> is text and <code>7</code> is a number.' },
      { ex: { caption: 'Tip', payload: '{ "id": "7", "when": "2026-08-29" }', script: '%dw 2.0\noutput application/dw\n---\n{\n  raw: payload.id,\n  asNumber: payload.id as Number,\n  asDate: payload.when as Date,\n  type: typeOf(payload.id)\n}' } },

      { note: 'The best trick of all: write the output you want first, as plain JSON. Then work backwards until the script produces it.' }
    ]
  });

  L.push({
    id: 'advanced', cat: CAT, title: 'Advanced DataWeave', nav: 'Advanced Techniques',
    blocks: [
      { p: 'These are the patterns experienced DataWeave developers reach for. None of them are magic — they are all built from things you already know.' },

      { h: 'Currying: a function that makes functions' },
      { p: 'Return a lambda from a function and you get a family of ready made functions.' },
      { ex: { caption: 'Advanced', script: '%dw 2.0\noutput application/json\nfun taxOf(rate) = (amount) -> amount + (amount * rate)\nvar vat = taxOf(0.20)\nvar salesTax = taxOf(0.08)\n---\n{\n  vat: [100, 250] map vat($),\n  salesTax: [100, 250] map salesTax($)\n}' } },

      { h: 'Function composition' },
      { p: 'Build a pipeline out of small functions instead of one long expression.' },
      { ex: { caption: 'Advanced', script: '%dw 2.0\nimport * from dw::core::Strings\noutput application/json\nfun compose(f, g) = (x) -> f(g(x))\nvar clean = compose((s) -> lower(s), (s) -> trim(s))\nvar slug = compose((s) -> dasherize(s), clean)\n---\nslug("   Mayar Academy DataWeave   ")' } },

      { h: 'Recursion over a tree' },
      { p: 'There are no loops, so a self calling function is how you walk a structure of unknown depth.' },
      { ex: { caption: 'Advanced', payload: '{\n  "name": "root",\n  "children": [\n    { "name": "a", "children": [] },\n    { "name": "b", "children": [{ "name": "b1", "children": [] }] }\n  ]\n}', script: '%dw 2.0\noutput application/json\nfun walk(node, depth = 0) =\n  [{ name: node.name, depth: depth }] ++\n  flatten((node.children default []) map ((c) -> walk(c, depth + 1)))\n---\nwalk(payload)' } },

      { h: 'Pattern matching on the head and tail of an Array' },
      { p: 'The <code>~</code> sign splits the first item from the rest. This is how the core library itself is written.' },
      { ex: { caption: 'Advanced', script: '%dw 2.0\noutput application/json\nfun total(list) = list match {\n  case [] -> 0\n  case [h ~ t] -> h + total(t)\n}\nfun myReverse(list) = list match {\n  case [] -> []\n  case [h ~ t] -> myReverse(t) ++ [h]\n}\n---\n{\n  sum: total([10, 20, 30, 40]),\n  reversed: myReverse([1, 2, 3, 4])\n}' } },

      { h: 'Deep rename of every key in a nested structure' },
      { p: 'One recursive function handles Objects, Arrays and plain values.' },
      { ex: { caption: 'Advanced', payload: '{\n  "user_name": "Max",\n  "home_address": { "street_name": "Mule St", "zip_code": "94105" },\n  "past_orders": [{ "order_id": 1 }, { "order_id": 2 }]\n}', script: '%dw 2.0\nimport * from dw::core::Strings\noutput application/json\nfun deepCamel(value) = value match {\n  case o is Object -> o mapObject ((v, k) -> { (camelize(k as String)): deepCamel(v) })\n  case a is Array -> a map ((i) -> deepCamel(i))\n  else -> $\n}\n---\ndeepCamel(payload)' } },

      { h: 'Dynamic output shape from configuration' },
      { p: 'The fields you keep can be decided by data instead of being written into the script.' },
      { ex: { caption: 'Advanced', payload: '{\n  "wanted": ["name", "city"],\n  "record": { "name": "Max", "city": "SF", "secret": "hidden", "age": 12 }\n}', script: '%dw 2.0\noutput application/json\n---\npayload.record filterObject ((v, k) -> payload.wanted contains (k as String))' } },

      { h: 'A pivot: rows into columns' },
      { ex: { caption: 'Advanced', payload: '[\n  { "city": "SF", "month": "jan", "sales": 10 },\n  { "city": "SF", "month": "feb", "sales": 15 },\n  { "city": "NY", "month": "jan", "sales": 20 },\n  { "city": "NY", "month": "feb", "sales": 25 }\n]', script: '%dw 2.0\noutput application/json\n---\n(payload groupBy ((r) -> r.city)) mapObject ((rows, city) -> {\n  (city): rows reduce ((r, acc = {}) -> acc ++ { (r.month): r.sales })\n})' } },

      { h: 'Grouping into the classic role map' },
      { p: 'This exact question is asked in almost every MuleSoft interview.' },
      { ex: { caption: 'Advanced', payload: '{\n  "A": "Admin",\n  "B": "User",\n  "C": "Admin",\n  "D": "Guest"\n}', script: '%dw 2.0\noutput application/json\n---\n(payload pluck ((role, person) -> { p: person as String, r: role }))\n  groupBy ($.r)\n  mapObject ((rows, role) -> { (role): rows.p })' } },

      { h: 'Running totals' },
      { ex: { caption: 'Advanced', payload: '[10, 20, 30, 40]', script: '%dw 2.0\noutput application/json\n---\npayload map ((v, i) -> {\n  value: v,\n  runningTotal: sum(payload[0 to i])\n})' } },

      { h: 'Chunking a big list into pages' },
      { ex: { caption: 'Advanced', script: '%dw 2.0\nimport * from dw::core::Arrays\noutput application/json\nvar rows = 1 to 11\n---\n(rows divideBy 4) map ((chunk, page) -> {\n  page: page + 1,\n  size: sizeOf(chunk),\n  rows: chunk\n})' } },

      { h: 'Safe error handling with try' },
      { ex: { caption: 'Advanced', payload: '["12", "abc", "34"]', script: '%dw 2.0\nimport try from dw::Runtime\noutput application/json\n---\npayload map ((raw) -> do {\n  var attempt = try(() -> raw as Number)\n  ---\n  {\n    input: raw,\n    ok: attempt.success,\n    value: if (attempt.success) attempt.result else null\n  }\n})' } },

      { h: 'Type aliases keep formats in one place' },
      { ex: { caption: 'Advanced', script: '%dw 2.0\noutput application/json\ntype Money = String { format: "#,###.00" }\ntype ShortDate = String { format: "dd/MM/yyyy" }\n---\n{\n  price: 12345.5 as Money,\n  when: |2026-08-29| as ShortDate\n}' } },

      { note: 'Advanced does not mean clever. It means the shape of the code matches the shape of the problem. If a junior cannot read it in a year, it is not advanced — it is just hard.' }
    ]
  });

  L.push({
    id: 'good-bad', cat: CAT, title: 'Good Practice vs Bad Practice', nav: 'Good vs Bad Practice',
    blocks: [
      { p: 'Each pair below solves the same problem. The left one is what not to do. The right one is what to do.' },

      { vs: {
        title: '1. Naming',
        badLabel: 'Bad — nobody can read it',
        bad: '%dw 2.0\noutput application/json\n---\npayload filter ($.a > 3) map { x: $.b, y: $.c * 12 }',
        badWhy: 'Single letters say nothing. In six months this is a puzzle.',
        goodLabel: 'Good — the code explains itself',
        good: '%dw 2.0\noutput application/json\nvar MONTHS = 12\nfun isSenior(person) = person.grade > 3\n---\npayload\n  filter ((person) -> isSenior(person))\n  map ((person) -> {\n    name: person.fullName,\n    yearlyPay: person.monthlyPay * MONTHS\n  })',
        goodWhy: 'Real names, a named rule, and a named constant. No comment needed.'
      } },

      { vs: {
        title: '2. Missing data',
        badLabel: 'Bad — crashes on real data',
        bad: '%dw 2.0\noutput application/json\n---\n{\n  city: payload.address.city,\n  total: payload.price * payload.qty\n}',
        badWhy: 'One missing address and the whole flow fails at 3am.',
        goodLabel: 'Good — survives bad input',
        good: '%dw 2.0\noutput application/json\n---\n{\n  city: payload.address.city default "unknown",\n  total: (payload.price default 0) * (payload.qty default 1)\n}',
        goodWhy: 'Every value that can be missing has a fallback.'
      } },

      { vs: {
        title: '3. Order of operations',
        badLabel: 'Bad — does work it throws away',
        bad: '%dw 2.0\noutput application/json\n---\npayload\n  map ((o) -> o ++ { total: o.price * o.qty })\n  filter ((o) -> o.status == "OPEN")',
        badWhy: 'It calculates a total for every record, then deletes most of them.',
        goodLabel: 'Good — filter first',
        good: '%dw 2.0\noutput application/json\n---\npayload\n  filter ((o) -> o.status == "OPEN")\n  map ((o) -> o ++ { total: o.price * o.qty })',
        goodWhy: 'Only the records you keep get the expensive work.'
      } },

      { vs: {
        title: '4. Repeated lookups',
        badLabel: 'Bad — searches the list again and again',
        bad: '%dw 2.0\noutput application/json\n---\npayload.rows map ((r) -> {\n  code: r.code,\n  label: (payload.codes filter ((c) -> c.id == r.code))[0].label\n})',
        badWhy: 'For 1000 rows and 500 codes that is 500,000 comparisons.',
        goodLabel: 'Good — build the map once',
        good: '%dw 2.0\noutput application/json\nvar lookup = payload.codes reduce ((c, acc = {}) -> acc ++ { (c.id): c.label })\n---\npayload.rows map ((r) -> {\n  code: r.code,\n  label: lookup[r.code]\n})',
        goodWhy: 'One pass to build the table, then instant lookups.'
      } },

      { vs: {
        title: '5. Changing one field',
        badLabel: 'Bad — rebuilds everything by hand',
        bad: '%dw 2.0\noutput application/json\n---\n{\n  id: payload.id,\n  name: payload.name,\n  email: payload.email,\n  phone: payload.phone,\n  city: upper(payload.city),\n  country: payload.country\n}',
        badWhy: 'Add a field upstream and this script silently drops it.',
        goodLabel: 'Good — update just the one path',
        good: '%dw 2.0\noutput application/json\n---\npayload update {\n  case c at .city -> upper(c)\n}',
        goodWhy: 'New fields flow through automatically. One line instead of six.'
      } },

      { vs: {
        title: '6. Types from CSV and XML',
        badLabel: 'Bad — joins text instead of adding',
        bad: '%dw 2.0\noutput application/json\n---\n{ total: payload.price + payload.tax }',
        badWhy: 'CSV and XML give Strings. "10" + "2" becomes "102", not 12.',
        goodLabel: 'Good — cast before you calculate',
        good: '%dw 2.0\noutput application/json\n---\n{ total: (payload.price as Number) + (payload.tax as Number) }',
        goodWhy: 'The cast makes the intent obvious and the maths correct.'
      } },

      { vs: {
        title: '7. Deep nesting',
        badLabel: 'Bad — one giant expression',
        bad: '%dw 2.0\noutput application/json\n---\npayload map ((o) -> {\n  total: (o.lines map ((l) -> l.qty * l.price) reduce ((a, b) -> a + b)) +\n         ((o.lines map ((l) -> l.qty * l.price) reduce ((a, b) -> a + b)) * 0.05)\n})',
        badWhy: 'The same subtotal is computed twice and nothing has a name.',
        goodLabel: 'Good — name the steps with do',
        good: '%dw 2.0\noutput application/json\n---\npayload map ((order) -> do {\n  var subtotal = sum(order.lines map ((l) -> l.qty * l.price))\n  var tax = subtotal * 0.05\n  ---\n  { subtotal: subtotal, tax: tax, total: subtotal + tax }\n})',
        goodWhy: 'Computed once, named clearly, easy to change the tax rate.'
      } },

      { vs: {
        title: '8. Logging',
        badLabel: 'Bad — log statements left in production',
        bad: '%dw 2.0\noutput application/json\n---\npayload map ((p) -> {\n  name: log("name is", p.name),\n  pay: log("pay is", p.pay)\n})',
        badWhy: 'Every record writes two log lines. On a million records that is the outage.',
        goodLabel: 'Good — clean code, log in the flow',
        good: '%dw 2.0\noutput application/json\n---\npayload map ((p) -> {\n  name: p.name,\n  pay: p.pay\n})',
        goodWhy: 'Use a Logger component in the Mule flow, at the level you can switch off.'
      } },

      { vs: {
        title: '9. Hard coded values',
        badLabel: 'Bad — magic numbers everywhere',
        bad: '%dw 2.0\noutput application/json\n---\npayload map ((p) -> {\n  yearly: p.pay * 12,\n  withTax: (p.pay * 12) * 1.15,\n  senior: p.age > 40\n})',
        badWhy: 'What is 1.15? What is 40? Nobody knows, and they appear in ten other scripts.',
        goodLabel: 'Good — named at the top',
        good: '%dw 2.0\noutput application/json\nvar MONTHS_PER_YEAR = 12\nvar TAX_MULTIPLIER = 1.15\nvar SENIOR_AGE = 40\n---\npayload map ((p) -> do {\n  var yearly = p.pay * MONTHS_PER_YEAR\n  ---\n  {\n    yearly: yearly,\n    withTax: yearly * TAX_MULTIPLIER,\n    senior: p.age > SENIOR_AGE\n  }\n})',
        goodWhy: 'Change the tax rate in one place. The rule is readable out loud.'
      } },

      { vs: {
        title: '10. Copy and paste',
        badLabel: 'Bad — the same logic three times',
        bad: '%dw 2.0\noutput application/json\n---\n{\n  billing: {\n    line1: payload.b.l1 default "",\n    city: payload.b.city default "",\n    country: payload.b.country default ""\n  },\n  shipping: {\n    line1: payload.s.l1 default "",\n    city: payload.s.city default "",\n    country: payload.s.country default ""\n  }\n}',
        badWhy: 'Fix a bug in one address block and you must remember the other.',
        goodLabel: 'Good — one function, used twice',
        good: '%dw 2.0\noutput application/json\nfun address(a) = {\n  line1: a.l1 default "",\n  city: a.city default "",\n  country: a.country default ""\n}\n---\n{\n  billing: address(payload.b),\n  shipping: address(payload.s)\n}',
        goodWhy: 'One place to fix. One place to test.'
      } },

      { h: 'The short list' },
      { table: { headers: ['Do this', 'Not this'], rows: [
        ['Name your parameters when the lambda is more than one line', 'Use <code>$</code> everywhere'],
        ['Put <code>default</code> on anything that can be missing', 'Assume the field is always there'],
        ['<code>filter</code> before <code>map</code>', '<code>map</code> everything then throw most away'],
        ['Build a lookup Object once', 'Search the same Array inside a loop'],
        ['<code>update</code> for a single change', 'Rebuild the whole object by hand'],
        ['Cast CSV and XML values with <code>as Number</code>', 'Do maths on Strings'],
        ['Name constants in the header', 'Sprinkle magic numbers through the body'],
        ['Write a <code>fun</code> and reuse it', 'Copy and paste the same block'],
        ['Use <code>do</code> to name the steps', 'One expression six levels deep'],
        ['Remove <code>log</code> before production', 'Log every record forever']
      ] } },
      { note: 'One rule beats all the others: write the script so the next person understands it without asking you. That person is usually you, next year.' }
    ]
  });

  L.push({
    id: 'mistakes', cat: CAT, title: 'Common Mistakes', nav: 'Common Mistakes',
    blocks: [
      { p: 'The errors that catch everyone, and the exact fix for each one.' },

      { h: '1. "Unable to resolve reference"' },
      { p: 'You used a name that does not exist in this scope — often a variable declared inside a <code>do</code> block.' },
      { code: 'var myDo = do {\n  var secret = "hidden"\n  ---\n  1\n}\n---\n{ v: secret }   // Error: Unable to resolve reference of secret.' },
      { p: '<b>Fix:</b> move the variable to the header, or return it from the <code>do</code> block.' },

      { h: '2. Forgetting the else' },
      { code: 'if (x > 5) "big"          // will not compile\nif (x > 5) "big" else ""  // correct' },
      { p: '<b>Fix:</b> every <code>if</code> needs an <code>else</code>, because the expression must always produce a value.' },

      { h: '3. Trailing comma' },
      { code: '{\n  a: 1,\n  b: 2,     // <- this comma breaks it\n}' },
      { p: '<b>Fix:</b> no comma after the last field.' },

      { h: '4. Doing maths on text' },
      { ex: { caption: 'The mistake and the fix', payload: '{ "a": "10", "b": "2" }', script: '%dw 2.0\noutput application/json\n---\n{\n  wrong: payload.a ++ payload.b,\n  alsoWrong: payload.a > payload.b,\n  right: (payload.a as Number) + (payload.b as Number),\n  alsoRight: (payload.a as Number) > (payload.b as Number)\n}' } },
      { p: 'Note <code>"10" &gt; "2"</code> is <code>false</code>, because text is compared letter by letter.' },

      { h: '5. Expecting map to give an Object' },
      { ex: { caption: 'The mistake and the fix', payload: '{ "a": 1, "b": 2 }', script: '%dw 2.0\noutput application/json\n---\n{\n  mapGivesArray: payload map ($),\n  mapObjectGivesObject: payload mapObject { ($$): $ }\n}' } },

      { h: '6. XML output with more than one root' },
      { code: '%dw 2.0\noutput application/xml\n---\n[{ a: 1 }, { a: 2 }]      // fails: XML needs one root\n\n%dw 2.0\noutput application/xml\n---\n{ items: { item: 1, item: 2 } }   // correct' },

      { h: '7. Missing brackets around a lambda' },
      { p: 'Infix functions bind tighter than comparisons, but looser than <code>+ - * /</code>. When in doubt, add brackets.' },
      { ex: { caption: 'Safe every time', payload: '[{ "age": 12 }, { "age": 30 }]', script: '%dw 2.0\noutput application/json\n---\n{\n  safe: payload filter ((p) -> p.age > 18),\n  alsoSafe: payload filter ($.age > 18)\n}' } },

      { h: '8. Using the key as if it were a String' },
      { ex: { caption: 'The fix is one cast', payload: '{ "user_name": "Max" }', script: '%dw 2.0\nimport * from dw::core::Strings\noutput application/json\n---\npayload mapObject ((v, k) -> { (camelize(k as String)): v })' } },

      { h: '9. Dividing by zero' },
      { ex: { caption: 'Guard first', payload: '{ "a": 10, "b": 0 }', script: '%dw 2.0\noutput application/json\n---\n{ result: if (payload.b == 0) null else payload.a / payload.b }' } },

      { h: '10. Thinking selectors return a single value on an Array' },
      { ex: { caption: 'It returns an Array', payload: '[{ "name": "Max" }, { "name": "Astro" }]', script: '%dw 2.0\noutput application/json\n---\n{\n  isAnArray: payload.name,\n  justTheFirst: payload.name[0],\n  alsoFirst: payload[0].name\n}' } },

      { h: '11. Confusing .. and .*' },
      { ex: { caption: 'They are different', payload: '{ "id": 1, "id": 11, "inner": { "id": 2, "id": 22 } }', script: '%dw 2.0\noutput application/json\n---\n{\n  single: payload.id,\n  multiSameLevel: payload.*id,\n  descendantsFirstPerLevel: payload..id,\n  everythingEverywhere: payload..*id\n}' } },

      { h: '12. Recursion with no stop rule' },
      { code: 'fun countDown(n) = [n] ++ countDown(n - 1)   // never stops\n\nfun countDown(n) =\n  if (n <= 0) [0]\n  else [n] ++ countDown(n - 1)              // correct' },
      { note: 'When a script behaves strangely, set <code>output application/dw</code> for a moment. Seeing the real types solves most mysteries in seconds.' }
    ]
  });

})();
