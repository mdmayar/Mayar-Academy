<title>Mayar Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* ============ tokens ============ */
:root{
  --ground:#ffffff;
  --surface:#f4f7f5;
  --surface-2:#eaf0ed;
  --rail:#f7faf8;
  --ink:#12201c;
  --ink-2:#3d4f49;
  --ink-3:#6b7d77;
  --line:#dde5e1;
  --line-2:#c8d5cf;
  --accent:#0d8f5f;
  --accent-ink:#08643f;
  --accent-soft:#e6f4ec;
  --accent-on:#ffffff;
  --bar:#12211d;
  --bar-ink:#e8f0ec;
  --bar-ink-2:#9fb5ac;
  --amber:#8a5b00;
  --amber-soft:#fff6e2;
  --amber-line:#f0d9a8;
  --slab:#0f1d19;
  --slab-ink:#dbe7e1;
  --slab-line:#22352f;
  --danger:#b3261e;
  --danger-soft:#fdeceb;
  --tok-key:#a855f7;
  --tok-str:#0e7490;
  --tok-num:#b45309;
  --tok-fn:#0d8f5f;
  --tok-com:#7c8b86;
  --tok-op:#3d4f49;
  --shadow:0 1px 2px rgba(18,32,28,.06),0 8px 24px -12px rgba(18,32,28,.18);
  --r:10px;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0d1613; --surface:#131f1b; --surface-2:#1a2a25; --rail:#101a17;
    --ink:#e6efeb; --ink-2:#b3c5be; --ink-3:#849a93;
    --line:#22332d; --line-2:#2e453d;
    --accent:#3ec98d; --accent-ink:#7fe3b4; --accent-soft:#132b22; --accent-on:#06231a;
    --bar:#0a1310; --bar-ink:#dcebe4; --bar-ink-2:#8ba79b;
    --amber:#e8b45c; --amber-soft:#2a2213; --amber-line:#4a3c1e;
    --slab:#08110e; --slab-ink:#cfe0d9; --slab-line:#1b2b25;
    --danger:#ff9a91; --danger-soft:#33191a;
    --tok-key:#d8a6ff; --tok-str:#67d5e8; --tok-num:#f0b76a; --tok-fn:#5fd6a0; --tok-com:#6e837c; --tok-op:#a8bcb5;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#0d1613; --surface:#131f1b; --surface-2:#1a2a25; --rail:#101a17;
  --ink:#e6efeb; --ink-2:#b3c5be; --ink-3:#849a93;
  --line:#22332d; --line-2:#2e453d;
  --accent:#3ec98d; --accent-ink:#7fe3b4; --accent-soft:#132b22; --accent-on:#06231a;
  --bar:#0a1310; --bar-ink:#dcebe4; --bar-ink-2:#8ba79b;
  --amber:#e8b45c; --amber-soft:#2a2213; --amber-line:#4a3c1e;
  --slab:#08110e; --slab-ink:#cfe0d9; --slab-line:#1b2b25;
  --danger:#ff9a91; --danger-soft:#33191a;
  --tok-key:#d8a6ff; --tok-str:#67d5e8; --tok-num:#f0b76a; --tok-fn:#5fd6a0; --tok-com:#6e837c; --tok-op:#a8bcb5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}

/* ============ base ============ */
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,kbd,pre,textarea.dw{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}

/* ============ top bar ============ */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--bar);color:var(--bar-ink);
  display:flex;align-items:center;gap:16px;padding:0 18px;height:58px;
  border-bottom:1px solid rgba(255,255,255,.06);
}
.brand{display:flex;align-items:center;gap:10px;color:var(--bar-ink);text-decoration:none;flex:none}
.brand:hover{text-decoration:none}
.mark{
  width:30px;height:30px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,var(--accent) 0%,#0b6f4a 100%);
  display:grid;place-items:center;color:#fff;font-family:"Sora",sans-serif;font-weight:700;font-size:15px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.15}
.brand-name{font-family:"Sora",sans-serif;font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--bar-ink-2)}
.topnav{display:flex;gap:2px;margin-left:6px;flex-wrap:wrap}
.topnav a{
  color:var(--bar-ink-2);font-size:13.5px;font-weight:500;padding:6px 10px;border-radius:7px;
}
.topnav a:hover{background:rgba(255,255,255,.08);color:var(--bar-ink);text-decoration:none}
.topbar .spacer{flex:1}
.searchwrap{position:relative;flex:none}
#search{
  width:210px;max-width:38vw;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:var(--bar-ink);border-radius:8px;padding:7px 10px 7px 30px;font:inherit;font-size:13.5px;
}
#search::placeholder{color:var(--bar-ink-2)}
#search:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.12)}
.searchwrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.menubtn{
  display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--bar-ink);
  border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;
}

/* ============ shell ============ */
.shell{display:flex;align-items:flex-start;max-width:1560px;margin:0 auto}
.sidebar{
  width:268px;flex:none;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;
  background:var(--rail);border-right:1px solid var(--line);padding:14px 0 40px;
  scrollbar-width:thin;
}
.progwrap{padding:4px 16px 14px;margin:0 8px 8px;border-bottom:1px solid var(--line)}
.progtop{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.progtop b{font-family:"Sora",sans-serif;color:var(--accent-ink);font-size:12.5px;letter-spacing:0;text-transform:none}
.progbar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.catlabel{
  font-family:"Sora",sans-serif;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);padding:16px 20px 6px;
}
.sidebar a.lnk{
  display:flex;align-items:center;gap:8px;padding:6px 20px 6px 20px;color:var(--ink-2);
  font-size:14px;line-height:1.4;border-left:3px solid transparent;
}
.sidebar a.lnk:hover{background:var(--surface);color:var(--ink);text-decoration:none}
.sidebar a.lnk.on{background:var(--accent);color:var(--accent-on);border-left-color:var(--accent-ink);font-weight:600}
.sidebar a.lnk.on:hover{background:var(--accent);color:var(--accent-on)}
.sidebar a.lnk .tick{width:14px;flex:none;font-size:11px;color:var(--accent);opacity:0}
.sidebar a.lnk.done .tick{opacity:1}
.sidebar a.lnk.on .tick{color:var(--accent-on)}
.nores{padding:14px 20px;color:var(--ink-3);font-size:13.5px}

main{flex:1;min-width:0;padding:26px 34px 80px;max-width:900px}
.rail{
  width:214px;flex:none;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;
  padding:30px 20px 40px;display:none;
}
@media(min-width:1300px){.rail{display:block}}
.rail h4{font-family:"Sora",sans-serif;font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.rail a{display:block;font-size:13px;color:var(--ink-3);padding:4px 0;line-height:1.4}
.rail a:hover{color:var(--accent-ink);text-decoration:none}

/* ============ content type ============ */
h1{font-family:"Sora",sans-serif;font-size:38px;font-weight:700;letter-spacing:-.025em;line-height:1.12;margin:0 0 6px;text-wrap:balance}
h2{font-family:"Sora",sans-serif;font-size:22px;font-weight:600;letter-spacing:-.012em;margin:34px 0 10px;text-wrap:balance}
h3{font-family:"Sora",sans-serif;font-size:16px;font-weight:600;margin:22px 0 8px}
p{margin:0 0 14px;max-width:68ch}
.lead{font-size:19px;color:var(--ink-2);max-width:62ch}
ul,ol{margin:0 0 16px;padding-left:22px;max-width:68ch}
li{margin:5px 0}
main :is(p,li) code, .rail code, td code, th code{
  background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
  padding:.06em .38em;font-size:.875em;color:var(--accent-ink);white-space:nowrap;
}
b,strong{font-weight:600}
hr{border:0;border-top:1px solid var(--line);margin:34px 0}

.eyebrow{
  font-family:"Sora",sans-serif;font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent);margin:0 0 8px;
}

/* ============ prev / next ============ */
.pager{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 0 22px}
.pager.bottom{margin:40px 0 0;padding-top:22px;border-top:1px solid var(--line)}
.pbtn{
  display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-on);
  padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;border:0;cursor:pointer;
  font-family:inherit;box-shadow:var(--shadow);
}
.pbtn:hover{background:var(--accent-ink);text-decoration:none;color:var(--accent-on)}
.pbtn:disabled{opacity:.35;cursor:default;box-shadow:none}
.pbtn.ghost{background:var(--surface);color:var(--ink-2);box-shadow:none;border:1px solid var(--line)}
.pbtn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.pager .where{font-size:12.5px;color:var(--ink-3);text-align:center;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ example box ============ */
.ex{
  border:1px solid var(--line);border-radius:var(--r);background:var(--accent-soft);
  margin:0 0 22px;overflow:hidden;
}
.ex-head{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  background:var(--surface);
}
.ex-title{font-family:"Sora",sans-serif;font-weight:600;font-size:14px;color:var(--ink)}
.ex-head .fill{flex:1}
.watermark{
  font-family:"Sora",sans-serif;font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);opacity:.7;user-select:none;
}
.tabs{display:flex;gap:4px}
.tab{
  background:transparent;border:1px solid transparent;border-radius:6px;color:var(--ink-3);
  font:inherit;font-size:12px;font-weight:600;padding:3px 9px;cursor:pointer;
}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ground);border-color:var(--line);color:var(--accent-ink)}
pre.code{
  margin:0;padding:14px 16px;overflow-x:auto;font-size:13.5px;line-height:1.6;
  background:var(--ground);color:var(--ink);border-bottom:1px solid var(--line);
}
pre.plain{
  margin:0 0 20px;padding:14px 16px;overflow-x:auto;font-size:13.5px;line-height:1.6;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);
}
.res-head{
  display:flex;align-items:center;gap:8px;padding:8px 14px;font-family:"Sora",sans-serif;
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  background:var(--surface);border-bottom:1px solid var(--line);
}
.res-head .mime{
  font-family:"IBM Plex Mono",monospace;letter-spacing:0;text-transform:none;font-size:11px;
  color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
}
pre.res{
  margin:0;padding:14px 16px;overflow-x:auto;font-size:13.5px;line-height:1.6;
  background:var(--slab);color:var(--slab-ink);
}
pre.res.err{background:var(--danger-soft);color:var(--danger)}
.ex-foot{padding:11px 14px;background:var(--surface);border-top:1px solid var(--line)}
.tryit{
  background:var(--accent);color:var(--accent-on);border:0;border-radius:8px;font:inherit;font-size:13px;
  font-weight:600;padding:7px 14px;cursor:pointer;
}
.tryit:hover{background:var(--accent-ink)}

/* ============ playground ============ */
.play{border-top:1px solid var(--line);background:var(--surface);padding:14px}
.play-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.play-grid.two{grid-template-columns:1fr 1fr}}
.field label{
  display:block;font-family:"Sora",sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;
}
textarea.dw{
  width:100%;min-height:150px;resize:vertical;background:var(--ground);color:var(--ink);
  border:1px solid var(--line-2);border-radius:8px;padding:11px 12px;font-size:13px;line-height:1.6;
  tab-size:2;
}
textarea.dw:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.play-bar{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
.btn{
  background:var(--accent);color:var(--accent-on);border:0;border-radius:8px;font:inherit;font-size:13px;
  font-weight:600;padding:7px 15px;cursor:pointer;
}
.btn:hover{background:var(--accent-ink)}
.btn.sec{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.btn.sec:hover{background:var(--line);color:var(--ink)}
.hint{font-size:12px;color:var(--ink-3)}

/* ============ note ============ */
.note{
  background:var(--amber-soft);border:1px solid var(--amber-line);border-left:4px solid var(--amber);
  border-radius:var(--r);padding:12px 15px;margin:0 0 20px;font-size:14.5px;max-width:68ch;
}
.note b.tag{
  font-family:"Sora",sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--amber);
  display:block;margin-bottom:3px;
}
.note code{background:rgba(0,0,0,.05)!important}

/* ============ tables ============ */
.tablewrap{overflow-x:auto;margin:0 0 22px;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{
  text-align:left;background:var(--surface);color:var(--ink-3);font-family:"Sora",sans-serif;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:9px 13px;
  border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:9px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface)}

/* ============ flow ============ */
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:0 0 22px}
.flow span{
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:13px;
  font-weight:500;
}
.flow span.acc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.flow i{color:var(--ink-3);font-style:normal}

/* ============ quiz + exercise ============ */
.qbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;margin:26px 0 22px}
.qbox h3{margin:0 0 12px;font-size:15px}
.qbox .qn{font-family:"Sora",sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:7px;margin:0 0 12px}
.opt{
  display:flex;gap:10px;align-items:flex-start;background:var(--ground);border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;cursor:pointer;font-size:14.5px;text-align:left;font-family:inherit;color:var(--ink);
}
.opt:hover{border-color:var(--line-2);background:var(--surface-2)}
.opt .bul{
  width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--ink-3);margin-top:1px;font-family:"Sora",sans-serif;
}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.right .bul{background:var(--accent);border-color:var(--accent);color:var(--accent-on)}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.opt.wrong .bul{background:var(--danger);border-color:var(--danger);color:#fff}
.opt[disabled]{cursor:default}
.opt code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:.06em .38em;font-size:.875em;color:var(--accent-ink);font-family:"IBM Plex Mono",monospace}
.verdict{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--ground);border:1px solid var(--line)}
.verdict.ok{border-color:var(--accent);color:var(--accent-ink)}
.verdict.no{border-color:var(--danger);color:var(--danger)}
.score{
  font-family:"Sora",sans-serif;font-size:26px;font-weight:700;color:var(--accent-ink);
}
.quizfoot{position:sticky;bottom:0;background:var(--ground);border-top:1px solid var(--line);padding:12px 0;margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ============ task ============ */
.task{border:1px solid var(--line);border-radius:var(--r);margin:0 0 24px;overflow:hidden;background:var(--ground)}
.task-head{padding:12px 15px;background:var(--surface);border-bottom:1px solid var(--line)}
.task-head .num{font-family:"Sora",sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.task-head h3{margin:2px 0 4px;font-size:16px}
.task-head p{margin:0;font-size:14.5px;color:var(--ink-2)}
.task-body{padding:14px 15px}

/* ============ home hero ============ */
.hero{
  border:1px solid var(--line);border-radius:14px;padding:30px 30px 26px;margin:0 0 26px;
  background:
    radial-gradient(120% 130% at 100% 0%, var(--accent-soft) 0%, transparent 60%),
    var(--surface);
}
.hero h1{font-size:44px;margin-bottom:10px}
.hero .lead{margin-bottom:18px}
.btn-green{
  display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-on);
  padding:11px 20px;border-radius:9px;font-weight:600;font-size:15px;box-shadow:var(--shadow);
}
.btn-green:hover{background:var(--accent-ink);color:var(--accent-on);text-decoration:none}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:0 0 26px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:15px;background:var(--surface)}
.card b{display:block;font-family:"Sora",sans-serif;font-size:15px;margin-bottom:3px}
.card span{font-size:13.5px;color:var(--ink-3)}

/* ============ footer ============ */
.foot{
  border-top:1px solid var(--line);background:var(--surface);padding:26px 34px;color:var(--ink-3);font-size:13px;
}
.foot .in{max-width:1560px;margin:0 auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.foot b{color:var(--ink-2)}

/* ============ syntax ============ */
.tk{color:var(--tok-key);font-weight:600}
.ts{color:var(--tok-str)}
.tn{color:var(--tok-num)}
.tf{color:var(--tok-fn);font-weight:500}
.tc{color:var(--tok-com);font-style:italic}
.to{color:var(--tok-op)}
.td{color:var(--tok-num)}

/* ============ mobile ============ */
.scrim{position:fixed;inset:0;background:rgba(8,16,13,.45);z-index:55;display:none}
@media(max-width:1000px){
  .menubtn{display:block}
  .topnav{display:none}
  main{padding:20px 18px 60px}
  h1{font-size:31px}.hero h1{font-size:33px}.hero{padding:22px 20px}
  .sidebar{
    position:fixed;left:0;top:58px;z-index:58;transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:var(--shadow);width:284px;
  }
  .sidebar.open{transform:translateX(0)}
  .scrim.on{display:block}
}
@media(max-width:560px){
  #search{width:120px}
  .brand-sub{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  L.push({
    id: 'syntax', cat: 'DataWeave Tutorial', title: 'DataWeave Syntax', nav: 'DataWeave Syntax',
    blocks: [
      { h: 'The shape of a script' },
      { p: 'A DataWeave script always looks like this:' },
      { code: '%dw 2.0\noutput application/json\n// more header lines here\n---\n// the body here' },
      { h: 'Rules you must remember' },
      {
        ul: [
          'The header is on top. It is <b>optional</b>, but almost always used.',
          'The separator <code>---</code> comes after the header.',
          'The body is <b>one single expression</b>. It gives one answer.',
          'DataWeave is <b>case sensitive</b>. <code>Name</code> and <code>name</code> are different.',
          'Spaces and new lines do not change the meaning.'
        ]
      },
      { h: 'One expression only' },
      { p: 'The body is one expression. It can be small or very big, but it is still one expression.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n{\n  a: 1 + 1,\n  b: "two",\n  c: [1, 2, 3],\n  d: { deep: true }\n}'
        }
      },
      { h: 'No semicolons' },
      { p: 'You do <b>not</b> end lines with a semicolon. Inside an object or an array you use a comma <code>,</code> between the parts.' },
      { note: 'A common mistake is to put a comma after the <b>last</b> field. Do not do that.' },
      { h: 'Names' },
      { p: 'Names of variables and functions start with a letter or <code>_</code>. After that you can use letters, numbers and <code>_</code>.' },
      { code: 'var myName = "ok"\nvar my_name2 = "ok"\nvar 2names = "not ok"' }
    ],
    exercise: {
      q: 'How many expressions can the body of a DataWeave script have?',
      options: ['Exactly one', 'As many as you want', 'One per output line', 'Zero'],
      answer: 0,
      explain: 'The body is a single expression. It can be long, but it is still one expression that produces one result.'
    }
  });

  L.push({
    id: 'header', cat: 'DataWeave Tutorial', title: 'DataWeave Header', nav: 'DataWeave Header',
    blocks: [
      { h: 'What goes in the header?' },
      { p: 'The header holds the settings for the whole script. These are called <b>directives</b>.' },
      {
        table: {
          headers: ['Directive', 'What it does', 'Example'],
          rows: [
            ['<code>%dw</code>', 'Sets the DataWeave version', '<code>%dw 2.0</code>'],
            ['<code>output</code>', 'Sets the output format', '<code>output application/json</code>'],
            ['<code>input</code>', 'Names an input and its format', '<code>input payload application/xml</code>'],
            ['<code>var</code>', 'Makes a global variable', '<code>var tax = 0.2</code>'],
            ['<code>fun</code>', 'Makes a function', '<code>fun double(n) = n * 2</code>'],
            ['<code>type</code>', 'Makes your own type', '<code>type Money = Number</code>'],
            ['<code>import</code>', 'Brings in a module', '<code>import * from dw::core::Strings</code>'],
            ['<code>ns</code>', 'Declares an XML namespace', '<code>ns ns0 http://acme.com</code>']
          ]
        }
      },
      { h: 'Example with many directives' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "price": 100 }',
          script: '%dw 2.0\noutput application/json\nvar taxRate = 0.15\nfun withTax(n) = n + (n * taxRate)\n---\n{\n  price: payload.price,\n  priceWithTax: withTax(payload.price)\n}'
        }
      },
      { h: 'The output directive' },
      { p: 'The <code>output</code> directive tells the writer which format to use.' },
      { code: 'output application/json\noutput application/xml\noutput application/csv\noutput application/java\noutput text/plain\noutput application/dw' },
      { note: 'If you forget the <code>output</code> line, DataWeave will try to guess. It is much safer to always write it.' },
      { h: 'Writer settings' },
      { p: 'You can add settings after the format. For example, to write CSV without a header row:' },
      {
        ex: {
          caption: 'Example',
          payload: '[{"id":1,"name":"Ali"},{"id":2,"name":"Sara"}]',
          script: '%dw 2.0\noutput application/csv header=false\n---\npayload'
        }
      }
    ],
    exercise: {
      q: 'Which directive creates a global variable?',
      options: ['<code>var</code>', '<code>let</code>', '<code>const</code>', '<code>global</code>'],
      answer: 0,
      explain: 'DataWeave uses var in the header for global variables.'
    }
  });

  L.push({
    id: 'body', cat: 'DataWeave Tutorial', title: 'DataWeave Body', nav: 'DataWeave Body',
    blocks: [
      { h: 'The body' },
      { p: 'The body is everything after <code>---</code>. It builds the answer.' },
      { h: 'The body can be a simple value' },
      { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n42' } },
      { h: 'The body can be an object' },
      { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{ id: 1, active: true }' } },
      { h: 'The body can be an array' },
      { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n["red", "green", "blue"]' } },
      { h: 'The body can use the payload' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "a": 5, "b": 3 }',
          script: '%dw 2.0\noutput application/json\n---\n{\n  sum: payload.a + payload.b,\n  diff: payload.a - payload.b,\n  product: payload.a * payload.b\n}'
        }
      },
      { h: 'The body can call functions' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\nupper("mayar academy")'
        }
      },
      { note: 'Remember: the body always gives back <b>one</b> value. That value can be a number, a string, an object, an array, or anything else.' }
    ]

  L.push({
    id: 'comments', cat: 'DataWeave Tutorial', title: 'DataWeave Comments', nav: 'DataWeave Comments',
    blocks: [
      { h: 'Why use comments?' },
      { p: 'Comments explain your code. DataWeave ignores them.' },
      { h: 'Single line comment' },
      { p: 'Start with two slashes <code>//</code>.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n// this is a comment\n---\n{\n  // the name of the student\n  name: "Mayar"\n}'
        }
      },
      { h: 'Multi line comment' },
      { p: 'Start with <code>/*</code> and end with <code>*/</code>.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n/*\n  This script returns\n  a small object.\n  Written by Mayar.\n*/\n---\n{ ok: true }'
        }
      },
      { h: 'Turn off a line' },
      { p: 'You can put <code>//</code> in front of a line to stop it from running.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n{\n  keep: "yes"\n  // , drop: "no"\n}'
        }
      },
      { note: 'Write comments to explain <b>why</b> you do something, not <b>what</b> the code does. The code already shows what it does.' }
    ]
  });

  L.push({
    id: 'variables', cat: 'DataWeave Basics', title: 'DataWeave Variables', nav: 'DataWeave Variables',
    blocks: [
      { h: 'Global variables' },
      { p: 'You make a global variable in the header with <code>var</code>. You can use it anywhere in the body.' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "price": 200 }',
          script: '%dw 2.0\noutput application/json\nvar conversionRate = 13.15\n---\n{\n  price_dollars: payload.price,\n  price_local: payload.price * conversionRate\n}'
        }
      },
      { h: 'Variables cannot change' },
      { p: 'In DataWeave a variable is like a name for a value. Once it is set, it never changes. This is called <b>immutable</b>.' },
      { code: 'var x = 1\nx = 2   // this is NOT allowed in DataWeave' },
      { h: 'Local variables with do' },
      { p: 'Use <code>do</code> to make a variable that lives only inside a small block.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\ndo {\n  var myVar = 2\n  ---\n  3 + myVar\n}'
        }
      },
      { h: 'A do block that builds an object' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nvar myId = 1234\nvar myDo = do {\n  var fn = "Annie"\n  var ln = "Point"\n  ---\n  {\n    id: myId,\n    firstname: fn,\n    lastname: ln\n  }\n}\n---\n{ person: myDo }'
        }
      },
      { h: 'Scope' },
      { p: 'A variable made inside <code>do</code> cannot be used outside of it. This will give an error:' },
      { code: '%dw 2.0\noutput application/json\nvar myDo = do {\n  var secret = "hidden"\n  ---\n  1\n}\n---\n{ v: secret }   // Error: Unable to resolve reference of secret.' },
      { h: 'A variable can hold a function' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nvar toUpper = (aString) -> upper(aString)\n---\n{\n  loud: toUpper("mayar")\n}'
        }
      },
      { h: 'Mule variables' },
      { p: 'Inside a Mule flow you also get <code>vars</code>. These are variables from earlier steps in the flow.' },
      { code: '%dw 2.0\noutput application/json\n---\n{\n  user: vars.userName,\n  id: vars.userId\n}' }
    ],
    exercise: {
      q: 'What happens if you try to give a variable a new value in DataWeave?',
      options: ['It is not allowed &ndash; variables are immutable', 'The old value is replaced', 'Both values are kept', 'It becomes null'],
      answer: 0,
      explain: 'DataWeave is functional. Values never change. You always build a new value instead.'
    }
  });

  L.push({
    id: 'datatypes', cat: 'DataWeave Basics', title: 'DataWeave Data Types', nav: 'DataWeave Data Types',
    blocks: [
      { h: 'The types' },
      { p: 'DataWeave has simple types and complex types.' },
      {
        table: {
          headers: ['Type', 'Example', 'Meaning'],
          rows: [
            ['String', '<code>"hello"</code> or <code>\'hello\'</code>', 'Text'],

            ['Boolean', '<code>true</code>, <code>false</code>', 'Yes or no'],
            ['Null', '<code>null</code>', 'No value'],
            ['Array', '<code>[1, 2, 3]</code>', 'A list of values'],
            ['Object', '<code>{ a: 1, b: 2 }</code>', 'Key and value pairs'],
            ['Date', '<code>|2026-08-29|</code>', 'A date'],
            ['DateTime', '<code>|2026-08-29T10:30:00Z|</code>', 'A date and a time'],

            ['Regex', '<code>/[0-9]+/</code>', 'A pattern for text'],
            ['Function', '<code>(x) -&gt; x + 1</code>', 'A piece of logic'],
            ['Binary', 'file bytes', 'Raw data']
          ]
        }
      },
      { h: 'Check a type with typeOf' },
      {
        ex: {
          caption: 'Example',

        }
      },
      { h: 'Test a type with is' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n{\n  isText: "abc" is String,\n  isNum: "abc" is Number,\n  isList: [1,2] is Array\n}'
        }
      },
      { note: 'DataWeave has one <code>Number</code> type only. There is no separate int and float.' },
      { h: 'Simple and complex' },
      {
        ul: [
          '<b>Simple types</b> hold one value: String, Number, Boolean, Date.',
          '<b>Complex types</b> hold other values inside: Array and Object.'
        ]
      }
    ],
    exercise: {
      q: 'Which function tells you the type of a value?',
      options: ['<code>typeOf()</code>', '<code>getType()</code>', '<code>typeName()</code>', '<code>classOf()</code>'],
      answer: 0,
      explain: 'typeOf() returns the type name, for example "String" or "Number".'
    }
  });

  L.push({
    id: 'strings', cat: 'DataWeave Basics', title: 'DataWeave Strings', nav: 'DataWeave Strings',
    blocks: [
      { h: 'Making a string' },
      { p: 'A string is text. You can use double quotes or single quotes.' },
      { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n{\n  a: "Hello",\n  b: \'World\'\n}' } },
      { h: 'Joining strings' },
      { p: 'Use <code>++</code> to join two strings.' },

      { h: 'Common string functions' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n{\n  upper: upper("mayar"),\n  lower: lower("MAYAR"),\n  trim: trim("   spaces   "),\n  size: sizeOf("DataWeave"),\n  contains: "DataWeave" contains "Weave",\n  starts: "DataWeave" startsWith "Data",\n  ends: "DataWeave" endsWith "ave",\n  replaced: "I like Java" replace "Java" with "DataWeave"\n}'

      {
        ex: {
          caption: 'Example',

      },

    exercise: {

    }
  });

  L.push({
    id: 'string-interp', cat: 'DataWeave Basics', title: 'DataWeave String Interpolation', nav: 'String Interpolation',
    blocks: [
      { h: 'Put a value inside a string' },
      { p: 'Instead of joining with <code>++</code>, you can put an expression inside <code>$( )</code>.' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "name": "Mayar", "score": 95 }',
          script: '%dw 2.0\noutput application/json\n---\n"Hello $(payload.name), your score is $(payload.score)."'
        }
      },
      { h: 'Any expression works' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n{\n  math: "1 + 1 = $(1 + 1)",\n  fn: "loud: $(upper(\'mayar\'))",\n  cond: "You $(if (10 > 5) \'pass\' else \'fail\')"\n}'
        }
      },
      { h: 'Use it in keys too' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "id": 7 }',
          script: '%dw 2.0\noutput application/json\n---\n{\n  "user_$(payload.id)": "found"\n}'
        }
      },
      { h: 'Show a real dollar sign' },
      { p: 'Put a backslash before it: <code>\\$</code>.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n"Price: \\$$(10 * 3)"'
        }
      },
      { note: 'Interpolation is easier to read than many <code>++</code> signs. Use it when you build a sentence.' }
    ]
  });

          caption: 'Example',

        ex: {

  L.push({
    id: 'reduce', cat: 'Transform Data', title: 'DataWeave Reduce', nav: 'DataWeave Reduce',
    blocks: [
      { h: 'What reduce does' },
      { p: '<code>reduce</code> takes a whole array and turns it into <b>one</b> value.' },
      { code: 'array reduce (item, accumulator) -> newAccumulator' },
      { p: 'The <b>accumulator</b> is the answer so far. It starts as the first item unless you set a start value.' },

      { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n[1, 2, 3, 4, 5] reduce ((item, total) -> total + item)' } },

      { p: 'Put <code>= startValue</code> after the accumulator name.' },
      { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n[1, 2, 3] reduce ((item, total = 100) -> total + item)' } },
      { h: 'Join text' },
      { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n["a", "b", "c"] reduce ((item, acc = "") -> acc ++ item)' } },
      { h: 'Add up a field' },
      {
        ex: {
          caption: 'Example',
          payload: PEOPLE,
          script: '%dw 2.0\noutput application/json\n---\n{\n  totalSalary: payload reduce ((p, total = 0) -> total + p.salary)\n}'
        }
      },
      { h: 'Build an object from an array' },
      {
        ex: {
          caption: 'Example',
          payload: '[{ "k": "a", "v": 1 }, { "k": "b", "v": 2 }]',
          script: '%dw 2.0\noutput application/json\n---\npayload reduce ((item, acc = {}) -> acc ++ { (item.k): item.v })'
        }
      },
      { h: 'Find the biggest' },
      { ex: { caption: 'Example', script: '%dw 2.0\noutput application/json\n---\n[4, 9, 2, 7] reduce ((n, best) -> if (n > best) n else best)' } },

    ],
    exercise: {
      q: 'In <code>reduce ((item, acc) -&gt; ...)</code>, what is <code>acc</code>?',
      options: ['The answer so far', 'The index', 'The whole array', 'The last item'],
      answer: 0,
      explain: 'The accumulator carries the result from one step to the next.'
    }
  });

  L.push({

  L.push({
    id: 'joins', cat: 'Transform Data', title: 'DataWeave Joins', nav: 'DataWeave Joins',
    blocks: [
      { h: 'Joining two lists' },
      { p: 'The Arrays module has <code>join</code>, <code>leftJoin</code> and <code>outerJoin</code>. They work like SQL joins.' },
      { code: 'import * from dw::core::Arrays\n\nleftArray join rightArray (l) -> l.id (r) -> r.id' },
      { h: 'Inner join' },
      { p: 'Keeps only the rows that match on both sides.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\nimport * from dw::core::Arrays\noutput application/json\nvar users = [\n  { id: 1, name: "Ali" },\n  { id: 2, name: "Sara" },\n  { id: 3, name: "Omar" }\n]\nvar orders = [\n  { userId: 1, total: 100 },\n  { userId: 3, total: 250 }\n]\n---\njoin(users, orders, (u) -> u.id, (o) -> o.userId)'
        }
      },
      { h: 'Make it tidy' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\nimport * from dw::core::Arrays\noutput application/json\nvar users = [\n  { id: 1, name: "Ali" },\n  { id: 2, name: "Sara" }\n]\nvar orders = [\n  { userId: 1, total: 100 },\n  { userId: 1, total: 50 }\n]\n---\njoin(users, orders, (u) -> u.id, (o) -> o.userId) map (row) -> {\n  name: row.l.name,\n  total: row.r.total\n}'
        }
      },
      { h: 'Left join' },
      { p: 'Keeps every row on the left, even when there is no match.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\nimport * from dw::core::Arrays\noutput application/json\nvar users = [\n  { id: 1, name: "Ali" },\n  { id: 2, name: "Sara" }\n]\nvar orders = [\n  { userId: 1, total: 100 }\n]\n---\nleftJoin(users, orders, (u) -> u.id, (o) -> o.userId) map (row) -> {\n  name: row.l.name,\n  total: row.r.total default 0\n}'
        }
      },
      { h: 'Join without the module' },
      { p: 'You can also join by hand with <code>map</code> and <code>filter</code>.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nvar users = [{ id: 1, name: "Ali" }, { id: 2, name: "Sara" }]\nvar orders = [{ userId: 1, total: 100 }, { userId: 2, total: 60 }]\n---\nusers map (u) -> {\n  name: u.name,\n  orders: orders filter ((o) -> o.userId == u.id)\n}'
        }
      },
      { note: 'The result of a join is an array of objects with <code>l</code> (left) and <code>r</code> (right).' }
    ]
  });

        ex: {

        }
      },
      { h: 'Writing attributes' },
      { p: 'Put the attributes in <code>@( )</code> after the key.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/xml\n---\n{\n  order @(id: "A100", status: "new"): {\n    customer: "Mayar"\n  }\n}'
        }
      },
      { h: 'Turn an array into repeated tags' },
      {
        ex: {
          caption: 'Example',
          payload: '[{ "name": "Ali" }, { "name": "Sara" }]',
          script: '%dw 2.0\noutput application/xml\n---\n{\n  users: {\n    (payload map (p) -> { user: p.name })\n  }\n}'
        }
      },
      { note: 'XML values are always <b>text</b>. Use <code>as Number</code> when you need to do maths with them.' }
    ],
    exercise: {
      q: 'How do you read the XML attribute <code>id</code> of the element <code>order</code>?',
      options: ['<code>payload.order.@id</code>', '<code>payload.order.id</code>', '<code>payload.order[@id]</code>', '<code>payload.@order.id</code>'],
      answer: 0,
      explain: 'The .@ selector reads attributes.'
    }
  });

  L.push({
    id: 'csv', cat: 'Data Formats', title: 'DataWeave CSV', nav: 'DataWeave CSV',
    blocks: [
      { h: 'Reading CSV' },
      { p: 'A CSV file becomes an <b>array of objects</b>. The header row gives the key names.' },
      {
        ex: {
          caption: 'Example',
          payloadMime: 'application/csv',
          payload: 'name,dept,salary\nAli,IT,5000\nSara,HR,4000\nOmar,IT,6000',
          script: '%dw 2.0\noutput application/json\n---\npayload map (row) -> {\n  employee: row.name,\n  team: row.dept,\n  yearly: (row.salary as Number) * 12\n}'
        }
      },
      { h: 'Filter CSV rows' },
      {
        ex: {
          caption: 'Example',
          payloadMime: 'application/csv',
          payload: 'name,dept,salary\nAli,IT,5000\nSara,HR,4000\nOmar,IT,6000',
          script: '%dw 2.0\noutput application/json\n---\npayload filter ((r) -> r.dept == "IT")'
        }
      },
      { h: 'Writing CSV' },
      {
        ex: {
          caption: 'Example',
          payload: '[{ "id": 1, "name": "Ali" }, { "id": 2, "name": "Sara" }]',
          script: '%dw 2.0\noutput application/csv\n---\npayload'
        }
      },
      { h: 'CSV settings' },
      {
        table: {
          headers: ['Setting', 'What it does'],
          rows: [
            ['<code>header=false</code>', 'Do not write the header row'],
            ['<code>separator=";"</code>', 'Use a different separator'],
            ['<code>quoteValues=true</code>', 'Put quotes around every value']
          ]
        }
      },
      {
        ex: {
          caption: 'Example',
          payload: '[{ "id": 1, "name": "Ali" }, { "id": 2, "name": "Sara" }]',
          script: '%dw 2.0\noutput application/csv separator=";"\n---\npayload'
        }
      },
      { note: 'Every value read from CSV is a <b>String</b>. Cast with <code>as Number</code> before doing maths.' }
    ],
    exercise: {
      q: 'What type do you get when DataWeave reads a CSV file?',
      options: ['Array of Objects', 'Object of Arrays', 'A String', 'An Array of Strings'],
      answer: 0,
      explain: 'Each CSV row becomes an object, and all the rows become an array.'
    }
  });

  L.push({
    id: 'java', cat: 'Data Formats', title: 'DataWeave Java', nav: 'DataWeave Java',
    blocks: [
      { h: 'The Java format' },
      { p: '<code>application/java</code> gives you real Java objects: <code>Map</code>, <code>List</code>, <code>String</code>, <code>BigDecimal</code>.' },
      { p: 'You use it when the next step in your Mule flow is a Java component or a database connector.' },
      { code: '%dw 2.0\noutput application/java\n---\n{\n  id: payload.id as Number,\n  name: payload.name as String,\n  createdAt: now()\n}' },
      { h: 'Making a typed Java object' },
      { code: '%dw 2.0\noutput application/java\n---\n{\n  firstName: "Mayar",\n  lastName: "Ahmed"\n} as Object { class: "com.acme.Person" }' },
      { h: 'Other formats you can use' },
      {
        table: {
          headers: ['MIME type', 'Use it for'],
          rows: [
            ['<code>application/json</code>', 'REST APIs'],
            ['<code>application/xml</code>', 'SOAP, old systems'],
            ['<code>application/csv</code>', 'Files, reports'],
            ['<code>application/java</code>', 'Java code, databases'],
            ['<code>application/yaml</code>', 'Config files'],
            ['<code>text/plain</code>', 'Plain text'],
            ['<code>application/dw</code>', 'Debugging your own script'],
            ['<code>multipart/form-data</code>', 'File upload'],
            ['<code>application/octet-stream</code>', 'Raw bytes']
          ]
        }
      },
      { note: 'When you debug, set <code>output application/dw</code>. It shows the exact internal shape of your data, including types.' }
    ]
  });

  L.push({
    id: 'readwrite', cat: 'Data Formats', title: 'DataWeave Read & Write', nav: 'Read & Write',
    blocks: [
      { h: 'read' },
      { p: '<code>read</code> turns a <b>string</b> into data. Use it when a field holds JSON or XML as text.' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "id": 1, "detailsAsText": "{\\"color\\":\\"red\\",\\"size\\":\\"L\\"}" }',
          script: '%dw 2.0\noutput application/json\n---\n{\n  id: payload.id,\n  details: read(payload.detailsAsText, "application/json")\n}'
        }
      },
      { h: 'write' },
      { p: '<code>write</code> does the opposite. It turns data into a string.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n{\n  asText: write({ a: 1, b: 2 }, "application/json"),\n  asCsv: write([{ x: 1 }, { x: 2 }], "application/csv")\n}'
        }
      },
      { h: 'Read CSV text' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nvar csvText = "name,age\\nAli,30\\nSara,25"\n---\nread(csvText, "application/csv")'
        }
      },
      { note: 'A common job: an API sends you a field that contains JSON inside a string. <code>read</code> unwraps it.' }
    ]
  });

  /* ---------------- ADVANCED ---------------- */

  L.push({
    id: 'types', cat: 'Advanced', title: 'DataWeave Type System', nav: 'Type System',
    blocks: [
      { h: 'Make your own type' },
      { p: 'Use <code>type</code> in the header to give a name to a shape.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\ntype Currency = String { format: "###.00" }\ntype Money = Number\n---\n{\n  price: 45.5 as Currency,\n  qty: 3 as Money\n}'
        }
      },
      { h: 'Types on function parameters' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nfun addTax(amount: Number, rate: Number): Number = amount + (amount * rate)\n---\naddTax(100, 0.15)'
        }
      },
      { h: 'Check a type at run time' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "a": "text", "b": 5, "c": [1,2], "d": null }',
          script: '%dw 2.0\noutput application/json\n---\npayload mapObject ((v, k) -> {\n  (k): typeOf(v)\n})'
        }
      },
      { h: 'Type hierarchy' },
      {
        ul: [
          '<code>Any</code> is the top. Every value is an <code>Any</code>.',
          '<code>Nothing</code> is the bottom. No value is a <code>Nothing</code>.',
          '<code>Null</code>, <code>String</code>, <code>Number</code>, <code>Boolean</code>, <code>Date</code> types are simple.',
          '<code>Array</code> and <code>Object</code> hold other values.'
        ]
      },
      { note: 'Types in DataWeave are optional. Add them when you want the compiler to catch your mistakes early.' }
    ]
  });

  L.push({
    id: 'pattern', cat: 'Advanced', title: 'Pattern Matching', nav: 'Pattern Matching',
    blocks: [
      { h: 'Take an array apart' },
      { p: 'You can split an array into the <b>head</b> (first item) and the <b>tail</b> (the rest).' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n[1, 2, 3, 4] match {\n  case [head ~ tail] -> { first: head, rest: tail }\n  case [] -> { empty: true }\n}'
        }
      },
      { h: 'Build your own joinBy' },
      { p: 'This is how recursion and pattern matching work together.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nfun myJoin(elements, separator) =\n  elements match {\n    case [head ~ tail] -> if (isEmpty(tail)) head\n                          else head ++ separator ++ myJoin(tail, separator)\n    case [] -> ""\n  }\n---\nmyJoin(["a", "b", "c"], "-")'
        }
      },
      { h: 'Take an object apart' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\n---\n{ hello: "world", test: true } match {\n  case { k: v ~ tail } -> { firstKey: k, firstValue: v, rest: tail }\n  case {} -> { empty: true }\n}'
        }
      },
      { h: 'Sum a list without reduce' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\noutput application/json\nfun total(list) = list match {\n  case [] -> 0\n  case [h ~ t] -> h + total(t)\n}\n---\ntotal([10, 20, 30, 40])'
        }
      },
      { note: 'The <code>~</code> sign splits head from tail. It is only used inside a <code>match</code> case.' }
    ]
  });

  L.push({
    id: 'errors', cat: 'Advanced', title: 'DataWeave Error Handling', nav: 'Error Handling',
    blocks: [
      { h: 'Errors happen' },
      { p: 'Common causes: bad casting, a null value, or dividing by zero.' },
      { h: 'try' },
      { p: '<code>try</code> runs code safely. It gives back an object with <code>success</code> and either <code>result</code> or <code>error</code>.' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\nimport try from dw::Runtime\noutput application/json\n---\n{\n  good: try(() -> 10 / 2),\n  bad: try(() -> 10 / 0)\n}'
        }
      },
      { h: 'Use the result safely' },
      {
        ex: {
          caption: 'Example',
          script: '%dw 2.0\nimport try from dw::Runtime\noutput application/json\nvar attempt = try(() -> "abc" as Number)\n---\nif (attempt.success) attempt.result else 0'
        }
      },
      { h: 'fail' },
      { p: 'Stop the script on purpose with your own message.' },
      { code: '%dw 2.0\nimport fail from dw::Runtime\noutput application/json\n---\nif (payload.id == null)\n  fail("id is required")\nelse\n  payload' },
      { h: 'Prevent errors instead' },
      { p: 'The best answer is often to stop the error from happening at all.' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "a": 10, "b": 0 }',
          script: '%dw 2.0\noutput application/json\n---\n{\n  safeDivide: if (payload.b == 0) null else payload.a / payload.b,\n  safeName: payload.name default "unknown",\n  safeList: (payload.items default []) map ($)\n}'
        }
      },
      { note: 'In Mule you also have <b>Error Handlers</b> in the flow. DataWeave errors bubble up to them.' }
    ]
  });

  L.push({
    id: 'logging', cat: 'Advanced', title: 'DataWeave Logging', nav: 'DataWeave Logging',
    blocks: [
      { h: 'See what is inside' },
      { p: 'The <code>log</code> function prints a value to the Mule log and gives back the same value. Your script keeps working.' },
      { code: '%dw 2.0\noutput application/json\n---\npayload map (p) -> {\n  name: log("current name", p.name)\n}' },
      { h: 'Log levels' },
      {
        table: {
          headers: ['Function', 'Level'],
          rows: [
            ['<code>logInfo(msg, value)</code>', 'INFO'],
            ['<code>logDebug(msg, value)</code>', 'DEBUG'],
            ['<code>logWarn(msg, value)</code>', 'WARN'],
            ['<code>logError(msg, value)</code>', 'ERROR']
          ]
        }
      },
      { h: 'Debug with output application/dw' },
      { p: 'This shows you the exact types DataWeave sees.' },
      {
        ex: {
          caption: 'Example',
          payload: '{ "id": "7", "when": "2026-08-29" }',
          script: '%dw 2.0\noutput application/dw\n---\n{\n  raw: payload.id,\n  asNumber: payload.id as Number,\n  asDate: payload.when as Date\n}'
        }
      },
      { note: 'Take your <code>log</code> lines out before you go to production. They slow the script down.' }
    ]
  });

  L.push({
    id: 'mule', cat: 'Advanced', title: 'DataWeave in Mule', nav: 'DataWeave in Mule',
    blocks: [
      { h: 'Where DataWeave lives in Mule 4' },
      {
        ul: [
          'In the <b>Transform Message</b> component &ndash; a full script.',
          'In any field with <code>#[ ]</code> &ndash; a one line expression.',
          'In a <b>.dwl</b> file inside <code>src/main/resources</code>.'
        ]
      },
      { h: 'The Mule message' },
      {
        table: {
          headers: ['Name', 'What it holds'],
          rows: [
            ['<code>payload</code>', 'The main data'],
            ['<code>attributes</code>', 'Extra info: HTTP headers, query params, file name'],
            ['<code>vars</code>', 'Variables you set earlier in the flow'],
            ['<code>error</code>', 'Error details, only inside an error handler']
          ]
        }
      },
      { h: 'Inline expressions' },
      { code: '<set-variable variableName="now" value="#[now()]" />\n<set-payload value="#[payload.user.name]" />\n<choice>\n  <when expression="#[payload.age >= 18]"> ... </when>\n</choice>' },
      { h: 'Reading HTTP attributes' },
      { code: '%dw 2.0\noutput application/json\n---\n{\n  method: attributes.method,\n  path: attributes.requestPath,\n  queryId: attributes.queryParams.id,\n  auth: attributes.headers.authorization\n}' },
      { h: 'A full Transform Message' },
      { code: '%dw 2.0\noutput application/json\n---\n{\n  requestId: vars.correlationId,\n  receivedAt: now(),\n  customer: {\n    id: payload.customerId,\n    name: payload.firstName ++ " " ++ payload.lastName\n  },\n  lines: payload.items map (i) -> {\n    sku: i.sku,\n    qty: i.quantity,\n    total: i.quantity * i.price\n  }\n}' },
      { note: 'Inside <code>#[ ]</code> you cannot write a header. You only write one expression.' }
    ]
  });

  L.push({
    id: 'best', cat: 'Advanced', title: 'DataWeave Best Practices', nav: 'Best Practices',
    blocks: [
      { h: 'Write code people can read' },
      {
        ul: [
          'Give variables and functions real names, not <code>a</code> and <code>b</code>.',
          'Use the long form <code>(item) -&gt; ...</code> when the logic is more than one line.',
          'Use <code>do</code> to name the steps of a long calculation.',
          'Put reusable logic in <code>fun</code>, not copied five times.'
        ]
      },
      { h: 'Be safe with data' },
      {
        ul: [
          'Use <code>default</code> for any field that may be missing.',
          'Use <code>?</code> to check a key before you use it.',
          'Cast CSV and XML values with <code>as Number</code> before maths.',
          'Never divide before you check for zero.'
        ]
      },
      { h: 'Good and bad' },
      {
        ex: {
          caption: 'Example - hard to read',
          payload: PEOPLE,
          script: '%dw 2.0\noutput application/json\n---\npayload filter ($.name != null and $.salary > 4000) map { n: $.name, s: $.salary * 12 }'
        }
      },
      {
        ex: {
          caption: 'Example - easy to read',
          payload: PEOPLE,
          script: '%dw 2.0\noutput application/json\nvar MONTHS_PER_YEAR = 12\nfun isWellPaid(person) = person.salary > 4000\n---\npayload\n  filter ((person) -> isWellPaid(person))\n  map ((person) -> {\n    name: person.name,\n    yearlySalary: person.salary * MONTHS_PER_YEAR\n  })'
        }
      },
      { h: 'Speed' },
      {
        ul: [
          'Do <code>filter</code> before <code>map</code>. Then you map fewer items.',
          'Do not call the same expensive function twice. Put it in a variable.',
          'Take <code>log</code> out of production code.'
        ]
      },
      { note: 'A script you can read six months later is worth more than a clever one line script.' }
    ]
  });
})();

<script>

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }

  /* ---------- syntax highlighting ---------- */
  var KW = ['output','input','import','from','var','fun','type','ns','do','if','else','match','case','is','as','not','and','or','default','true','false','null','update','at','using','payload','vars','attributes'];
  var FN = ['map','mapObject','filter','filterObject','reduce','groupBy','orderBy','distinctBy','pluck','flatten','flatMap','joinBy','splitBy','sizeOf','upper','lower','trim','replace','with','contains','startsWith','endsWith','indexOf','sum','avg','max','min','maxBy','minBy','abs','ceil','floor','round','sqrt','pow','mod','isEmpty','isBlank','isEven','isOdd','isInteger','isDecimal','keysOf','valuesOf','namesOf','entriesOf','typeOf','now','uuid','read','write','log','then','onNull','to','zip','daysBetween','isLeapYear','capitalize','camelize','dasherize','underscore','pluralize','singularize','ordinalize','repeat','reverse','leftPad','rightPad','substringAfter','substringBefore','withMaxSize','take','drop','takeWhile','dropWhile','every','some','countBy','sumBy','firstWith','indexWhere','partition','divideBy','splitAt','slice','join','leftJoin','outerJoin','try','fail','failIf','orElse','matches','find','scan','words','lines','countMatches','charCode','random','randomInt','flatten'];
  var RX = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\|[^|\n]*\|)|(%dw\s+[\d.]+)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)|(-{3})|([-+*/=<>!~?.,:;(){}\[\]$@#&]+)/g;
  function hl(src) {
    var out = '', last = 0, m;
    RX.lastIndex = 0;
    while ((m = RX.exec(src)) !== null) {
      out += esc(src.slice(last, m.index));
      last = m.index + m[0].length;

      else if (m[2]) out += '<span class="ts">' + esc(m[2]) + '</span>';

      else if (m[7]) out += '<span class="tk">---</span>';
      else out += '<span class="to">' + esc(m[8]) + '</span>';

    out += esc(src.slice(last));

  /* ---------- run a script ---------- */
  function runScript(script, payload, mime) {

  function fillResult(pre, head, script, payload, mime) {
    var r = runScript(script, payload, mime);
    if (r.ok) {
      pre.className = 'res';
      pre.textContent = r.output;
      if (head) head.textContent = r.mime || 'application/json';
    } else {
      pre.className = 'res err';
      pre.textContent = 'Error: ' + r.error;
      if (head) head.textContent = 'error';
    }
  }

  /* ---------- deterministic shuffle so answers are not always first ---------- */
  function shuffled(list, seed) {
    var idx = list.map(function (_, i) { return i; });
    var s = seed * 9301 + 49297;
    for (var i = idx.length - 1; i > 0; i--) {
      s = (s * 9301 + 49297) % 233280;
      var j = Math.floor((s / 233280) * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    return idx;
  }

  /* ---------- block renderers ---------- */
  function renderExample(ex) {
    var box = el('div', 'ex');
    var head = el('div', 'ex-head');
    head.appendChild(el('span', 'ex-title', esc(ex.caption || 'Example')));
    head.appendChild(el('span', 'fill'));
    if (ex.payload) {
      var tabs = el('div', 'tabs');
      var tS = el('button', 'tab on', 'Script');
      var tI = el('button', 'tab', 'Input');
      tabs.appendChild(tS); tabs.appendChild(tI);
      head.appendChild(tabs);
    }
    head.appendChild(el('span', 'watermark', 'Mayar'));
    box.appendChild(head);

    var preS = el('pre', 'code', hl(ex.script));
    box.appendChild(preS);
    var preI = null;
    if (ex.payload) {
      preI = el('pre', 'code', esc(ex.payload));
      preI.hidden = true;
      box.appendChild(preI);
      head.querySelector('.tab').onclick = function () { preS.hidden = false; preI.hidden = true; setTab(head, 0); };
      head.querySelectorAll('.tab')[1].onclick = function () { preS.hidden = true; preI.hidden = false; setTab(head, 1); };
    }

    var rh = el('div', 'res-head', 'Result <span class="fill" style="flex:1"></span>');
    var mimeTag = el('span', 'mime', 'application/json');
    rh.appendChild(mimeTag);
    box.appendChild(rh);
    var res = el('pre', 'res', '');
    box.appendChild(res);
    fillResult(res, mimeTag, ex.script, ex.payload, ex.payloadMime);

    var foot = el('div', 'ex-foot');
    var btn = el('button', 'tryit', 'Try it Yourself &#187;');
    foot.appendChild(btn);
    box.appendChild(foot);

    var play = null;
    btn.onclick = function () {
      if (play) { play.remove(); play = null; btn.innerHTML = 'Try it Yourself &#187;'; return; }
      play = buildPlayground(ex);
      box.appendChild(play);
      btn.innerHTML = 'Close the editor';
      play.querySelector('textarea').focus();
    };
    return box;
  }
  function setTab(head, n) {
    var ts = head.querySelectorAll('.tab');
    for (var i = 0; i < ts.length; i++) ts[i].classList.toggle('on', i === n);
  }

  function buildPlayground(ex) {
    var wrap = el('div', 'play');
    var grid = el('div', 'play-grid' + (ex.payload ? ' two' : ''));
    var fS = el('div', 'field', '<label>DataWeave script</label>');
    var taS = el('textarea', 'dw');
    taS.spellcheck = false; taS.value = ex.script;
    fS.appendChild(taS); grid.appendChild(fS);
    var taI = null;
    if (ex.payload) {
      var fI = el('div', 'field', '<label>Input payload &nbsp;(' + esc(ex.payloadMime || 'application/json') + ')</label>');
      taI = el('textarea', 'dw');
      taI.spellcheck = false; taI.value = ex.payload;
      fI.appendChild(taI); grid.appendChild(fI);
    }
    wrap.appendChild(grid);

    var bar = el('div', 'play-bar');
    var run = el('button', 'btn', 'Run &#9654;');
    var reset = el('button', 'btn sec', 'Reset');
    var copy = el('button', 'btn sec', 'Copy');
    bar.appendChild(run); bar.appendChild(reset); bar.appendChild(copy);
    bar.appendChild(el('span', 'hint', 'Tip: change the code, then press Run. Ctrl + Enter also works.'));
    wrap.appendChild(bar);

    var oh = el('div', 'res-head', 'Your result');
    oh.style.marginTop = '12px';
    oh.style.border = '1px solid var(--line)';
    oh.style.borderRadius = '8px 8px 0 0';
    var out = el('pre', 'res', '');
    out.style.border = '1px solid var(--line)';
    out.style.borderTop = '0';
    out.style.borderRadius = '0 0 8px 8px';
    wrap.appendChild(oh); wrap.appendChild(out);

    function go() { fillResult(out, null, taS.value, taI ? taI.value : ex.payload, ex.payloadMime); }
    run.onclick = go;
    reset.onclick = function () { taS.value = ex.script; if (taI) taI.value = ex.payload; go(); };
    copy.onclick = function () {
      try { navigator.clipboard.writeText(taS.value); copy.textContent = 'Copied'; setTimeout(function () { copy.textContent = 'Copy'; }, 1400); } catch (e) {}
    };
    taS.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); go(); }
      if (e.key === 'Tab') { e.preventDefault(); var s = this.selectionStart; this.value = this.value.slice(0, s) + '  ' + this.value.slice(this.selectionEnd); this.selectionStart = this.selectionEnd = s + 2; }
    });
    go();
    return wrap;
  }

  function renderTask(t) {
    var box = el('div', 'task');
    var head = el('div', 'task-head');
    head.appendChild(el('div', 'num', 'Exercise ' + t.n));
    head.appendChild(el('h3', null, esc(t.title)));
    head.appendChild(el('p', null, t.text));
    box.appendChild(head);

    var body = el('div', 'task-body');
    var grid = el('div', 'play-grid' + (t.payload ? ' two' : ''));
    var fS = el('div', 'field', '<label>Your script</label>');
    var taS = el('textarea', 'dw'); taS.spellcheck = false; taS.value = t.start;
    fS.appendChild(taS); grid.appendChild(fS);
    var taI = null;
    if (t.payload) {
      var fI = el('div', 'field', '<label>Input payload</label>');
      taI = el('textarea', 'dw'); taI.spellcheck = false; taI.value = t.payload;
      fI.appendChild(taI); grid.appendChild(fI);
    }
    body.appendChild(grid);

    var bar = el('div', 'play-bar');
    var run = el('button', 'btn', 'Run &#9654;');
    var sol = el('button', 'btn sec', 'Show the answer');
    bar.appendChild(run); bar.appendChild(sol);
    body.appendChild(bar);

    var oh = el('div', 'res-head', 'Your result');
    oh.style.cssText = 'margin-top:12px;border:1px solid var(--line);border-radius:8px 8px 0 0';
    var out = el('pre', 'res', '');
    out.style.cssText = 'border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px';
    body.appendChild(oh); body.appendChild(out);

    function go() { fillResult(out, null, taS.value, taI ? taI.value : t.payload, 'application/json'); }
    run.onclick = go;
    var shown = false;
    sol.onclick = function () {
      shown = !shown;
      if (shown) {
        var a = el('div', 'field'); a.id = 'sol' + t.n;
        a.style.marginTop = '12px';
        a.innerHTML = '<label>One good answer</label>';
        var p = el('pre', 'code', hl(t.solution));
        p.style.cssText = 'border:1px solid var(--line);border-radius:8px';
        a.appendChild(p);
        var use = el('button', 'btn sec', 'Put it in the editor');
        use.style.marginTop = '9px';
        use.onclick = function () { taS.value = t.solution; go(); };
        a.appendChild(use);
        body.appendChild(a);
        sol.textContent = 'Hide the answer';
      } else {
        var old = document.getElementById('sol' + t.n);
        if (old) old.remove();
        sol.textContent = 'Show the answer';
      }
    };
    go();
    box.appendChild(body);
    return box;
  }

  function renderExercise(x, seed) {
    var box = el('div', 'qbox');
    box.appendChild(el('div', 'qn', 'Check yourself'));
    box.appendChild(el('h3', null, x.q));
    var opts = el('div', 'opts');
    var order = shuffled(x.options, seed + 7);
    var buttons = [];
    order.forEach(function (origIdx, pos) {
      var b = el('button', 'opt');
      b.innerHTML = '<span class="bul">' + 'ABCD'[pos] + '</span><span>' + x.options[origIdx] + '</span>';
      b.dataset.orig = origIdx;
      opts.appendChild(b); buttons.push(b);
    });
    box.appendChild(opts);
    var v = el('div', 'verdict');
    v.hidden = true;
    box.appendChild(v);
    buttons.forEach(function (b) {
      b.onclick = function () {
        var right = +b.dataset.orig === x.answer;
        buttons.forEach(function (o) {
          o.disabled = true;
          if (+o.dataset.orig === x.answer) o.classList.add('right');
        });
        if (!right) b.classList.add('wrong');
        v.hidden = false;
        v.className = 'verdict ' + (right ? 'ok' : 'no');
        v.innerHTML = (right ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + esc(x.explain || '');
      };
    });
    return box;
  }

  function renderQuiz(qs) {
    var wrap = el('div');
    var state = new Array(qs.length).fill(null);
    qs.forEach(function (q, n) {
      var box = el('div', 'qbox');
      box.appendChild(el('div', 'qn', 'Question ' + (n + 1) + ' of ' + qs.length));
      box.appendChild(el('h3', null, q.q));
      var opts = el('div', 'opts');
      var order = shuffled(q.o, n + 3);
      var buttons = [];
      order.forEach(function (origIdx, pos) {
        var b = el('button', 'opt');
        b.innerHTML = '<span class="bul">' + 'ABCD'[pos] + '</span><span>' + q.o[origIdx] + '</span>';
        b.dataset.orig = origIdx;
        opts.appendChild(b); buttons.push(b);
      });
      box.appendChild(opts);
      buttons.forEach(function (b) {
        b.onclick = function () {
          if (state[n] !== null) return;
          state[n] = (+b.dataset.orig === q.a);
          buttons.forEach(function (o) {
            o.disabled = true;
            if (+o.dataset.orig === q.a) o.classList.add('right');
          });
          if (!state[n]) b.classList.add('wrong');
          tally();
        };
      });
      wrap.appendChild(box);
    });
    var foot = el('div', 'quizfoot');
    var scoreEl = el('span', 'score', '0 / ' + qs.length);
    var msg = el('span', 'hint', 'Answer every question to see how you did.');
    var again = el('button', 'btn sec', 'Start again');
    again.onclick = function () { location.reload(); };
    foot.appendChild(scoreEl); foot.appendChild(msg); foot.appendChild(again);
    wrap.appendChild(foot);
    function tally() {
      var answered = state.filter(function (s) { return s !== null; }).length;
      var right = state.filter(function (s) { return s === true; }).length;
      scoreEl.textContent = right + ' / ' + qs.length;
      if (answered < qs.length) { msg.textContent = answered + ' answered, ' + (qs.length - answered) + ' to go.'; return; }
      var pct = Math.round(right / qs.length * 100);
      msg.textContent = pct >= 90 ? 'Excellent. You know DataWeave well.'
        : pct >= 70 ? 'Good work. Read the lessons you missed and try again.'
        : pct >= 50 ? 'Not bad. Go through the tutorial once more.'
        : 'Start again from DataWeave Intro. You will get it.';
    }
    return wrap;
  }

  function renderBlocks(blocks, seed) {
    var frag = document.createDocumentFragment();
    blocks.forEach(function (b) {
      if (b.h) { frag.appendChild(el('h2', null, esc(b.h))); return; }
      if (b.p) { frag.appendChild(el('p', null, b.p)); return; }
      if (b.hero) { frag.appendChild(el('div', 'hero', b.hero)); return; }
      if (b.html) { var d = el('div', null, b.html); frag.appendChild(d); return; }
      if (b.lead) { frag.appendChild(el('p', 'lead', b.lead)); return; }
      if (b.ul) { frag.appendChild(el('ul', null, b.ul.map(function (i) { return '<li>' + i + '</li>'; }).join(''))); return; }
      if (b.ol) { frag.appendChild(el('ol', null, b.ol.map(function (i) { return '<li>' + i + '</li>'; }).join(''))); return; }
      if (b.code) { frag.appendChild(el('pre', 'plain', hl(b.code))); return; }
      if (b.note) { frag.appendChild(el('div', 'note', '<b class="tag">Note</b>' + b.note)); return; }
      if (b.flow) {
        var f = el('div', 'flow');
        b.flow.forEach(function (s, i) {
          if (i) f.appendChild(el('i', null, '&#8594;'));
          f.appendChild(el('span', i === 2 ? 'acc' : '', esc(s)));
        });
        frag.appendChild(f); return;
      }
      if (b.table) {
        var w = el('div', 'tablewrap');
        var t = el('table');
        t.innerHTML = '<thead><tr>' + b.table.headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead>'
          + '<tbody>' + b.table.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody>';
        w.appendChild(t); frag.appendChild(w); return;
      }
      if (b.ex) { frag.appendChild(renderExample(b.ex)); return; }
      if (b.task) { frag.appendChild(renderTask(b.task)); return; }
      if (b.quiz) { frag.appendChild(renderQuiz(b.quiz)); return; }
    });
    return frag;
  }

  /* ---------- sidebar ---------- */
  var sidebar = document.getElementById('sidebar');
  function buildSidebar() {
    sidebar.innerHTML = '';
    var prog = el('div', 'progwrap');
    var pct = Math.round(Object.keys(done).length / L.length * 100);
    prog.innerHTML = '<div class="progtop"><span>Your progress</span><b>' + pct + '%</b></div>'
      + '<div class="progbar"><i style="width:' + pct + '%"></i></div>';
    sidebar.appendChild(prog);
    var lastCat = null;
    L.forEach(function (l) {
      if (l.cat !== lastCat) { sidebar.appendChild(el('div', 'catlabel', esc(l.cat))); lastCat = l.cat; }
      var a = el('a', 'lnk' + (done[l.id] ? ' done' : ''));
      a.href = '#' + l.id;
      a.dataset.id = l.id;
      a.innerHTML = '<span class="tick">&#10003;</span><span>' + esc(l.nav || l.title) + '</span>';
      sidebar.appendChild(a);
    });
    markActive();
  }
  function markActive() {
    var cur = (location.hash || '#home').slice(1);
    sidebar.querySelectorAll('a.lnk').forEach(function (a) { a.classList.toggle('on', a.dataset.id === cur); });
  }

  /* ---------- search ---------- */
  document.getElementById('search').addEventListener('input', function () {
    var q = this.value.trim().toLowerCase();
    var links = sidebar.querySelectorAll('a.lnk'), cats = sidebar.querySelectorAll('.catlabel');
    if (!q) {
      links.forEach(function (a) { a.style.display = ''; });
      cats.forEach(function (c) { c.style.display = ''; });
      var nr = sidebar.querySelector('.nores'); if (nr) nr.remove();
      return;
    }
    var hits = 0;
    links.forEach(function (a) {
      var l = byId[a.dataset.id];
      var hay = (l.title + ' ' + (l.nav || '') + ' ' + l.cat).toLowerCase();
      var show = hay.indexOf(q) >= 0;
      a.style.display = show ? '' : 'none';
      if (show) hits++;
    });
    cats.forEach(function (c) { c.style.display = 'none'; });
    var nr = sidebar.querySelector('.nores');
    if (!hits) { if (!nr) { var d = el('div', 'nores', 'No lesson matches that.'); sidebar.appendChild(d); } }
    else if (nr) nr.remove();
  });

  /* ---------- render a lesson ---------- */
  var main = document.getElementById('main');
  var rail = document.getElementById('rail');

  function pager(l, bottom) {
    var p = el('div', 'pager' + (bottom ? ' bottom' : ''));
    var prev = L[l.i - 1], next = L[l.i + 1];
    var b1 = el('a', 'pbtn ghost', '&#10094; Previous');
    if (prev) b1.href = '#' + prev.id; else { b1.classList.add('off'); b1.style.opacity = '.35'; b1.style.pointerEvents = 'none'; }
    var mid = el('span', 'where', bottom ? (next ? 'Next up: ' + esc(next.title) : 'That is the end. Well done!') : (l.i + 1) + ' of ' + L.length);
    var b2 = el('a', 'pbtn', 'Next &#10095;');
    if (next) b2.href = '#' + next.id; else { b2.style.opacity = '.35'; b2.style.pointerEvents = 'none'; }
    p.appendChild(b1); p.appendChild(mid); p.appendChild(b2);
    return p;
  }

  function show(id) {
    var l = byId[id] || L[0];
    main.innerHTML = '';
    main.appendChild(pager(l, false));
    if (l.id !== 'home') {
      main.appendChild(el('div', 'eyebrow', esc(l.cat)));
      main.appendChild(el('h1', null, esc(l.title)));
    }
    var body = el('div');
    body.appendChild(renderBlocks(l.blocks, l.i));
    main.appendChild(body);
    if (l.exercise) main.appendChild(renderExercise(l.exercise, l.i));
    main.appendChild(pager(l, true));

    /* on this page */
    var hs = body.querySelectorAll('h2');
    if (hs.length > 1) {
      rail.innerHTML = '<h4>On this page</h4>';
      hs.forEach(function (h, n) {
        h.id = 'sec' + n;
        var a = el('a', null, esc(h.textContent));
        a.href = '#' + id;
        a.onclick = function (e) { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
        rail.appendChild(a);
      });
      rail.style.visibility = 'visible';
    } else { rail.innerHTML = ''; }

    document.title = l.id === 'home' ? 'Mayar Academy' : l.title + ' - Mayar Academy';
    if (!done[l.id]) { done[l.id] = 1; saveDone(done); }
    buildSidebar();
    var sq = document.getElementById('search');
    if (sq && sq.value.trim()) sq.dispatchEvent(new Event('input'));
    var active = sidebar.querySelector('a.lnk.on');
    if (active && active.scrollIntoView) {
      var r = active.getBoundingClientRect();
      if (r.top < 100 || r.bottom > window.innerHeight - 20) active.scrollIntoView({ block: 'center' });
    }
    window.scrollTo(0, 0);
    closeMenu();
  }

  /* ---------- navigation ---------- */
  function go(delta) {
    var cur = byId[(location.hash || '#home').slice(1)] || L[0];
    var t = L[cur.i + delta];
    if (t) location.hash = '#' + t.id;
  }
  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });
  window.addEventListener('hashchange', function () { show((location.hash || '#home').slice(1)); });

  /* ---------- mobile menu ---------- */
  var scrim = document.getElementById('scrim');
  function closeMenu() { sidebar.classList.remove('open'); scrim.classList.remove('on'); }
  document.getElementById('menubtn').onclick = function () {
    sidebar.classList.toggle('open'); scrim.classList.toggle('on');
  };
  scrim.onclick = closeMenu;

  /* ---------- start ---------- */
  buildSidebar();
  show((location.hash || '#home').slice(1));
})();
</script>
